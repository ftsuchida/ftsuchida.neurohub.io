<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Reflexo da Tachinha</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007AFF'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='7' width='8' height='8' rx='2'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' opacity='.6'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' opacity='.6'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' opacity='.35'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* Layout: a cena 3D ocupa a tela inteira; lista, ficha e controles flutuam sobre ela em painéis translúcidos.
   No celular, lista e ficha viram uma folha inferior. Tipografia: SF Pro pela fonte do sistema. */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, "Segoe UI", Roboto, Arial, sans-serif;
  --bg0: #F8F8FA; --bg1: #E4E4EA; --fog: #EEEEF2; --clay: #DCDCE2;
  --label: #1D1D1F; --label2: #6E6E73; --label3: #A1A1A6;
  --sep: rgba(60, 60, 67, .14); --fill: rgba(118, 118, 128, .12); --fill2: rgba(118, 118, 128, .2);
  --glass: rgba(255, 255, 255, .74); --glass-edge: rgba(0, 0, 0, .07); --thumb: #FFFFFF;
  --accent: #007AFF; --accent-soft: rgba(0, 122, 255, .12); --on-accent: #FFFFFF;
  --shadow: 0 10px 34px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .06);
  --ghost: #7C8AA5;
  --pad: 16px; --side: 268px; --insp: 340px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg0: #232327; --bg1: #0A0A0C; --fog: #19191C; --clay: #3C3C42;
    --label: #F5F5F7; --label2: #A1A1A6; --label3: #6E6E73;
    --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
    --glass: rgba(34, 34, 37, .74); --glass-edge: rgba(255, 255, 255, .09); --thumb: #636366;
    --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .24); --on-accent: #FFFFFF;
    --shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .3);
    --ghost: #9FB1D1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg0: #232327; --bg1: #0A0A0C; --fog: #19191C; --clay: #3C3C42;
  --label: #F5F5F7; --label2: #A1A1A6; --label3: #6E6E73;
  --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
  --glass: rgba(34, 34, 37, .74); --glass-edge: rgba(255, 255, 255, .09); --thumb: #636366;
  --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .24); --on-accent: #FFFFFF;
  --shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .3);
  --ghost: #9FB1D1;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--label);
  background: var(--bg1);
  font: 400 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
svg.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; overflow: hidden; background: radial-gradient(120% 95% at 50% 38%, var(--bg0), var(--bg1)); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#gl.pt { cursor: pointer; }
#leaders, #labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#gl, #leaders, #labels { transition: opacity .17s ease; }
#app.fade #gl, #app.fade #leaders, #app.fade #labels { opacity: 0; }

/* painéis */
.glass {
  background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
}
#panes { display: contents; }
#grab { display: none; }
#sidebar, #inspector { position: absolute; border-radius: 18px; }
#sidebar { top: var(--pad); left: var(--pad); bottom: var(--pad); width: var(--side); display: flex; flex-direction: column; min-height: 0; }
#inspector { top: var(--pad); right: var(--pad); width: var(--insp); max-height: calc(100% - 2 * var(--pad)); overflow-y: auto; overscroll-behavior: contain; }

/* lista */
.search { position: relative; margin: 12px 12px 6px; flex: none; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--label2); pointer-events: none; }
.search input {
  width: 100%; height: 34px; padding: 0 10px 0 31px; border: 0; border-radius: 10px; background: var(--fill);
  font-size: 15px; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--label2); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
#list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 8px 12px; }
#list h2 { margin: 14px 10px 4px; font-size: 12px; line-height: 1.3; font-weight: 600; color: var(--label2); }
#list ul { list-style: none; margin: 0; padding: 0; }
#list button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 5px 10px; border-radius: 8px; font-size: 14px; line-height: 1.25; }
#list button:hover { background: var(--fill); }
#list button[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
#list .none { margin: 18px 10px; color: var(--label2); font-size: 14px; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .18); }
[aria-current="true"] > .dot { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .85); }

/* ficha */
.ins { padding: 20px 20px 22px; }
.ins-top { display: flex; align-items: flex-start; gap: 12px; }
.ins-top > div { flex: 1 1 auto; min-width: 0; }
.ins h1 { margin: 0; font-size: 26px; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; text-wrap: balance; }
.ins .aka { margin: 4px 0 0; font-size: 15px; color: var(--label2); }
.close { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--label2); display: grid; place-items: center; font-size: 15px; }
.close:hover { background: var(--fill2); }
.close svg { stroke-width: 2.2; }
.back { display: none; }
.rows { margin: 16px 0 0; padding: 0; list-style: none; background: var(--fill); border-radius: 12px; }
.rows > * { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 9px 14px; font-size: 14px; }
.rows > * + * { box-shadow: inset 0 .5px 0 var(--sep); }
.rows dt { color: var(--label); flex: none; }
.rows dd { margin: 0; color: var(--label2); text-align: right; font-variant-numeric: tabular-nums; }
.ins h2 { margin: 20px 0 3px; font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--label2); }
.ins p { margin: 0; font-size: 15px; line-height: 1.45; max-width: 60ch; }
.ins .lead { margin-top: 10px; color: var(--label2); }
.ins ul.more { margin: 2px 0 0; padding: 0 0 0 1.15em; font-size: 14.5px; line-height: 1.42; }
.ins ul.more li { margin: 5px 0 0; padding-left: 2px; }
.ins ul.more li::marker { color: var(--label3); }
.tag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 5px; background: var(--fill2); color: var(--label2); font-size: 11px; font-weight: 600; line-height: 16px; vertical-align: 1px; }
.actions { margin-top: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 500; }
.btn:hover { filter: brightness(1.07); }
.btn svg { font-size: 15px; }
.rows.links > li { display: block; padding: 0; }
.rows.links button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px 9px 14px; font-size: 15px; border-radius: inherit; }
.rows.links li:first-child button { border-radius: 12px 12px 0 0; }
.rows.links li:last-child button { border-radius: 0 0 12px 12px; }
.rows.links li:only-child button { border-radius: 12px; }
.rows.links button:hover { background: var(--fill); }
.rows.links .name { flex: 1 1 auto; min-width: 0; }
.rows.links .sub { display: block; font-size: 13px; color: var(--label2); }
.rows.links .chev { color: var(--label3); font-size: 13px; }
.rows.links .num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--fill2); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--label2); }
.ins .foot { margin-top: 16px; font-size: 12.5px; line-height: 1.45; color: var(--label2); }

/* barra de vistas */
#toolbar {
  position: absolute; bottom: var(--pad); left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2);
  transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 15px; max-width: calc(100% - var(--side) - var(--insp) - 5 * var(--pad));
}
.seg { display: flex; padding: 2px; border-radius: 9px; background: var(--fill); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { height: 30px; padding: 0 13px; border-radius: 7px; font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--label); }
.seg button[aria-pressed="true"] { background: var(--thumb); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .06); }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; background: var(--fill); font-size: 13px; font-weight: 500; white-space: nowrap; flex: none; }
.tb:hover { background: var(--fill2); }
.tb svg { font-size: 15px; }
.tb svg.chev { font-size: 12px; color: var(--label2); margin-left: -2px; }
.tb.icon { width: 34px; padding: 0; justify-content: center; }
.tb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tb[disabled] { opacity: .45; cursor: default; }
svg.ic.fill { fill: currentColor; stroke: none; }

/* rótulos da cena */
.lab {
  position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap;
  font-size: 12.5px; line-height: 1.2; font-weight: 500; letter-spacing: -.003em; color: var(--label); padding: 2px 6px; border-radius: 7px;
  text-shadow: 1px 0 0 var(--fog), -1px 0 0 var(--fog), 0 1px 0 var(--fog), 0 -1px 0 var(--fog), 1px 1px 0 var(--fog), -1px -1px 0 var(--fog), 1px -1px 0 var(--fog), -1px 1px 0 var(--fog),
    0 0 3px var(--fog), 0 0 6px var(--fog), 0 0 9px var(--fog);
}
.lab:hover { color: var(--accent); }
.lab.sel { background: var(--accent); color: var(--on-accent); text-shadow: none; font-weight: 600; }
.lab.note { pointer-events: none; font-weight: 400; font-size: 12px; color: var(--label2); padding: 0; }
.lab.hot {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 13px; text-shadow: none;
  color: var(--accent); font-weight: 600; background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: 0 3px 12px rgba(0, 0, 0, .12);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
}
.lab.hot svg { font-size: 14px; stroke-width: 2; }
#leaders line { stroke: var(--label2); stroke-width: .75; opacity: .8; }
#leaders circle { fill: var(--bg0); stroke: var(--label); stroke-width: 1.2; }
#tip { position: absolute; left: 0; top: 0; pointer-events: none; padding: 4px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
/* cartão do passo a passo */
#stepper {
  position: absolute; bottom: calc(var(--pad) + 62px); left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2); transform: translateX(-50%);
  width: min(580px, calc(100% - var(--side) - var(--insp) - 5 * var(--pad))); border-radius: 16px; padding: 14px 16px 12px; overflow: hidden;
}
.st-count { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--label2); font-variant-numeric: tabular-nums; }
#stepper h2 { margin: 1px 0 0; font-size: 19px; line-height: 1.2; font-weight: 700; letter-spacing: -.015em; }
.st-text { margin: 6px 0 0; font-size: 14.5px; line-height: 1.42; color: var(--label); min-height: 4.2em; max-width: 64ch; }
.st-ctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.st-ctl .grow { flex: 1 1 auto; }
.tb.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 0 14px; }
.tb.primary:hover { background: var(--accent); filter: brightness(1.07); }
.st-dots { display: flex; gap: 5px; align-items: center; }
.st-dots button { width: 8px; height: 8px; border-radius: 50%; background: var(--fill2); padding: 0; position: relative; }
.st-dots button::after { content: ""; position: absolute; inset: -7px -3px; }
.st-dots button[aria-current="true"] { background: var(--accent); width: 20px; border-radius: 4px; }
.st-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); opacity: .9; }
#busy { position: absolute; top: 46%; left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2); transform: translate(-50%, -50%); padding: 9px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--label2); }
#nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--label2); }

/* celular e tablet: folha inferior */
@media (max-width: 900px) {
  :root { --pad: 10px; }
  #toolbar { top: calc(var(--pad) + env(safe-area-inset-top, 0px)); bottom: auto; left: var(--pad); right: var(--pad); transform: none; max-width: none; gap: 6px; }
  .seg { flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: 1 0 auto; padding: 0 6px; text-align: center; font-size: 12.5px; }
  #panes {
    display: flex; flex-direction: column; position: absolute; left: 0; right: 0; bottom: 0; height: var(--sheet, 46%); max-height: calc(100% - 64px - env(safe-area-inset-top, 0px));
    border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .32s cubic-bezier(.2, .85, .25, 1);
    background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  }
  #panes.drag { transition: none; }
  #grab { display: block; flex: none; width: 100%; height: 22px; touch-action: none; cursor: grab; }
  #grab::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 7px auto 0; }
  #sidebar, #inspector { position: static; width: auto; max-height: none; flex: 1 1 auto; min-height: 0; border-radius: 0; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #panes[data-pane="list"] #inspector, #panes[data-pane="detail"] #sidebar { display: none; }
  .search { margin-top: 2px; }
  .ins { padding: 4px 16px 20px; }
  .ins h1 { font-size: 24px; }
  #busy { left: 50%; top: 30%; }
  #stepper { left: var(--pad); right: var(--pad); bottom: calc(var(--sheet, 46%) + 8px); transform: none; width: auto; padding: 11px 13px 10px; }
  #stepper h2 { font-size: 17px; }
  .st-text { font-size: 13.5px; min-height: 0; }
  /* com a folha levantada, o cartão sai da frente da cena */
  #app[data-sheet="half"] #stepper, #app[data-sheet="full"] #stepper { display: none; }
}
/* voltar ao hub: no computador, no alto da lista; em tela estreita, no começo da barra de vistas */
.home { display: flex; align-items: center; gap: 3px; align-self: flex-start; flex: none; margin: 11px 12px 0; padding: 2px 6px 2px 2px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
.home:hover { background: var(--accent-soft); }
.home svg { font-size: 13px; stroke-width: 2; }
.home + .search { margin-top: 7px; }
a.tb { color: var(--label); text-decoration: none; }
.home-tb { display: none; }
@media (max-width: 900px) {
  #sidebar .home { display: none; }
  .home + .search { margin-top: 2px; }
  .home-tb { display: inline-flex; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="Modelo 3D do reflexo da tachinha. Use a lista de estruturas e o passo a passo para navegar pelo teclado."></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels"></div>
  <div id="nogl" hidden>Este navegador não conseguiu abrir a cena 3D. A lista, as fichas e o texto dos passos continuam funcionando.</div>

  <div id="toolbar" class="glass">
    <a class="tb icon home-tb" href="../../index.html" aria-label="Voltar ao NeuroHub" title="Voltar ao NeuroHub"><svg class="ic" viewBox="0 0 16 16"><path d="M2.4 7.6 8 2.9l5.6 4.7M3.9 6.5v6.6h2.9V9.7h2.400v3.400h2.9V6.5"/></svg></a>
    <div class="seg" id="seg" role="group" aria-label="Vistas"></div>
    <button type="button" class="tb icon" id="tags" aria-pressed="true" aria-label="Mostrar rótulos" title="Rótulos"><svg class="ic" viewBox="0 0 16 16"><path d="M2.5 3.6v3.7c0 .3.1.6.3.8l5.6 5.6c.4.4 1.1.4 1.6 0l3.7-3.7c.4-.5.4-1.200 0-1.6L8.100 2.800a1.100 1.100 0 0 0-.8-.3H3.600c-.6 0-1.100.5-1.100 1.100z"/><circle cx="5.4" cy="5.4" r=".9"/></svg></button>
  </div>

  <section id="stepper" class="glass" aria-label="Passo a passo">
    <p class="st-count" id="stCount"></p>
    <h2 id="stTitle"></h2>
    <p class="st-text" id="stText" role="status"></p>
    <div class="st-ctl">
      <button type="button" class="tb icon" id="stPrev" aria-label="Passo anterior"><svg class="ic" viewBox="0 0 16 16"><path d="M10 3.500 5.500 8 10 12.500"/></svg></button>
      <button type="button" class="tb primary" id="stPlay"></button>
      <button type="button" class="tb icon" id="stNext" aria-label="Próximo passo"><svg class="ic" viewBox="0 0 16 16"><path d="m6 3.500 4.500 4.500L6 12.500"/></svg></button>
      <span class="grow"></span>
      <div class="st-dots" id="stDots" role="group" aria-label="Ir para um passo"></div>
    </div>
    <div class="st-bar" id="stBar"></div>
  </section>
  <div id="tip" class="glass" hidden></div>
  <div id="busy" class="glass" role="status" hidden>Montando a vista…</div>

  <div id="panes" data-pane="list">
    <div id="grab" aria-hidden="true"></div>
    <aside id="sidebar" class="glass" aria-label="Estruturas">
      <a class="home" href="../../index.html" title="Voltar ao NeuroHub"><svg class="ic" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8 10 12.5"/></svg>NeuroHub</a>
      <label class="search"><svg class="ic" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.3"/><path d="m10.300 10.300 3.200 3.200"/></svg><input id="q" type="search" placeholder="Buscar estrutura" autocomplete="off" spellcheck="false" aria-label="Buscar estrutura"></label>
      <nav id="list"></nav>
    </aside>
    <aside id="inspector" class="glass" aria-live="polite"></aside>
  </div>

la.",rel:["pele","terminacao"]},{id:"pele",g:"est",name:"Pele",color:"#EBC7AE",morf:"Tecido que reveste o corpo. Dentro dela ficam as termina\xE7\xF5es dos neur\xF4nios sensoriais.",func:"\xC9 onde o est\xEDmulo mec\xE2nico vira sinal el\xE9trico.",more:[{x:"O desenho mostra a pele como um bloco s\xF3, com a superf\xEDcie em tom mais escuro. As camadas da pele n\xE3o entram nos cap\xEDtulos 1 a 6."}],where:"Na vista Pele: o bloco cortado ao meio, com a sola do p\xE9 virada para baixo.",rel:["tachinha","terminacao"]},{id:"terminacao",g:"sens",name:"Termina\xE7\xE3o sensorial",color:"#4C8FEF",morf:"Ponta do ax\xF4nio do neur\xF4nio sensorial, dentro da pele. A membrana tem canais de Na\u207A que abrem quando ela \xE9 esticada.",func:"Transforma o estiramento em sinal el\xE9trico. O Na\u207A entra e despolariza a termina\xE7\xE3o: \xE9 o potencial gerador. Se ele atinge o limiar, nasce um potencial de a\xE7\xE3o.",clueTitle:"Por que importa",clue:"No neur\xF4nio sensorial, a zona de gatilho fica aqui, perto da termina\xE7\xE3o. No neur\xF4nio t\xEDpico do enc\xE9falo e da medula, ela fica no cone de implanta\xE7\xE3o.",more:["\xC9 tudo ou nada: abaixo do limiar, nada acontece; acima dele, sai o potencial de a\xE7\xE3o completo.","Um est\xEDmulo mais forte n\xE3o gera um potencial de a\xE7\xE3o maior: gera mais disparos por segundo. \xC9 assim que a intensidade \xE9 codificada."],where:"Na vista Pele: os ramos azuis e o bot\xE3o que fica logo acima da ponta da tachinha.",rel:["canal-est","sodio","sensorial"]},{id:"canal-est",g:"sens",name:"Canal de Na\u207A sens\xEDvel a estiramento",color:"#2FA36B",morf:"Prote\xEDna da membrana da termina\xE7\xE3o sensorial, com um poro que abre quando a membrana \xE9 esticada.",func:"Deixa o Na\u207A entrar. Como h\xE1 muito mais Na\u207A fora e o interior \xE9 negativo, ele entra com for\xE7a e despolariza a termina\xE7\xE3o.",clueTitle:"Tr\xEAs jeitos de abrir um canal",clue:"Este abre com estiramento. Os canais do potencial de a\xE7\xE3o abrem com voltagem. Os das sinapses abrem com neurotransmissor.",where:"Na vista Pele: os pares verdes na superf\xEDcie do bot\xE3o da termina\xE7\xE3o. Eles se afastam quando a tachinha estica a membrana.",rel:["terminacao","sodio"]},{id:"sodio",g:"sens",name:"S\xF3dio (Na\u207A)",color:"#F29A4A",rows:[["Fora","150 mM"],["Dentro","15 mM"],["Equil\xEDbrio","+62 mV"]],morf:"C\xE1tion dez vezes mais concentrado fora do neur\xF4nio.",func:"Quando um canal de Na\u207A abre, ele entra: a difus\xE3o e o interior negativo empurram no mesmo sentido. A entrada de carga positiva despolariza a membrana.",more:["\xC9 o mesmo \xEDon nos tr\xEAs pontos da hist\xF3ria: entra na termina\xE7\xE3o da pele, entra a cada trecho do ax\xF4nio no potencial de a\xE7\xE3o e entra na fibra muscular pelo receptor nicot\xEDnico."],where:"Nas vistas Pele e M\xFAsculo: as esferas alaranjadas.",rel:["canal-est","receptor"]},{id:"sensorial",g:"sens",name:"Neur\xF4nio sensorial",aka:"Neur\xF4nio sensorial prim\xE1rio",color:"#3D7DE0",morf:"Neur\xF4nio com a termina\xE7\xE3o na pele e o ax\xF4nio dentro do nervo, at\xE9 a medula.",func:"Leva a informa\xE7\xE3o da pele at\xE9 a medula, em potenciais de a\xE7\xE3o.",clueTitle:"Por que importa",clue:"O potencial de a\xE7\xE3o se regenera a cada trecho do ax\xF4nio. Por isso chega \xE0 medula com o mesmo tamanho com que saiu do p\xE9.",more:["O nervo sensorial dispara em alta frequ\xEAncia.","A informa\xE7\xE3o vai na frequ\xEAncia e no padr\xE3o dos disparos, como em um c\xF3digo Morse.","Na ordem de grandeza do cap\xEDtulo 4, a 10 m/s e com 2 ms de dura\xE7\xE3o, cada potencial de a\xE7\xE3o ocupa uns 2 cm de ax\xF4nio.","Ax\xF4nios finos, como os que levam a dor, s\xE3o os mais sens\xEDveis \xE0 anestesia local.",{x:"O corpo celular deste neur\xF4nio fica no g\xE2nglio da raiz dorsal, ao lado da medula."}],where:"O fio azul: sai da sola do p\xE9, sobe pela perna dentro do nervo e entra na medula pela raiz dorsal.",rel:["terminacao","nervo","raiz-dorsal","sinapse"]},{id:"nervo",g:"sens",name:"Nervo",color:"#E3D6AE",morf:"Feixe de ax\xF4nios fora do sistema nervoso central.",func:"Liga a medula \xE0 perna. Mistura fibras sensoriais, que sobem, e fibras motoras, que descem.",clueTitle:"Por que importa",clue:"Cada fibra conduz num s\xF3 sentido. O mesmo nervo leva a not\xEDcia da tachinha para cima e o comando de contra\xE7\xE3o para baixo, em fibras diferentes.",more:["Os nervos formam o sistema nervoso perif\xE9rico.","Neles, quem faz a bainha de mielina \xE9 a c\xE9lula de Schwann."],where:"O tubo claro que envolve o fio azul e o fio vermelho, da medula at\xE9 a perna.",rel:["sensorial","motor","raiz-dorsal","raiz-ventral"]},{id:"raiz-dorsal",g:"sens",name:"Raiz dorsal",color:"#8DB4F2",morf:"Perto da medula, as fibras de cada nervo se dividem em duas ra\xEDzes. A dorsal \xE9 a de tr\xE1s.",func:"\xC9 por ela que a informa\xE7\xE3o sensorial entra na medula.",clueTitle:"Na hist\xF3ria",clue:"Por volta de 1810, Bell e Magendie cortaram ra\xEDzes espinhais: cortar a ventral paralisa, e a dorsal leva informa\xE7\xE3o sensorial. Foi assim que se soube que um nervo mistura os dois tipos de fibra.",where:"Na vista Medula: o ramo de tr\xE1s, com uma dilata\xE7\xE3o no meio.",rel:["raiz-ventral","ganglio","sensorial"]},{id:"ganglio",g:"sens",name:"G\xE2nglio da raiz dorsal",color:"#B9CFF3",morf:"Dilata\xE7\xE3o na raiz dorsal, ao lado da medula.",func:"Abriga os corpos celulares dos neur\xF4nios sensoriais.",more:[{x:"Esta estrutura n\xE3o est\xE1 nos cap\xEDtulos 1 a 6. Entrou no modelo porque o neur\xF4nio sensorial precisa de um corpo celular, e \xE9 ali que ele fica."}],where:"Na vista Medula: o bulbo transl\xFAcido na raiz dorsal, com o corpo celular azul dentro.",rel:["raiz-dorsal","sensorial"]},{id:"medula",g:"med",name:"Medula espinhal",color:"#EADFC8",morf:"Parte do sistema nervoso central, junto com o enc\xE9falo.",func:"\xC9 onde o sinal da tachinha passa do neur\xF4nio sensorial para outros neur\xF4nios e se divide: um caminho sobe ao enc\xE9falo, o outro vai aos neur\xF4nios motores.",clueTitle:"Por que importa",clue:"O comando para levantar o p\xE9 sai daqui. Ele n\xE3o espera o enc\xE9falo.",more:["A glicina \xE9 o transmissor inibit\xF3rio da medula e do tronco. Sem essa inibi\xE7\xE3o, os reflexos ficam exagerados: \xE9 o efeito da estricnina.",{x:"Em corte, a subst\xE2ncia cinzenta fica no meio, em forma de borboleta, e a branca em volta."}],where:"Na vista Corpo: o cord\xE3o claro que desce do enc\xE9falo pelas costas. Na vista Medula: uma fatia em corte.",rel:["cinzenta","branca","encefalo","interneuronio"]},{id:"cinzenta",g:"med",name:"Subst\xE2ncia cinzenta",color:"#CDB8C6",morf:"A parte mais escura do tecido nervoso.",func:"Recebe e envia informa\xE7\xE3o pelas fibras da subst\xE2ncia branca.",more:[{x:"\xC9 onde ficam os corpos celulares dos neur\xF4nios e as sinapses. Na medula, tem forma de borboleta: a parte de tr\xE1s recebe o ax\xF4nio sensorial, e na da frente ficam os neur\xF4nios motores."}],where:"Na vista Medula: a borboleta no meio da fatia.",rel:["branca","medula","sinapse"]},{id:"branca",g:"med",name:"Subst\xE2ncia branca",color:"#F3ECDA",morf:"A parte mais clara do tecido nervoso. \xC9 cont\xEDnua com os nervos.",func:"Cont\xE9m as fibras que levam e trazem informa\xE7\xE3o da subst\xE2ncia cinzenta.",more:["No modelo, o ax\xF4nio que sobe ao enc\xE9falo corre por ela.",{x:"A cor clara vem da mielina que envolve os ax\xF4nios."}],where:"Na vista Medula: a parte clara em volta da borboleta.",rel:["cinzenta","ascendente"]},{id:"sinapse",g:"med",name:"Sinapse na medula",color:"#C97BD8",morf:"Contato entre o terminal do ax\xF4nio sensorial e o neur\xF4nio seguinte.",func:"O potencial de a\xE7\xE3o chega ao terminal, o Ca\xB2\u207A entra e as ves\xEDculas liberam o transmissor, provavelmente glutamato. Do outro lado, os canais deixam entrar carga positiva: \xE9 um PEPS.",clueTitle:"Por que importa",clue:"Uma sinapse sozinha gera um PEPS de alguns d\xE9cimos de mV, que n\xE3o basta. Como o nervo sensorial dispara em alta frequ\xEAncia e muitas sinapses s\xE3o ativadas juntas, os PEPS se somam e levam a zona de gatilho ao limiar.",more:["Soma\xE7\xE3o temporal: PEPS da mesma sinapse em sequ\xEAncia r\xE1pida. Soma\xE7\xE3o espacial: PEPS de v\xE1rias sinapses ao mesmo tempo.","O glutamato \xE9 o principal transmissor excitat\xF3rio do sistema nervoso central."],where:"Na vista Medula: os bot\xF5es lil\xE1s onde um ax\xF4nio encosta no neur\xF4nio seguinte.",rel:["sensorial","interneuronio","ascendente","motor"]},{id:"interneuronio",g:"med",name:"Interneur\xF4nio",color:"#2FB3A1",morf:"Neur\xF4nio que s\xF3 se conecta com outros neur\xF4nios. A maioria dos neur\xF4nios \xE9 desse tipo.",func:"No modelo, recebe o sinal do neur\xF4nio sensorial e o passa ao neur\xF4nio motor.",clueTitle:"A conferir no livro",clue:"Os guias deste projeto registram s\xF3 que o sinal se divide na medula entre o caminho do enc\xE9falo e o dos neur\xF4nios motores. O interneur\xF4nio no meio do caminho foi desenhado a partir da figura do reflexo no cap\xEDtulo 3, sem confer\xEAncia com o PDF.",more:["Nem todo interneur\xF4nio excita. Um interneur\xF4nio GABA\xE9rgico, por exemplo, inibe seus alvos.","O que acontece depois de cada sinapse depende de quem \xE9 a c\xE9lula seguinte. Isso explica como um est\xEDmulo simples produz um comportamento complexo, como gritar e puxar o p\xE9."],where:"Na vista Medula: o neur\xF4nio verde-azulado, entre o ax\xF4nio sensorial e o neur\xF4nio motor.",rel:["sinapse","motor","ascendente"]},{id:"ascendente",g:"med",name:"Via para o enc\xE9falo",color:"#9B7BEA",morf:"Neur\xF4nio da medula cujo ax\xF4nio sobe pela subst\xE2ncia branca at\xE9 o enc\xE9falo.",func:"Leva a informa\xE7\xE3o da tachinha ao enc\xE9falo, onde a dor \xE9 registrada.",clueTitle:"Por que importa",clue:"Este caminho e o do neur\xF4nio motor partem ao mesmo tempo. Sentir a dor e levantar o p\xE9 s\xE3o dois resultados do mesmo sinal.",more:[{x:"Na anatomia, este ax\xF4nio cruza para o outro lado da medula antes de subir, e h\xE1 outras paradas dentro do enc\xE9falo. Isso \xE9 assunto do sistema sensorial som\xE1tico, fora dos cap\xEDtulos 1 a 6."}],where:"O fio roxo. Na vista Medula, ele cruza a fatia e sobe. Na vista Corpo, corre ao lado da medula at\xE9 a cabe\xE7a.",rel:["sinapse","encefalo","branca"]},{id:"encefalo",g:"enc",name:"Enc\xE9falo",color:"#E6B4BF",morf:"C\xE9rebro, cerebelo e tronco encef\xE1lico. Com a medula, forma o sistema nervoso central.",func:"\xC9 onde a sensa\xE7\xE3o de dor \xE9 registrada.",clueTitle:"O que ele n\xE3o faz aqui",clue:"N\xE3o \xE9 ele que manda levantar o p\xE9. Esse comando sai da medula, em paralelo com o sinal que sobe.",more:["C\xE9rebro \xE9 s\xF3 uma parte do enc\xE9falo."],where:"Na vista Corpo: dentro da cabe\xE7a.",rel:["ascendente","medula"]},{id:"motor",g:"mot",name:"Neur\xF4nio motor",color:"#EC6B56",morf:"Neur\xF4nio com o corpo celular na medula e o ax\xF4nio dentro do nervo, at\xE9 o m\xFAsculo.",func:"Soma os PEPS que recebe. Se o total chega ao limiar na zona de gatilho, dispara e leva o comando de contra\xE7\xE3o.",clueTitle:"Por que importa",clue:"\xC9 a sa\xEDda do sistema nervoso. Tudo o que a medula e o enc\xE9falo decidem s\xF3 vira movimento passando por ele.",more:["Todos os neur\xF4nios motores da medula e do tronco s\xE3o colin\xE9rgicos: liberam acetilcolina.","A enzima ChAT, que fabrica a acetilcolina, \xE9 o marcador desses neur\xF4nios.","A zona de gatilho dele \xE9 o cone de implanta\xE7\xE3o.",{x:"No desenho, o corpo celular fica na parte da frente (ventral) da subst\xE2ncia cinzenta."}],where:"O fio vermelho: sai da medula pela raiz ventral e desce pelo nervo at\xE9 o m\xFAsculo.",rel:["interneuronio","raiz-ventral","jnm","ach"]},{id:"raiz-ventral",g:"mot",name:"Raiz ventral",color:"#F2A493",morf:"A raiz da frente, das duas em que cada nervo se divide perto da medula.",func:"\xC9 por ela que saem os ax\xF4nios dos neur\xF4nios motores.",clueTitle:"Na hist\xF3ria",clue:"Bell cortou s\xF3 as ra\xEDzes ventrais e viu paralisia: elas s\xE3o motoras.",where:"Na vista Medula: o ramo da frente, que se junta \xE0 raiz dorsal para formar o nervo.",rel:["raiz-dorsal","motor","nervo"]},{id:"jnm",g:"jnm",name:"Jun\xE7\xE3o neuromuscular",color:"#EE8AA4",morf:"Sinapse entre o ax\xF4nio do neur\xF4nio motor e uma fibra de m\xFAsculo esquel\xE9tico. \xC9 uma das maiores do corpo, e o terminal tem muitas zonas ativas.",func:"Passa o comando do nervo para o m\xFAsculo. Um potencial de a\xE7\xE3o no ax\xF4nio motor sempre gera um potencial de a\xE7\xE3o na fibra muscular.",clueTitle:"Por que nunca falha",clue:"Um potencial de a\xE7\xE3o libera cerca de 200 ves\xEDculas e gera um PEPS de 40 mV ou mais. Numa sinapse t\xEDpica do sistema nervoso central, muitas vezes sai uma ves\xEDcula s\xF3.",more:["A toxina botul\xEDnica destr\xF3i prote\xEDnas SNARE do terminal e bloqueia a libera\xE7\xE3o de acetilcolina.","Por ser acess\xEDvel, foi nela que se descobriu boa parte do que se sabe sobre sinapses qu\xEDmicas."],where:"Na vista M\xFAsculo: o terminal rosado, aberto em corte, apoiado na fibra muscular.",rel:["ach","placa","receptor","ache"]},{id:"ach",g:"jnm",name:"Acetilcolina",aka:"ACh",color:"#F0C445",morf:"Neurotransmissor guardado nas ves\xEDculas do terminal motor.",func:"Liberada na fenda, liga-se aos receptores nicot\xEDnicos da placa motora.",clueTitle:"Por que importa",clue:"Quem decide o efeito \xE9 o receptor, n\xE3o o transmissor: a mesma acetilcolina contrai o m\xFAsculo esquel\xE9tico e desacelera o cora\xE7\xE3o.",more:["\xC9 feita no citosol do terminal pela enzima ChAT, a partir de colina e acetil-CoA.","Dentro de uma ves\xEDcula, pode chegar a 1.000 mM.","Foi o primeiro neurotransmissor identificado: a Vagusstoff de Otto Loewi, em 1921."],where:"Na vista M\xFAsculo: as esferas amarelas dentro do terminal s\xE3o as ves\xEDculas; os gr\xE3os na fenda s\xE3o a acetilcolina libera
