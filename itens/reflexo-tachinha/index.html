<!doctype html>
<html lang="pt-BR" data-title-en="Thumbtack Reflex">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Reflexo da Tachinha</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007AFF'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='7' width='8' height='8' rx='2'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' opacity='.6'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' opacity='.6'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' opacity='.35'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* Layout: a cena 3D ocupa a tela inteira; lista, ficha e controles flutuam sobre ela em painéis translúcidos.
   No celular, lista e ficha viram uma folha inferior. Tipografia: SF Pro pela fonte do sistema. */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, "Segoe UI", Roboto, Arial, sans-serif;
  --bg0: #F8F8FA; --bg1: #E4E4EA; --fog: #EEEEF2; --clay: #DCDCE2;
  --label: #1D1D1F; --label2: #6E6E73; --label3: #A1A1A6;
  --sep: rgba(60, 60, 67, .14); --fill: rgba(118, 118, 128, .12); --fill2: rgba(118, 118, 128, .2);
  --glass: rgba(255, 255, 255, .74); --glass-edge: rgba(0, 0, 0, .07); --thumb: #FFFFFF;
  --accent: #007AFF; --accent-soft: rgba(0, 122, 255, .12); --on-accent: #FFFFFF;
  --shadow: 0 10px 34px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .06);
  --ghost: #7C8AA5;
  --pad: 16px; --side: 268px; --insp: 340px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg0: #232327; --bg1: #0A0A0C; --fog: #19191C; --clay: #3C3C42;
    --label: #F5F5F7; --label2: #A1A1A6; --label3: #6E6E73;
    --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
    --glass: rgba(34, 34, 37, .74); --glass-edge: rgba(255, 255, 255, .09); --thumb: #636366;
    --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .24); --on-accent: #FFFFFF;
    --shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .3);
    --ghost: #9FB1D1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg0: #232327; --bg1: #0A0A0C; --fog: #19191C; --clay: #3C3C42;
  --label: #F5F5F7; --label2: #A1A1A6; --label3: #6E6E73;
  --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
  --glass: rgba(34, 34, 37, .74); --glass-edge: rgba(255, 255, 255, .09); --thumb: #636366;
  --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .24); --on-accent: #FFFFFF;
  --shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .3);
  --ghost: #9FB1D1;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--label);
  background: var(--bg1);
  font: 400 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
svg.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; overflow: hidden; background: radial-gradient(120% 95% at 50% 38%, var(--bg0), var(--bg1)); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#gl.pt { cursor: pointer; }
#leaders, #labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#gl, #leaders, #labels { transition: opacity .17s ease; }
#app.fade #gl, #app.fade #leaders, #app.fade #labels { opacity: 0; }

/* painéis */
.glass {
  background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
}
#panes { display: contents; }
#grab { display: none; }
#sidebar, #inspector { position: absolute; border-radius: 18px; }
#sidebar { top: var(--pad); left: var(--pad); bottom: var(--pad); width: var(--side); display: flex; flex-direction: column; min-height: 0; }
#inspector { top: var(--pad); right: var(--pad); width: var(--insp); max-height: calc(100% - 2 * var(--pad)); overflow-y: auto; overscroll-behavior: contain; }

/* lista */
.search { position: relative; margin: 12px 12px 6px; flex: none; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--label2); pointer-events: none; }
.search input {
  width: 100%; height: 34px; padding: 0 10px 0 31px; border: 0; border-radius: 10px; background: var(--fill);
  font-size: 15px; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--label2); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
#list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 8px 12px; }
#list h2 { margin: 14px 10px 4px; font-size: 12px; line-height: 1.3; font-weight: 600; color: var(--label2); }
#list ul { list-style: none; margin: 0; padding: 0; }
#list button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 5px 10px; border-radius: 8px; font-size: 14px; line-height: 1.25; }
#list button:hover { background: var(--fill); }
#list button[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
#list .none { margin: 18px 10px; color: var(--label2); font-size: 14px; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .18); }
[aria-current="true"] > .dot { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .85); }

/* ficha */
.ins { padding: 20px 20px 22px; }
.ins-top { display: flex; align-items: flex-start; gap: 12px; }
.ins-top > div { flex: 1 1 auto; min-width: 0; }
.ins h1 { margin: 0; font-size: 26px; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; text-wrap: balance; }
.ins .aka { margin: 4px 0 0; font-size: 15px; color: var(--label2); }
.close { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--label2); display: grid; place-items: center; font-size: 15px; }
.close:hover { background: var(--fill2); }
.close svg { stroke-width: 2.2; }
.back { display: none; }
.rows { margin: 16px 0 0; padding: 0; list-style: none; background: var(--fill); border-radius: 12px; }
.rows > * { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 9px 14px; font-size: 14px; }
.rows > * + * { box-shadow: inset 0 .5px 0 var(--sep); }
.rows dt { color: var(--label); flex: none; }
.rows dd { margin: 0; color: var(--label2); text-align: right; font-variant-numeric: tabular-nums; }
.ins h2 { margin: 20px 0 3px; font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--label2); }
.ins p { margin: 0; font-size: 15px; line-height: 1.45; max-width: 60ch; }
.ins .lead { margin-top: 10px; color: var(--label2); }
.ins ul.more { margin: 2px 0 0; padding: 0 0 0 1.15em; font-size: 14.5px; line-height: 1.42; }
.ins ul.more li { margin: 5px 0 0; padding-left: 2px; }
.ins ul.more li::marker { color: var(--label3); }
.tag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 5px; background: var(--fill2); color: var(--label2); font-size: 11px; font-weight: 600; line-height: 16px; vertical-align: 1px; }
.actions { margin-top: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 500; }
.btn:hover { filter: brightness(1.07); }
.btn svg { font-size: 15px; }
.rows.links > li { display: block; padding: 0; }
.rows.links button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px 9px 14px; font-size: 15px; border-radius: inherit; }
.rows.links li:first-child button { border-radius: 12px 12px 0 0; }
.rows.links li:last-child button { border-radius: 0 0 12px 12px; }
.rows.links li:only-child button { border-radius: 12px; }
.rows.links button:hover { background: var(--fill); }
.rows.links .name { flex: 1 1 auto; min-width: 0; }
.rows.links .sub { display: block; font-size: 13px; color: var(--label2); }
.rows.links .chev { color: var(--label3); font-size: 13px; }
.rows.links .num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--fill2); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--label2); }
.ins .foot { margin-top: 16px; font-size: 12.5px; line-height: 1.45; color: var(--label2); }

/* barra de vistas */
#toolbar {
  position: absolute; bottom: var(--pad); left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2);
  transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 15px; max-width: calc(100% - var(--side) - var(--insp) - 5 * var(--pad));
}
.seg { display: flex; padding: 2px; border-radius: 9px; background: var(--fill); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { height: 30px; padding: 0 13px; border-radius: 7px; font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--label); }
.seg button[aria-pressed="true"] { background: var(--thumb); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .06); }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; background: var(--fill); font-size: 13px; font-weight: 500; white-space: nowrap; flex: none; }
.tb:hover { background: var(--fill2); }
.tb svg { font-size: 15px; }
.tb svg.chev { font-size: 12px; color: var(--label2); margin-left: -2px; }
.tb.icon { width: 34px; padding: 0; justify-content: center; }
.tb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tb[disabled] { opacity: .45; cursor: default; }
svg.ic.fill { fill: currentColor; stroke: none; }

/* rótulos da cena */
.lab {
  position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap;
  font-size: 12.5px; line-height: 1.2; font-weight: 500; letter-spacing: -.003em; color: var(--label); padding: 2px 6px; border-radius: 7px;
  text-shadow: 1px 0 0 var(--fog), -1px 0 0 var(--fog), 0 1px 0 var(--fog), 0 -1px 0 var(--fog), 1px 1px 0 var(--fog), -1px -1px 0 var(--fog), 1px -1px 0 var(--fog), -1px 1px 0 var(--fog),
    0 0 3px var(--fog), 0 0 6px var(--fog), 0 0 9px var(--fog);
}
.lab:hover { color: var(--accent); }
.lab.sel { background: var(--accent); color: var(--on-accent); text-shadow: none; font-weight: 600; }
.lab.note { pointer-events: none; font-weight: 400; font-size: 12px; color: var(--label2); padding: 0; }
.lab.hot {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 13px; text-shadow: none;
  color: var(--accent); font-weight: 600; background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: 0 3px 12px rgba(0, 0, 0, .12);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
}
.lab.hot svg { font-size: 14px; stroke-width: 2; }
#leaders line { stroke: var(--label2); stroke-width: .75; opacity: .8; }
#leaders circle { fill: var(--bg0); stroke: var(--label); stroke-width: 1.2; }
#tip { position: absolute; left: 0; top: 0; pointer-events: none; padding: 4px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
/* cartão do passo a passo */
#stepper {
  position: absolute; bottom: calc(var(--pad) + 62px); left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2); transform: translateX(-50%);
  width: min(580px, calc(100% - var(--side) - var(--insp) - 5 * var(--pad))); border-radius: 16px; padding: 14px 16px 12px; overflow: hidden;
}
.st-count { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--label2); font-variant-numeric: tabular-nums; }
#stepper h2 { margin: 1px 0 0; font-size: 19px; line-height: 1.2; font-weight: 700; letter-spacing: -.015em; }
.st-text { margin: 6px 0 0; font-size: 14.5px; line-height: 1.42; color: var(--label); min-height: 4.2em; max-width: 64ch; }
.st-ctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.st-ctl .grow { flex: 1 1 auto; }
.tb.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 0 14px; }
.tb.primary:hover { background: var(--accent); filter: brightness(1.07); }
.st-dots { display: flex; gap: 5px; align-items: center; }
.st-dots button { width: 8px; height: 8px; border-radius: 50%; background: var(--fill2); padding: 0; position: relative; }
.st-dots button::after { content: ""; position: absolute; inset: -7px -3px; }
.st-dots button[aria-current="true"] { background: var(--accent); width: 20px; border-radius: 4px; }
.st-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); opacity: .9; }
#busy { position: absolute; top: 46%; left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2); transform: translate(-50%, -50%); padding: 9px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--label2); }
#nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--label2); }

/* celular e tablet: folha inferior */
@media (max-width: 900px) {
  :root { --pad: 10px; }
  #toolbar { top: calc(var(--pad) + env(safe-area-inset-top, 0px)); bottom: auto; left: var(--pad); right: var(--pad); transform: none; max-width: none; gap: 6px; }
  .seg { flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: 1 0 auto; padding: 0 6px; text-align: center; font-size: 12.5px; }
  #panes {
    display: flex; flex-direction: column; position: absolute; left: 0; right: 0; bottom: 0; height: var(--sheet, 46%); max-height: calc(100% - 64px - env(safe-area-inset-top, 0px));
    border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .32s cubic-bezier(.2, .85, .25, 1);
    background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  }
  #panes.drag { transition: none; }
  #grab { display: block; flex: none; width: 100%; height: 22px; touch-action: none; cursor: grab; }
  #grab::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 7px auto 0; }
  #sidebar, #inspector { position: static; width: auto; max-height: none; flex: 1 1 auto; min-height: 0; border-radius: 0; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #panes[data-pane="list"] #inspector, #panes[data-pane="detail"] #sidebar { display: none; }
  .search { margin-top: 2px; }
  .ins { padding: 4px 16px 20px; }
  .ins h1 { font-size: 24px; }
  #busy { left: 50%; top: 30%; }
  #stepper { left: var(--pad); right: var(--pad); bottom: calc(var(--sheet, 46%) + 8px); transform: none; width: auto; padding: 11px 13px 10px; }
  #stepper h2 { font-size: 17px; }
  .st-text { font-size: 13.5px; min-height: 0; }
  /* com a folha levantada, o cartão sai da frente da cena */
  #app[data-sheet="half"] #stepper, #app[data-sheet="full"] #stepper { display: none; }
}
/* linha da busca com a chave de idioma */
.srow { display: flex; align-items: center; gap: 8px; margin: 12px 12px 6px; flex: none; }
.srow .search { margin: 0; flex: 1 1 auto; min-width: 0; }
.home + .srow { margin-top: 7px; }
.lang { display: flex; flex: none; padding: 2px; border-radius: 9px; background: var(--fill); }
.lang button { height: 30px; min-width: 32px; padding: 0 7px; border-radius: 7px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--label2); text-align: center; }
.lang button[aria-pressed="true"] { background: var(--thumb); color: var(--label); box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .06); }
/* voltar ao hub: no computador, no alto da lista; em tela estreita, no começo da barra de vistas */
.home { display: flex; align-items: center; gap: 3px; align-self: flex-start; flex: none; margin: 11px 12px 0; padding: 2px 6px 2px 2px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
.home:hover { background: var(--accent-soft); }
.home svg { font-size: 13px; stroke-width: 2; }
a.tb { color: var(--label); text-decoration: none; }
.home-tb { display: none; }
@media (max-width: 900px) {
  #sidebar .home { display: none; }
  .srow, .home + .srow { margin-top: 2px; }
  .home-tb { display: inline-flex; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== comum a todos os itens (fontes/comum/comum.css) ===== */
/* painéis laterais recolhíveis. Recolhido, o painel some e a largura dele sai da conta que centraliza
   a barra de vistas e o cartão de passos; por isso --side e --insp viram "menos uma margem". */
@media (min-width: 901px) {
  #app[data-left="off"] #sidebar { display: none; }
  #app[data-left="off"] { --side: calc(-1 * var(--pad)); }
  #app[data-left="off"] .home-tb { display: inline-flex; } /* o link de voltar ao hub mora na lista */
  #app[data-right="off"] #inspector { display: none; }
  #app[data-right="off"]:not(.keep-right) { --insp: calc(-1 * var(--pad)); }
}
@media (max-width: 900px) { .pane-tg { display: none; } }

/* controle da câmera (fontes/comum/nav.js): na borda direita da área livre da cena, a meia altura */
#nav {
  position: absolute; top: 50%; right: calc(var(--insp) + 2 * var(--pad)); transform: translateY(-50%); z-index: 2;
  display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 15px;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#nav .nav-mode { display: flex; padding: 2px; border-radius: 9px; background: var(--fill); }
#nav .nav-mode button { flex: 1 1 0; height: 24px; padding: 0 6px; border-radius: 7px; font-size: 11.5px; font-weight: 500; text-align: center; color: var(--label2); }
#nav .nav-mode button[aria-pressed="true"] { background: var(--thumb); color: var(--label); font-weight: 600; box-shadow: 0 2px 6px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .06); }
#nav .nav-pad { display: grid; grid-template-columns: repeat(3, 32px); grid-template-areas: ". u ." "l c r" ". d ."; gap: 4px; }
#nav .nav-z { display: grid; grid-template-columns: repeat(3, 32px); gap: 4px; }
#nav .nb { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--fill); color: var(--label); font-size: 15px; }
#nav .nb:hover { background: var(--fill2); }
#nav .nb.on, #nav .nb:active { background: var(--accent-soft); color: var(--accent); }
#nav .nb svg { stroke-width: 2; }
#nav .u { grid-area: u; } #nav .l { grid-area: l; } #nav .r { grid-area: r; } #nav .d { grid-area: d; } #nav .c { grid-area: c; }
#nav .c { background: none; color: var(--label2); }
#nav .help { background: none; color: var(--label2); font-size: 14px; font-weight: 600; }
#nav .help[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
#nav .nav-help {
  position: absolute; right: calc(100% + 8px); bottom: 0; width: 248px; padding: 12px 14px; border-radius: 14px;
  font-size: 13px; line-height: 1.35; -webkit-user-select: text; user-select: text;
}
#nav .nav-help h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
#nav .nav-help dl { margin: 0; }
#nav .nav-help dl > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; }
#nav .nav-help dt { white-space: nowrap; color: var(--label2); }
#nav .nav-help dd { margin: 0; text-align: right; }
#nav .nav-help kbd { display: inline-block; min-width: 20px; margin-right: 2px; padding: 0 5px; border-radius: 5px; background: var(--fill2); font: 600 11.5px/19px var(--font); text-align: center; color: var(--label); }

<body>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="Modelo 3D do reflexo da tachinha. Use a lista de estruturas e o passo a passo para navegar pelo teclado; as setas giram a câmera e W A S D a movem." data-en-aria-label="3D model of the thumbtack reflex. Use the list of structures and the step-by-step to navigate with the keyboard; the arrows rotate the camera and W A S D move it."></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels"></div>
  <div id="nogl" hidden data-en="This browser could not open the 3D scene. The list, the cards and the step text still work.">Este navegador não conseguiu abrir a cena 3D. A lista, as fichas e o texto dos passos continuam funcionando.</div>

  <div id="toolbar" class="glass">
    <a class="tb icon home-tb" data-hub href="../../index.html" aria-label="Voltar ao NeuroHub" title="Voltar ao NeuroHub" data-en-aria-label="Back to NeuroHub" data-en-title="Back to NeuroHub"><svg class="ic" viewBox="0 0 16 16"><path d="M2.4 7.6 8 2.9l5.6 4.7M3.9 6.5v6.6h2.9V9.7h2.400v3.400h2.9V6.5"/></svg></a>
    <button type="button" class="tb icon pane-tg" id="tgL" aria-pressed="true" aria-label="Mostrar ou esconder a lista" title="Lista" data-en-aria-label="Show or hide the list" data-en-title="List"><svg class="ic" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6.2 3v10"/></svg></button>
    <div class="seg" id="seg" role="group" aria-label="Vistas" data-en-aria-label="Views"></div>
    <button type="button" class="tb icon" id="tags" aria-pressed="true" aria-label="Mostrar rótulos" title="Rótulos" data-en-aria-label="Show labels" data-en-title="Labels"><svg class="ic" viewBox="0 0 16 16"><path d="M2.5 3.6v3.7c0 .3.1.6.3.8l5.6 5.6c.4.4 1.1.4 1.6 0l3.7-3.7c.4-.5.4-1.200 0-1.6L8.100 2.800a1.100 1.100 0 0 0-.8-.3H3.600c-.6 0-1.100.5-1.100 1.100z"/><circle cx="5.4" cy="5.4" r=".9"/></svg></button>
    <button type="button" class="tb icon pane-tg" id="tgR" aria-pressed="true" aria-label="Mostrar ou esconder a ficha" title="Ficha" data-en-aria-label="Show or hide the card" data-en-title="Card"><svg class="ic" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M9.8 3v10"/></svg></button>
  </div>

  <section id="stepper" class="glass" aria-label="Passo a passo" data-en-aria-label="Step by step">
    <p class="st-count" id="stCount"></p>
    <h2 id="stTitle"></h2>
    <p class="st-text" id="stText" role="status"></p>
    <div class="st-ctl">
      <button type="button" class="tb icon" id="stPrev" aria-label="Passo anterior" data-en-aria-label="Previous step"><svg class="ic" viewBox="0 0 16 16"><path d="M10 3.500 5.500 8 10 12.500"/></svg></button>
      <button type="button" class="tb primary" id="stPlay"></button>
      <button type="button" class="tb icon" id="stNext" aria-label="Próximo passo" data-en-aria-label="Next step"><svg class="ic" viewBox="0 0 16 16"><path d="m6 3.500 4.500 4.500L6 12.500"/></svg></button>
      <span class="grow"></span>
      <div class="st-dots" id="stDots" role="group" aria-label="Ir para um passo" data-en-aria-label="Go to a step"></div>
    </div>
    <div class="st-bar" id="stBar"></div>
  </section>
  <div id="tip" class="glass" hidden></div>
  <div id="busy" class="glass" role="status" hidden data-en="Building the view…">Montando a vista…</div>

  <div id="panes" data-pane="list">
    <div id="grab" aria-hidden="true"></div>
    <aside id="sidebar" class="glass" aria-label="Estruturas" data-en-aria-label="Structures">
      <a class="home" data-hub href="../../index.html" title="Voltar ao NeuroHub" data-en-title="Back to NeuroHub"><svg class="ic" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8 10 12.5"/></svg>NeuroHub</a>
      <div class="srow">
        <label class="search"><svg class="ic" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.3"/><path d="m10.300 10.300 3.200 3.200"/></svg><input id="q" type="search" placeholder="Buscar estrutura" autocomplete="off" spellcheck="false" aria-label="Buscar estrutura" data-en-placeholder="Search" data-en-aria-label="Search structures"></label>
        <div class="lang" role="group" aria-label="Idioma" data-en-aria-label="Language"><button type="button" data-lang="pt" lang="pt" title="Português">PT</button><button type="button" data-lang="en" lang="en" title="English">EN</button></div>
      </div>
      <nav id="list"></nav>
    </aside>
    <aside id="inspector" class="glass" aria-live="polite"></aside>
  </div>
</div>

 5 para seguir um sinal do come\xE7o ao fim."],where:"No ch\xE3o, embaixo do p\xE9. Na vista Pele, entrando pela sola.",rel:["pele","terminacao"]},{id:"pele",g:"est",name:"Pele",color:"#EBC7AE",morf:"Tecido que reveste o corpo. Dentro dela ficam as termina\xE7\xF5es dos neur\xF4nios sensoriais.",func:"\xC9 onde o est\xEDmulo mec\xE2nico vira sinal el\xE9trico.",more:[{x:"O desenho mostra a pele como um bloco s\xF3, com a superf\xEDcie em tom mais escuro. As camadas da pele n\xE3o entram nos cap\xEDtulos 1 a 6."}],where:"Na vista Pele: o bloco cortado ao meio, com a sola do p\xE9 virada para baixo.",rel:["tachinha","terminacao"]},{id:"terminacao",g:"sens",name:"Termina\xE7\xE3o sensorial",color:"#4C8FEF",morf:"Ponta do ax\xF4nio do neur\xF4nio sensorial, dentro da pele. A membrana tem canais de Na\u207A que abrem quando ela \xE9 esticada.",func:"Transforma o estiramento em sinal el\xE9trico. O Na\u207A entra e despolariza a termina\xE7\xE3o: \xE9 o potencial gerador. Se ele atinge o limiar, nasce um potencial de a\xE7\xE3o.",clueTitle:"Por que importa",clue:"No neur\xF4nio sensorial, a zona de gatilho fica aqui, perto da termina\xE7\xE3o. No neur\xF4nio t\xEDpico do enc\xE9falo e da medula, ela fica no cone de implanta\xE7\xE3o.",more:["\xC9 tudo ou nada: abaixo do limiar, nada acontece; acima dele, sai o potencial de a\xE7\xE3o completo.","Um est\xEDmulo mais forte n\xE3o gera um potencial de a\xE7\xE3o maior: gera mais disparos por segundo. \xC9 assim que a intensidade \xE9 codificada."],where:"Na vista Pele: os ramos azuis e o bot\xE3o que fica logo acima da ponta da tachinha.",rel:["canal-est","sodio","sensorial"]},{id:"canal-est",g:"sens",name:"Canal de Na\u207A sens\xEDvel a estiramento",color:"#2FA36B",morf:"Prote\xEDna da membrana da termina\xE7\xE3o sensorial, com um poro que abre quando a membrana \xE9 esticada.",func:"Deixa o Na\u207A entrar. Como h\xE1 muito mais Na\u207A fora e o interior \xE9 negativo, ele entra com for\xE7a e despolariza a termina\xE7\xE3o.",clueTitle:"Tr\xEAs jeitos de abrir um canal",clue:"Este abre com estiramento. Os canais do potencial de a\xE7\xE3o abrem com voltagem. Os das sinapses abrem com neurotransmissor.",where:"Na vista Pele: os pares verdes na superf\xEDcie do bot\xE3o da termina\xE7\xE3o. Eles se afastam quando a tachinha estica a membrana.",rel:["terminacao","sodio"]},{id:"sodio",g:"sens",name:"S\xF3dio (Na\u207A)",color:"#F29A4A",rows:[["Fora","150 mM"],["Dentro","15 mM"],["Equil\xEDbrio","+62 mV"]],morf:"C\xE1tion dez vezes mais concentrado fora do neur\xF4nio.",func:"Quando um canal de Na\u207A abre, ele entra: a difus\xE3o e o interior negativo empurram no mesmo sentido. A entrada de carga positiva despolariza a membrana.",more:["\xC9 o mesmo \xEDon nos tr\xEAs pontos da hist\xF3ria: entra na termina\xE7\xE3o da pele, entra a cada trecho do ax\xF4nio no potencial de a\xE7\xE3o e entra na fibra muscular pelo receptor nicot\xEDnico."],where:"Nas vistas Pele e M\xFAsculo: as esferas alaranjadas.",rel:["canal-est","receptor"]},{id:"sensorial",g:"sens",name:"Neur\xF4nio sensorial",aka:"Neur\xF4nio sensorial prim\xE1rio",color:"#3D7DE0",morf:"Neur\xF4nio com a termina\xE7\xE3o na pele e o ax\xF4nio dentro do nervo, at\xE9 a medula.",func:"Leva a informa\xE7\xE3o da pele at\xE9 a medula, em potenciais de a\xE7\xE3o.",clueTitle:"Por que importa",clue:"O potencial de a\xE7\xE3o se regenera a cada trecho do ax\xF4nio. Por isso chega \xE0 medula com o mesmo tamanho com que saiu do p\xE9.",more:["O nervo sensorial dispara em alta frequ\xEAncia.","A informa\xE7\xE3o vai na frequ\xEAncia e no padr\xE3o dos disparos, como em um c\xF3digo Morse.","Na ordem de grandeza do cap\xEDtulo 4, a 10 m/s e com 2 ms de dura\xE7\xE3o, cada potencial de a\xE7\xE3o ocupa uns 2 cm de ax\xF4nio.","Ax\xF4nios finos, como os que levam a dor, s\xE3o os mais sens\xEDveis \xE0 anestesia local.",{x:"O corpo celular deste neur\xF4nio fica no g\xE2nglio da raiz dorsal, ao lado da medula."}],where:"O fio azul: sai da sola do p\xE9, sobe pela perna dentro do nervo e entra na medula pela raiz dorsal.",rel:["terminacao","nervo","raiz-dorsal","sinapse"]},{id:"nervo",g:"sens",name:"Nervo",color:"#E3D6AE",morf:"Feixe de ax\xF4nios fora do sistema nervoso central.",func:"Liga a medula \xE0 perna. Mistura fibras sensoriais, que sobem, e fibras motoras, que descem.",clueTitle:"Por que importa",clue:"Cada fibra conduz num s\xF3 sentido. O mesmo nervo leva a not\xEDcia da tachinha para cima e o comando de contra\xE7\xE3o para baixo, em fibras diferentes.",more:["Os nervos formam o sistema nervoso perif\xE9rico.","Neles, quem faz a bainha de mielina \xE9 a c\xE9lula de Schwann."],where:"O tubo claro que envolve o fio azul e o fio vermelho, da medula at\xE9 a perna.",rel:["sensorial","motor","raiz-dorsal","raiz-ventral"]},{id:"raiz-dorsal",g:"sens",name:"Raiz dorsal",color:"#8DB4F2",morf:"Perto da medula, as fibras de cada nervo se dividem em duas ra\xEDzes. A dorsal \xE9 a de tr\xE1s.",func:"\xC9 por ela que a informa\xE7\xE3o sensorial entra na medula.",clueTitle:"Na hist\xF3ria",clue:"Por volta de 1810, Bell e Magendie cortaram ra\xEDzes espinhais: cortar a ventral paralisa, e a dorsal leva informa\xE7\xE3o sensorial. Foi assim que se soube que um nervo mistura os dois tipos de fibra.",where:"Na vista Medula: o ramo de tr\xE1s, com uma dilata\xE7\xE3o no meio.",rel:["raiz-ventral","ganglio","sensorial"]},{id:"ganglio",g:"sens",name:"G\xE2nglio da raiz dorsal",color:"#B9CFF3",morf:"Dilata\xE7\xE3o na raiz dorsal, ao lado da medula.",func:"Abriga os corpos celulares dos neur\xF4nios sensoriais.",more:[{x:"Esta estrutura n\xE3o est\xE1 nos cap\xEDtulos 1 a 6. Entrou no modelo porque o neur\xF4nio sensorial precisa de um corpo celular, e \xE9 ali que ele fica."}],where:"Na vista Medula: o bulbo transl\xFAcido na raiz dorsal, com o corpo celular azul dentro.",rel:["raiz-dorsal","sensorial"]},{id:"medula",g:"med",name:"Medula espinhal",color:"#EADFC8",morf:"Parte do sistema nervoso central, junto com o enc\xE9falo.",func:"\xC9 onde o sinal da tachinha passa do neur\xF4nio sensorial para outros neur\xF4nios e se divide: um caminho sobe ao enc\xE9falo, o outro vai aos neur\xF4nios motores.",clueTitle:"Por que importa",clue:"O comando para levantar o p\xE9 sai daqui. Ele n\xE3o espera o enc\xE9falo.",more:["A glicina \xE9 o transmissor inibit\xF3rio da medula e do tronco. Sem essa inibi\xE7\xE3o, os reflexos ficam exagerados: \xE9 o efeito da estricnina.",{x:"Em corte, a subst\xE2ncia cinzenta fica no meio, em forma de borboleta, e a branca em volta."}],where:"Na vista Corpo: o cord\xE3o claro que desce do enc\xE9falo pelas costas. Na vista Medula: uma fatia em corte.",rel:["cinzenta","branca","encefalo","interneuronio"]},{id:"cinzenta",g:"med",name:"Subst\xE2ncia cinzenta",color:"#CDB8C6",morf:"A parte mais escura do tecido nervoso.",func:"Recebe e envia informa\xE7\xE3o pelas fibras da subst\xE2ncia branca.",more:[{x:"\xC9 onde ficam os corpos celulares dos neur\xF4nios e as sinapses. Na medula, tem forma de borboleta: a parte de tr\xE1s recebe o ax\xF4nio sensorial, e na da frente ficam os neur\xF4nios motores."}],where:"Na vista Medula: a borboleta no meio da fatia.",rel:["branca","medula","sinapse"]},{id:"branca",g:"med",name:"Subst\xE2ncia branca",color:"#F3ECDA",morf:"A parte mais clara do tecido nervoso. \xC9 cont\xEDnua com os nervos.",func:"Cont\xE9m as fibras que levam e trazem informa\xE7\xE3o da subst\xE2ncia cinzenta.",more:["No modelo, o ax\xF4nio que sobe ao enc\xE9falo corre por ela.",{x:"A cor clara vem da mielina que envolve os ax\xF4nios."}],where:"Na vista Medula: a parte clara em volta da borboleta.",rel:["cinzenta","ascendente"]},{id:"sinapse",g:"med",name:"Sinapse na medula",color:"#C97BD8",morf:"Contato entre o terminal do ax\xF4nio sensorial e o neur\xF4nio seguinte.",func:"O potencial de a\xE7\xE3o chega ao terminal, o Ca\xB2\u207A entra e as ves\xEDculas liberam o transmissor, provavelmente glutamato. Do outro lado, os canais deixam entrar carga positiva: \xE9 um PEPS.",clueTitle:"Por que importa",clue:"Uma sinapse sozinha gera um PEPS de alguns d\xE9cimos de mV, que n\xE3o basta. Como o nervo sensorial dispara em alta frequ\xEAncia e muitas sinapses s\xE3o ativadas juntas, os PEPS se somam e levam a zona de gatilho ao limiar.",more:["Soma\xE7\xE3o temporal: PEPS da mesma sinapse em sequ\xEAncia r\xE1pida. Soma\xE7\xE3o espacial: PEPS de v\xE1rias sinapses ao mesmo tempo.","O glutamato \xE9 o principal transmissor excitat\xF3rio do sistema nervoso central."],where:"Na vista Medula: os bot\xF5es lil\xE1s onde um ax\xF4nio encosta no neur\xF4nio seguinte.",rel:["sensorial","interneuronio","ascendente","motor"]},{id:"interneuronio",g:"med",name:"Interneur\xF4nio",color:"#2FB3A1",morf:"Neur\xF4nio que s\xF3 se conecta com outros neur\xF4nios. A maioria dos neur\xF4nios \xE9 desse tipo.",func:"No modelo, recebe o sinal do neur\xF4nio sensorial e o passa ao neur\xF4nio motor.",clueTitle:"A conferir no livro",clue:"Os guias deste projeto registram s\xF3 que o sinal se divide na medula entre o caminho do enc\xE9falo e o dos neur\xF4nios motores. O interneur\xF4nio no meio do caminho foi desenhado a partir da figura do reflexo no cap\xEDtulo 3, sem confer\xEAncia com o PDF.",more:["Nem todo interneur\xF4nio excita. Um interneur\xF4nio GABA\xE9rgico, por exemplo, inibe seus alvos.","O que acontece depois de cada sinapse depende de quem \xE9 a c\xE9lula seguinte. Isso explica como um est\xEDmulo simples produz um comportamento complexo, como gritar e puxar o p\xE9."],where:"Na vista Medula: o neur\xF4nio verde-azulado, entre o ax\xF4nio sensorial e o neur\xF4nio motor.",rel:["sinapse","motor","ascendente"]},{id:"ascendente",g:"med",name:"Via para o enc\xE9falo",color:"#9B7BEA",morf:"Neur\xF4nio da medula cujo ax\xF4nio sobe pela subst\xE2ncia branca at\xE9 o enc\xE9falo.",func:"Leva a informa\xE7\xE3o da tachinha ao enc\xE9falo, onde a dor \xE9 registrada.",clueTitle:"Por que importa",clue:"Este caminho e o do neur\xF4nio motor partem ao mesmo tempo. Sentir a dor e levantar o p\xE9 s\xE3o dois resultados do mesmo sinal.",more:[{x:"Na anatomia, este ax\xF4nio cruza para o outro lado da medula antes de subir, e h\xE1 outras paradas dentro do enc\xE9falo. Isso \xE9 assunto do sistema sensorial som\xE1tico, fora dos cap\xEDtulos 1 a 6."}],where:"O fio roxo. Na vista Medula, ele cruza a fatia e sobe. Na vista Corpo, corre ao lado da medula at\xE9 a cabe\xE7a.",rel:["sinapse","encefalo","branca"]},{id:"encefalo",g:"enc",name:"Enc\xE9falo",color:"#E6B4BF",morf:"C\xE9rebro, cerebelo e tronco encef\xE1lico. Com a medula, forma o sistema nervoso central.",func:"\xC9 onde a sensa\xE7\xE3o de dor \xE9 registrada.",clueTitle:"O que ele n\xE3o faz aqui",clue:"N\xE3o \xE9 ele que manda levantar o p\xE9. Esse comando sai da medula, em paralelo com o sinal que sobe.",more:["C\xE9rebro \xE9 s\xF3 uma parte do enc\xE9falo."],where:"Na vista Corpo: dentro da cabe\xE7a.",rel:["ascendente","medula"]},{id:"motor",g:"mot",name:"Neur\xF4nio motor",color:"#EC6B56",morf:"Neur\xF4nio com o corpo celular na medula e o ax\xF4nio dentro do nervo, at\xE9 o m\xFAsculo.",func:"Soma os PEPS que recebe. Se o total chega ao limiar na zona de gatilho, dispara e leva o comando de contra\xE7\xE3o.",clueTitle:"Por que importa",clue:"\xC9 a sa\xEDda do sistema nervoso. Tudo o que a medula e o enc\xE9falo decidem s\xF3 vira movimento passando por ele.",more:["Todos os neur\xF4nios motores da medula e do tronco s\xE3o colin\xE9rgicos: liberam acetilcolina.","A enzima ChAT, que fabrica a acetilcolina, \xE9 o marcador desses neur\xF4nios.","A zona de gatilho dele \xE9 o cone de implanta\xE7\xE3o.",{x:"No desenho, o corpo celular fica na parte da frente (ventral) da subst\xE2ncia cinzenta."}],where:"O fio vermelho: sai da medula pela raiz ventral e desce pelo nervo at\xE9 o m\xFAsculo.",rel:["interneuronio","raiz-ventral","jnm","ach"]},{id:"raiz-ventral",g:"mot",name:"Raiz ventral",color:"#F2A493",morf:"A raiz da frente, das duas em que cada nervo se divide perto da medula.",func:"\xC9 por ela que saem os ax\xF4nios dos neur\xF4nios motores.",clueTitle:"Na hist\xF3ria",clue:"Bell cortou s\xF3 as ra\xEDzes ventrais e viu paralisia: elas s\xE3o motoras.",where:"Na vista Medula: o ramo da frente, que se junta \xE0 raiz dorsal para formar o nervo.",rel:["raiz-dorsal","motor","nervo"]},{id:"jnm",g:"jnm",name:"Jun\xE7\xE3o neuromuscular",color:"#EE8AA4",morf:"Sinapse entre o ax\xF4nio do neur\xF4nio motor e uma fibra de m\xFAsculo esquel\xE9tico. \xC9 uma das maiores do corpo, e o terminal tem muitas zonas ativas.",func:"Passa o comando do nervo para o m\xFAsculo. Um potencial de a\xE7\xE3o no ax\xF4nio motor sempre gera um potencial de a\xE7\xE3o na fibra muscular.",clueTitle:"Por que nunca falha",clue:"Um potencial de a\xE7\xE3o libera cerca de 200 ves\xEDculas e gera um PEPS de 40 mV ou mais. Numa sinapse t\xEDpica do sistema nervoso central, muitas vezes sai uma ves\xEDcula s\xF3.",more:["A toxina botul\xEDnica destr\xF3i prote\xEDnas SNARE do terminal e bloqueia a libera\xE7\xE3o de acetilcolina.","Por ser acess\xEDvel, foi nela que se descobriu boa parte do que se sabe sobre sinapses qu\xEDmicas."],where:"Na vista M\xFAsculo: o terminal rosado, aberto em corte, apoiado na fibra muscular.",rel:["ach","placa","receptor","ache"]},{id:"ach",g:"jnm",name:"Acetilcolina",aka:"ACh",color:"#F0C445",morf:"Neurotransmissor guardado nas ves\xEDculas do terminal motor.",func:"Liberada na fenda, liga-se aos receptores nicot\xEDnicos da placa motora.",clueTitle:"Por que importa",clue:"Quem decide o efeito \xE9 o receptor, n\xE3o o transmissor: a mesma acetilcolina contrai o m\xFAsculo esquel\xE9tico e desacelera o cora\xE7\xE3o.",more:["\xC9 feita no citosol do terminal pela enzima ChAT, a partir de colina e acetil-CoA.","Dentro de uma ves\xEDcula, pode chegar a 1.000 mM.","Foi o primeiro neurotransmissor identificado: a Vagusstoff de Otto Loewi, em 1921."],where:"Na vista M\xFAsculo: as esferas amarelas dentro do terminal s\xE3o as ves\xEDculas; os gr\xE3os na fenda s\xE3o a acetilcolina liberada.",rel:["jnm","receptor","ache","motor"]},{id:"placa",g:"jnm",name:"Placa motora",aka:"Placa motora terminal",color:"#D98477",morf:"Trecho da membrana da fibra muscular embaixo do terminal. Tem dobras cheias de receptores, alinhadas com as zonas ativas.",func:"\xC9 o lado p\xF3s-sin\xE1ptico da jun\xE7\xE3o: recebe a acetilcolina e despolariza a fibra.",where:"Na vista M\xFAsculo: as dobras na superf\xEDcie da fibra, logo abaixo do terminal.",rel:["receptor","jnm","musculo"]},{id:"receptor",g:"jnm",name:"Receptor nicot\xEDnico",aka:"Receptor colin\xE9rgico nicot\xEDnico",color:"#6C8BF0",morf:"Canal i\xF4nico da placa motora: cinco subunidades em volta de um poro, como as t\xE1buas de um barril.",func:"Abre quando duas mol\xE9culas de acetilcolina se ligam. Deixa passar Na\u207A e K\u207A; como entra mais Na\u207A do que sai K\u207A, a fibra muscular despolariza.",clueTitle:"Por que excita",clue:"Com Na\u207A e K\u207A passando por igual, o canal puxa o potencial para perto de 0 mV, acima do limiar.",more:["No m\xFAsculo, a composi\xE7\xE3o \xE9 \u03B12\u03B2\u03B3\u03B4, com um s\xEDtio de liga\xE7\xE3o de acetilcolina em cada subunidade \u03B1.","A nicotina o ativa, e da\xED vem o nome. O curare e a \u03B1-bungarotoxina o bloqueiam e causam paralisia.","Se a acetilcolina fica alta por v\xE1rios segundos, o canal se fecha mesmo com ela presente: \xE9 a dessensibiliza\xE7\xE3o."],where:"Na vista M\xFAsculo: os canais azuis no alto das dobras da placa motora.",rel:["ach","placa","sodio","ache"]},{id:"ache",g:"jnm",name:"Acetilcolinesterase",aka:"AChE",color:"#5DB67C",morf:"Enzima depositada na fenda da jun\xE7\xE3o neuromuscular pelas c\xE9lulas musculares.",func:"Quebra a acetilcolina em colina e \xE1cido ac\xE9tico, e a transmiss\xE3o termina. Boa parte da colina \xE9 recaptada pelo terminal e reutilizada.",clueTitle:"Por que importa",clue:"Sem ela, a acetilcolina se acumula, os receptores se dessensibilizam e a transmiss\xE3o falha. \xC9 assim que agem os gases dos nervos e os inseticidas organofosforados.",where:"Na vista M\xFAsculo: os gr\xE3os verdes na fenda, entre o terminal e a placa motora.",rel:["ach","receptor"]},{id:"musculo",g:"jnm",name:"Fibra muscular",color:"#C9605C",morf:"C\xE9lula longa do m\xFAsculo esquel\xE9tico.",func:"Dispara um potencial de a\xE7\xE3o pr\xF3prio e se contrai. Com muitas fibras contraindo juntas, o m\xFAsculo dobra a perna e o p\xE9 se afasta da tachinha.",more:["O RE liso da fibra muscular se chama ret\xEDculo sarcoplasm\xE1tico.","A actina participa da contra\xE7\xE3o (cap. 13).",{x:"O modelo mostra um m\xFAsculo atr\xE1s da coxa, que dobra o joelho. O livro n\xE3o diz qual m\xFAsculo levanta o p\xE9."},{x:"As faixas desenhadas na fibra s\xE3o as estrias do m\xFAsculo esquel\xE9tico."}],where:"Na vista Corpo: o m\xFAsculo atr\xE1s da coxa. Na vista M\xFAsculo: a fibra estriada embaixo do terminal.",rel:["placa","jnm","motor"]}],VT=Object.fromEntries(Zu.map(i=>[i.id,i])),Zp=[{id:"body",name:"Corpo"},{id:"skin",name:"Pele"},{id:"cord",name:"Medula"},{id:"nmj",name:"M\xFAsculo"}],$p=[{id:"pisada",stage:"body",dur:2400,title:"A pisada",text:"A ponta da tachinha rompe a pele da sola do p\xE9. At\xE9 aqui n\xE3o h\xE1 sinal nervoso nenhum: \xE9 s\xF3 um est\xEDmulo mec\xE2nico.",ids:["tachinha","pele"]},{id:"pele",stage:"skin",dur:7e3,title:"Na pele: o estiramento vira sinal el\xE9trico",text:"A ponta estica a membrana da termina\xE7\xE3o sensorial. Canais de Na\u207A sens\xEDveis a estiramento abrem, o Na\u207A entra e a termina\xE7\xE3o despolariza: \xE9 o potencial gerador. Ao atingir o limiar, nasce um potencial de a\xE7\xE3o.",ids:["terminacao","canal-est","sodio"]},{id:"nervo",stage:"body",dur:4200,title:"Pelo nervo at\xE9 a medula",text:"Os potenciais de a\xE7\xE3o sobem pelo ax\xF4nio sensorial, dentro do nervo da perna, e se regeneram a cada trecho. A for\xE7a do est\xEDmulo vai codificada na frequ\xEAncia dos disparos.",ids:["sensorial","nervo"]},{id:"medula",stage:"cord",dur:6200,title:"Na medula: o sinal se divide",text:"O ax\xF4nio entra pela raiz dorsal. Nos terminais, o Ca\xB2\u207A entra e as ves\xEDculas liberam o transmissor, provavelmente glutamato. Os PEPS se somam em dois neur\xF4nios da medula, e dali o sinal segue por dois caminhos.",ids:["raiz-dorsal","sinapse","interneuronio","ascendente"]},{id:"encefalo",stage:"body",dur:4200,title:"Caminho 1: sobe ao enc\xE9falo",text:"Um ax\xF4nio sobe pela medula at\xE9 o enc\xE9falo, onde a dor \xE9 registrada. Isso acontece ao mesmo tempo que o passo seguinte.",ids:["ascendente","encefalo"]},{id:"motor",stage:"cord",dur:5200,title:"Caminho 2: o neur\xF4nio motor dispara",text:"O outro caminho n\xE3o sai da medula: o interneur\xF4nio excita o neur\xF4nio motor, que soma os PEPS e dispara. O comando sai pela raiz ventral, sem passar pelo enc\xE9falo.",ids:["interneuronio","motor","raiz-ventral"]},{id:"juncao",stage:"nmj",dur:8e3,title:"Na jun\xE7\xE3o neuromuscular",text:"O potencial de a\xE7\xE3o desce pelo ax\xF4nio motor at\xE9 o m\xFAsculo. O terminal libera acetilcolina, que abre os receptores nicot\xEDnicos da placa motora. O Na\u207A entra e a fibra muscular dispara. Essa sinapse nunca falha.",ids:["jnm","ach","receptor","ache"]},{id:"levanta",stage:"body",dur:4600,title:"O p\xE9 levanta",text:"As fibras do m\xFAsculo se contraem, a perna dobra e o p\xE9 se afasta da tachinha. Do contato ao movimento, o sinal passou por tr\xEAs neur\xF4nios do modelo (sensorial, interneur\xF4nio e motor) e n\xE3o precisou do enc\xE9falo.",ids:["motor","musculo"]}];var Cs={groups:{est:"Stimulus",sens:"Sensory pathway",med:"Spinal cord",enc:"Brain",mot:"Motor pathway",jnm:"Neuromuscular junction"},views:{body:"Body",skin:"Skin",cord:"Spinal cord",nmj:"Muscle"},path:{},steps:{pisada:{title:"Stepping on the thumbtack",text:"The point of the thumbtack breaks the skin on the sole of the foot. So far there is no nerve signal at all: it is only a mechanical stimulus."},pele:{title:"In the skin: stretch becomes an electrical signal",text:"The point stretches the membrane of the sensory nerve ending. Stretch-sensitive Na\u207A channels open, Na\u207A enters and the ending depolarizes: this is the generator potential. When it reaches threshold, an action potential is born."},nervo:{title:"Along the nerve to the spinal cord",text:"The action potentials travel up the sensory axon, inside the nerve of the leg, and are regenerated at each segment of the axon. The strength of the stimulus is encoded in the firing frequency."},medula:{title:"In the spinal cord: the signal splits",text:"The axon enters through the dorsal root. At the terminals, Ca\xB2\u207A enters and the vesicles release the transmitter, probably glutamate. The EPSPs add up in two neurons of the spinal cord, and from there the signal follows two paths."},encefalo:{title:"Path 1: up to the brain",text:"An axon goes up the spinal cord to the brain, where the pain is registered. This happens at the same time as the next step."},motor:{title:"Path 2: the motor neuron fires",text:"The other path does not leave the spinal cord: the interneuron excites the motor neuron, which sums the EPSPs and fires. The command leaves through the ventral root, without passing through the brain."},juncao:{title:"At the neuromuscular junction",text:"The action potential travels down the motor axon to the muscle. The terminal releases acetylcholine, which opens the nicotinic ACh receptors of the motor end-plate. Na\u207A enters and the muscle fiber fires. This synapse never fails."},levanta:{title:"The foot lifts",text:"The muscle fibers contract, the leg bends and the foot moves away from the thumbtack. From contact to movement, the signal passed through three neurons of the model (sensory, interneuron and motor) and did not need the brain."}},items:{tachinha:{name:"Thumbtack",morf:"Thin metal point.",func:"It is the stimulus. When you step on it, the point breaks the skin and stretches the membrane of the sensory nerve endings.",more:["The book uses this scene in chapters 3, 4 and 5 to follow a signal from start to finish."],where:"On the floor, under the foot. In the Skin view, entering through the sole."},pele:{name:"Skin",morf:"Tissue that covers the body. Inside it are the endings of the sensory neurons.",func:"It is where the mechanical stimulus becomes an electrical signal.",more:[{x:"The drawing shows the skin as a single block, with the surface in a darker shade. The layers of the skin are not covered in chapters 1 to 6."}],where:"In the Skin view: the block cut in half, with the sole of the foot facing down."},terminacao:{name:"Sensory nerve ending",morf:"Tip of the axon of the sensory neuron, inside the skin. The membrane has Na\u207A channels that open when it is stretched.",func:"Turns stretch into an electrical signal. Na\u207A enters and depolarizes the ending: this is the generator potential. If it reaches threshold, an action potential is born.",clueTitle:"Why it matters",clue:"In the sensory neuron, the spike-initiation zone is here, near the ending. In the typical neuron of the brain and spinal cord, it is at the axon hillock.",more:["It is all or none: below threshold, nothing happens; above it, the full action potential comes out.","A stronger stimulus does not produce a bigger action potential: it produces more spikes per second. That is how intensity is encoded."],where:"In the Skin view: the blue branches and the knob just above the point of the thumbtack."},"canal-est":{name:"Stretch-sensitive Na\u207A channel",morf:"Protein in the membrane of the sensory nerve ending, with a pore that opens when the membrane is stretched.",func:"Lets Na\u207A in. Because there is much more Na\u207A outside and the inside is negative, it enters forcefully and depolarizes the ending.",clueTitle:"Three ways to open a channel",clue:"This one opens with stretch. The channels of the action potential open with voltage. Those at synapses open with neurotransmitter.",where:"In the Skin view: the green pairs on the surface of the knob of the ending. They move apart when the thumbtack stretches the membrane."},sodio:{name:"Sodium (Na\u207A)",rows:[["Outside","150 mM"],["Inside","15 mM"],["Equilibrium","+62 mV"]],morf:"Cation ten times more concentrated outside the neuron.",func:"When a Na\u207A channel opens, it enters: diffusion and the negative interior push in the same direction. The entry of positive charge depolarizes the membrane.",more:["It is the same ion at the three points of the story: it enters the ending in the skin, it enters at each segment of the axon during the action potential, and it enters the muscle fiber through the nicotinic ACh receptor."],where:"In the Skin and Muscle views: the orange spheres."},sensorial:{name:"Sensory neuron",aka:"Primary sensory neuron",morf:"Neuron with its ending in the skin and its axon inside the nerve, as far as the spinal cord.",func:"Carries information from the skin to the spinal cord, as action potentials.",clueTitle:"Why it matters",clue:"The action potential is regenerated at each segment of the axon. That is why it reaches the spinal cord the same size as when it left the foot.",more:["The sensory nerve fires at high frequency.","The information is carried in the frequency and pattern of the firing, as in Morse code.","With the order-of-magnitude figures of chapter 4, at 10 m/s and lasting 2 ms, each action potential occupies about 2 cm of axon.","Thin axons, like the ones that carry pain, are the most sensitive to local anesthesia.",{x:"The cell body of this neuron is in the dorsal root ganglion, beside the spinal cord."}],where:"The blue thread: it leaves the sole of the foot, goes up the leg inside the nerve and enters the spinal cord through the dorsal root."},nervo:{name:"Nerve",morf:"Bundle of axons outside the central nervous system.",func:"Connects the spinal cord to the leg. It mixes sensory fibers, which go up, and motor fibers, which go down.",clueTitle:"Why it matters",clue:"Each fiber conducts in one direction only. The same nerve carries the news of the thumbtack up and the command to contract down, in different fibers.",more:["The nerves make up the peripheral nervous system.","In them, the myelin sheath is made by the Schwann cell."],where:"The light-colored tube that surrounds the blue thread and the red thread, from the spinal cord to the leg."},"raiz-dorsal":{name:"Dorsal root",morf:"Near the spinal cord, the fibers of each nerve divide into two roots. The dorsal root is the one at the back.",func:"Sensory information enters the spinal cord through it.",clueTitle:"In history",clue:"Around 1810, Bell and Magendie cut spinal roots: cutting the ventral root causes paralysis, and the dorsal root carries sensory information. That is how it became known that a nerve mixes the two types of fiber.",where:"In the Spinal cord view: the branch at the back, with a swelling in the middle."},ganglio:{name:"Dorsal root ganglion",morf:"Swelling on the dorsal root, beside the spinal cord.",func:"Houses the cell bodies of the sensory neurons.",more:[{x:"This structure is not in chapters 1 to 6. It was included in the model because the sensory neuron needs a cell body, and that is where it is."}],where:"In the Spinal cord view: the translucent bulb on the dorsal root, with the blue cell body inside."},medula:{name:"Spinal cord",morf:"Part of the central nervous system, together with the brain.",func:"It is where the thumbtack signal passes from the sensory neuron to other neurons and splits: one path goes up to the brain, the other goes to the motor neurons.",clueTitle:"Why it matters",clue:"The command to lift the foot leaves from here. It does not wait for the brain.",more:["Glycine is the inhibitory transmitter of the spinal cord and brain stem. Without this inhibition, reflexes become exaggerated: this is the effect of strychnine.",{x:"In cross section, the gray matter is in the middle, shaped like a butterfly, and the white matter is around it."}],where:"In the Body view: the light-colored cord that runs down from the brain along the back. In the Spinal cord view: a slice in cross section."},cinzenta:{name:"Gray matter",morf:"The darker part of nervous tissue.",func:"Receives and sends information through the fibers of the white matter.",more:[{x:"It is where the cell bodies of the neurons and the synapses are. In the spinal cord, it is shaped like a butterfly: the back part receives the sensory axon, and the motor neurons are in the front part."}],where:"In the Spinal cord view: the butterfly in the middle of the slice."},branca:{name:"White matter",morf:"The lighter part of nervous tissue. It is continuous with the nerves.",func:"Contains the fibers that carry information to and from the gray matter.",more:["In the model, the axon that goes up to the brain runs through it.",{x:"The light color comes from the myelin that wraps the axons."}],where:"In the Spinal cord view: the light part around the butterfly."},sinapse:{name:"Synapse in the spinal cord",morf:"Contact between the terminal of the sensory axon and the next neuron.",func:"The action potential reaches the terminal, Ca\xB2\u207A enters and the vesicles release the transmitter, probably glutamate. On the other side, the channels let positive charge in: this is an EPSP.",clueTitle:"Why it matters",clue:"A single synapse produces an EPSP of a few tenths of a mV, which is not enough. Because the sensory nerve fires at high frequency and many synapses are activated together, the EPSPs add up and bring the spike-initiation zone to threshold.",more:["Temporal summation: EPSPs from the same synapse in rapid succession. Spatial summation: EPSPs from several synapses at the same time.","Glutamate is the main excitatory transmitter of the central nervous system."],where:"In the Spinal cord view: the lilac knobs where an axon touches the next neuron."},interneuronio:{name:"Interneuron",morf:"Neuron that connects only with other neurons. Most neurons are of this type.",func:"In the model, it receives the signal from the sensory neuron and passes it on to the motor neuron.",clueTitle:"To check against the book",clue:"The study guides of this project record only that the signal splits in the spinal cord between the path to the brain and the path to the motor neurons. The interneuron in the middle of the path was drawn from the reflex figure in chapter 3, without checking against the PDF.",more:["Not every interneuron excites. A GABAergic interneuron, for example, inhibits its targets.","What happens after each synapse depends on which cell comes next. This explains how a simple stimulus produces a complex behavior, such as shouting and pulling the foot back."],where:"In the Spinal cord view: the blue-green neuron, between the sensory axon and the motor neuron."},ascendente:{name:"Pathway to the brain",morf:"Spinal cord neuron whose axon goes up through the white matter to the brain.",func:"Carries the information about the thumbtack to the brain, where the pain is registered.",clueTitle:"Why it matters",clue:"This path and the path of the motor neuron set off at the same time. Feeling the pain and lifting the foot are two results of the same signal.",more:[{x:"Anatomically, this axon crosses to the other side of the spinal cord before going up, and there are other stops inside the brain. That is a subject of the somatic sensory system, outside chapters 1 to 6."}],where:"The purple thread. In the Spinal cord view, it crosses the slice and goes up. In the Body view, it runs beside the spinal cord up to the head."},encefalo:{name:"Brain",morf:"Cerebrum, cerebellum and brain stem. With the spinal cord, it forms the central nervous system.",func:"It is where the sensation of pain is registered.",clueTitle:"What it does not do here",clue:"It is not the brain that orders the foot to lift. That command leaves the spinal cord, in parallel with the signal that goes up.",more:["The cerebrum is only one part of the brain."],where:"In the Body view: inside the head."},motor:{name:"Motor neuron",morf:"Neuron with its cell body in the spinal cord and its axon inside the nerve, as far as the muscle.",func:"Sums the EPSPs it receives. If the total reaches threshold at the spike-initiation zone, it fires and carries the command to contract.",clueTitle:"Why it matters",clue:"It is the output of the nervous system. Everything the spinal cord and the brain decide only becomes movement by passing through it.",more:["All the motor neurons of the spinal cord and brain stem are cholinergic: they release acetylcholine.","The enzyme ChAT, which makes acetylcholine, is the marker for these neurons.","Its spike-initiation zone is the axon hillock.",{x:"In the drawing, the cell body is in the front (ventral) part of the gray matter."}],where:"The red thread: it leaves the spinal cord through the ventral root and goes down the nerve to the muscle."},"raiz-ventral":{name:"Ventral root",morf:"The front root, of the two into which each nerve divides near the spinal cord.",func:"The axons of the motor neurons leave through it.",clueTitle:"In history",clue:"Bell cut only the ventral roots and saw paralysis: they are motor.",where:"In the Spinal cord view: the front branch, which joins the dorsal root to form the nerve."},jnm:{name:"Neuromuscular junction",morf:"Synapse between the axon of the motor neuron and a skeletal muscle fiber. It is one of the largest in the body, and the terminal has many active zones.",func:"Passes the command from the nerve to the muscle. An action potential in the motor axon always produces an action potential in the muscle fiber.",clueTitle:"Why it never fails",clue:"One action potential releases about 200 vesicles and produces an EPSP of 40 mV or more. At a typical synapse of the central nervous system, often only a single vesicle is released.",more:["Botulinum toxin destroys SNARE proteins of the terminal and blocks the release of acetylcholine.","Because it is accessible, it is where much of what is known about chemical synapses was discovered."],where:"In the Muscle view: the pinkish terminal, cut open, resting on the muscle fiber."},ach:{name:"Acetylcholine",aka:"ACh",morf:"Neurotransmitter stored in the vesicles of the motor terminal.",func:"Released into the cleft, it binds to the nicotinic ACh receptors of the motor end-plate.",clueTitle:"Why it matters",clue:"It is the receptor, not the transmitter, that decides the effect: the same acetylcholine contracts skeletal muscle and slows the heart.",more:["It is made in the cytosol of the terminal by the enzyme ChAT, from choline and acetyl CoA.","Inside a vesicle, it can reach 1,000 mM.","It was the first neurotransmitter identified: Otto Loewi\u2019s Vagusstoff, in 1921."],where:"In the Muscle view: the yellow spheres inside the terminal are the vesicles; the grains in the cleft are the released acetylcholine."},placa:{name:"Motor end-plate",aka:"End-plate",morf:"Patch of the muscle fiber membrane under the terminal. It has folds full of receptors, aligned with the active zones.",func:"It is the postsynaptic side of the junction: it receives the acetylcholine and depolarizes the fiber.",where:"In the Muscle view: the folds on the surface of the fiber, just below the terminal."},receptor:{name:"Nicotinic ACh receptor",aka:"Nicotinic cholinergic receptor",morf:"Ion channel of the motor end-plate: five subunits around a pore, like the staves of a barrel.",func:"Opens when two molecules of acetylcholine bind. It lets Na\u207A and K\u207A through; because more Na\u207A enters than K\u207A leaves, the muscle fiber depolarizes.",clueTitle:"Why it excites",clue:"With Na\u207A and K\u207A passing equally, the channel pulls the potential close to 0 mV, above threshold.",more:["In muscle, the composition is \u03B12\u03B2\u03B3\u03B4, with one acetylcholine binding site on each \u03B1 subunit.","Nicotine activates it, hence the name. Curare and \u03B1-bungarotoxin block it and cause paralysis.","If acetylcholine stays high for several seconds, the channel closes even with it present: this is desensitization."],where:"In the Muscle view: the blue channels at the top of the folds of the motor end-plate."},ache:{name:"Acetylcholinesterase",aka:"AChE",morf:"Enzyme deposited in the cleft of the neuromuscular junction by the muscle cells.",func:"Breaks acetylcholine down into choline and acetic acid, and transmission ends. Much of the choline is taken back up by the terminal and reused.",clueTitle:"Why it matters",clue:"Without it, acetylcholine accumulates, the receptors desensitize and transmission fails. That is how nerve gases and organophosphate insecticides act.",where:"In the Muscle view: the green grains in the cleft, between the terminal and the motor end-plate."},musculo:{name:"Muscle fiber",morf:"Long cell of skeletal muscle.",func:"Fires an action potential of its own and contracts. With many fibers contracting together, the muscle bends the leg and the foot moves away from the thumbtack.",more:["The smooth ER of the muscle fiber is called the sarcoplasmic reticulum.","Actin takes part in contraction (ch. 13).",{x:"The model shows a muscle at the back of the thigh, which bends the knee. The book does not say which muscle lifts the foot."},{x:"The bands drawn on the fiber are the striations of skeletal muscle."}],where:"In the Body view: the muscle at the back of the thigh. In the Muscle view: the striated fiber under the terminal."}}};var Jp="neurohub.lang",$u=["pt","en"],iS=()=>{try{return localStorage.getItem(Jp)}catch{return null}},Kp=i=>{try{localStorage.setItem(Jp,i)}catch{}};function sS(){let i=null;try{i=new URLSearchParams(location.search).get("lang")}catch{}if($u.includes(i))return Kp(i),i;let t=iS();return $u.includes(t)?t:(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"pt"]).map(n=>String(n).toLowerCase())
