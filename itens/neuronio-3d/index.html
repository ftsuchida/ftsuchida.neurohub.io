as organelas. \xC9 onde os genes viram prote\xEDnas: tudo o que o neur\xF4nio usa sai daqui.",clue:"O citosol rico em K\u207A \xE9 a base do potencial de repouso (cap. 3).",more:["Tudo o que fica dentro da membrana, menos o n\xFAcleo, forma o citoplasma.","Os neurotransmissores pept\xEDdicos s\xE3o feitos aqui: o precursor \xE9 montado no RE rugoso e cortado no aparelho de Golgi (cap. 5).","Tamb\xE9m recebe sinapses (axossom\xE1ticas). As inibit\xF3rias costumam se agrupar no soma e perto do cone de implanta\xE7\xE3o."],where:"Aberto em corte no centro da cena, com as organelas \xE0 mostra.",rel:["citosol","nucleo","re-rugoso","cone"]},{id:"nucleo",g:"soma",name:"N\xFAcleo",color:"#6A62CF",size:"5\u201310 \xB5m",morf:"Esfera no meio do soma, com um envelope duplo cheio de poros.",func:"Guarda o DNA. Ali ocorre a transcri\xE7\xE3o: o gene \xE9 copiado em RNAm, que sai pelos poros at\xE9 os ribossomos.",clue:"O DNA \xE9 o mesmo em todas as c\xE9lulas do corpo. O que faz um neur\xF4nio ser neur\xF4nio s\xE3o os genes que ele usa.",more:["Do gene \xE0 prote\xEDna: transcri\xE7\xE3o (a RNA-polimerase copia o gene), processamento (saem os \xEDntrons, emendam-se os \xE9xons) e tradu\xE7\xE3o nos ribossomos.","No splicing alternativo, um mesmo gene gera prote\xEDnas diferentes.","O genoma humano tem cerca de 25 mil genes."],where:"Esfera grande dentro do soma. Os pontos escuros s\xE3o os poros.",rel:["re-rugoso","ribossomos"]},{id:"re-rugoso",g:"soma",name:"RE rugoso",aka:"Corp\xFAsculos de Nissl",color:"#C48BE3",morf:"Pilhas de membrana cravejadas de ribossomos, em volta do n\xFAcleo.",func:"Faz as prote\xEDnas destinadas a membranas (canais, bombas, receptores). Elas s\xE3o inseridas na membrana enquanto s\xE3o sintetizadas.",clue:"\xC9 abundante no neur\xF4nio porque ele depende de muitas prote\xEDnas de membrana. Foi o que Nissl viu ao corar o tecido.",more:["Neur\xF4nios t\xEAm mais RE rugoso que a glia e que a maioria das c\xE9lulas.","Monta o precursor dos neurotransmissores pept\xEDdicos (cap. 5).","O ax\xF4nio n\xE3o tem RE rugoso: por isso depende do soma."],where:"L\xE2minas curvas ao lado do n\xFAcleo, pontilhadas de ribossomos.",rel:["ribossomos","golgi","membrana"]},{id:"ribossomos",g:"soma",name:"Ribossomos livres",aka:"Em grupo: polirribossomo",color:"#E9BE4E",morf:"Gr\xE3os soltos no citosol. V\xE1rios ribossomos lendo o mesmo RNAm formam um polirribossomo.",func:"Fazem as prote\xEDnas que ficam no citosol.",clue:"Tamb\xE9m aparecem nos dendritos, embaixo dos espinhos.",more:["No polirribossomo, cada ribossomo produz uma c\xF3pia da mesma prote\xEDna.","Na base dos espinhos, a atividade da sinapse pode mandar fabricar prote\xEDna ali mesmo, algo importante para guardar informa\xE7\xE3o (cap. 25)."],where:"Gr\xE3os dourados soltos no soma. Os enfileirados em arco s\xE3o polirribossomos.",rel:["re-rugoso","espinhos"]},{id:"re-liso",g:"soma",name:"RE liso",color:"#7CC4D6",morf:"Membrana sem ribossomos.",func:"Ajuda a dobrar prote\xEDnas e regula concentra\xE7\xF5es internas, como a de Ca\xB2\u207A.",more:["No m\xFAsculo, chama-se ret\xEDculo sarcoplasm\xE1tico.","Tem canais de Ca\xB2\u207A que o segundo mensageiro IP3 abre, soltando c\xE1lcio no citosol (cap. 6)."],where:"Rede de tubos lisos, perto da borda do soma.",rel:["re-rugoso"]},{id:"golgi",g:"soma",name:"Aparelho de Golgi",color:"#F3A56F",morf:"Pilha de discos de membrana.",func:"Processa as prote\xEDnas depois da tradu\xE7\xE3o e as endere\xE7a para cada parte do neur\xF4nio, como ax\xF4nio ou dendritos.",clue:"\xC9 a expedi\xE7\xE3o da f\xE1brica.",more:["Corta o precursor dos neurotransmissores pept\xEDdicos. Dele sai o gr\xE2nulo secretor j\xE1 cheio, que desce pelo ax\xF4nio (cap. 5)."],where:"Pilha de discos, do lado do soma oposto ao n\xFAcleo.",rel:["re-rugoso","axonio","granulos"]},{id:"mitocondria",g:"soma",name:"Mitoc\xF4ndria",color:"#EC766F",size:"~1 \xB5m",morf:"Organela alongada, com a membrana interna dobrada.",func:"Respira\xE7\xE3o celular: produz ATP.",clue:"O ATP paga as bombas i\xF4nicas e o transporte no ax\xF4nio. O terminal axonal tem muitas mitoc\xF4ndrias: sinal de gasto alto de energia.",more:["Entram \xE1cido pir\xFAvico e oxig\xEAnio. O ciclo de Krebs e a cadeia de transporte de el\xE9trons transformam ADP em ATP.","A bomba de s\xF3dio e pot\xE1ssio consome at\xE9 70% do ATP do enc\xE9falo (cap. 3).","Na membrana externa fica a MAO, enzima que destr\xF3i catecolaminas e serotonina recaptadas (cap. 6)."],where:"C\xE1psulas no soma (uma est\xE1 aberta, mostrando as dobras) e dentro do terminal, na vista Sinapse.",rel:["terminal","bomba","microtubulo"]},{id:"citosol",g:"liq",name:"Citosol",short:"Citosol",color:"#B3A4F0",rows:[["K\u207A","100 mM"],["Na\u207A","15 mM"],["Ca\xB2\u207A","0,0002 mM"],["Cl\u207B","13 mM"]],morf:"Solu\xE7\xE3o salina que preenche o neur\xF4nio por dentro, do soma aos neuritos. \xC9 rica em K\u207A e pobre em Na\u207A.",func:"\xC9 onde ficam as organelas e por onde a corrente el\xE9trica corre dentro do neur\xF4nio, carregada por \xEDons.",clueTitle:"Por que importa",clue:"\xC9 o lado de dentro da bateria. As bombas mant\xEAm o K\u207A alto aqui e o Na\u207A alto l\xE1 fora; essa diferen\xE7a \xE9 o que os canais usam para gerar o potencial de repouso e o potencial de a\xE7\xE3o.",more:["Tudo o que fica dentro da membrana, menos o n\xFAcleo, forma o citoplasma: citosol mais organelas.","Conduz muito pior que um fio de cobre: quem carrega a carga s\xE3o \xEDons, n\xE3o el\xE9trons livres.","\xC9 eletricamente neutro. A carga negativa do repouso fica colada \xE0 face interna da membrana.","O Ca\xB2\u207A \xE9 mantido baix\xEDssimo pela bomba de c\xE1lcio, por prote\xEDnas que se ligam a ele e por organelas que o sequestram.","No terminal, os transmissores pequenos s\xE3o fabricados no citosol e depois concentrados nas ves\xEDculas.","Segundos mensageiros, como o AMPc, se difundem por ele (cap. 6)."],where:"No soma aberto, \xE9 todo o espa\xE7o entre as organelas. Com L\xEDquidos ligado, aparece como o volume lil\xE1s dentro do soma, do terminal e do ax\xF4nio.",rel:["soma","extracelular","membrana","ion-k","bomba"]},{id:"extracelular",g:"liq",name:"L\xEDquido extracelular",short:"Extracelular",color:"#7FD0DA",rows:[["K\u207A","5 mM"],["Na\u207A","150 mM"],["Ca\xB2\u207A","2 mM"],["Cl\u207B","150 mM"]],morf:"Solu\xE7\xE3o salina que banha neur\xF4nios e glia por fora. \xC9 rica em Na\u207A e Cl\u207B e pobre em K\u207A.",func:"\xC9 o lado de fora da bateria. \xC9 tamb\xE9m por ele que o neurotransmissor se difunde na fenda sin\xE1ptica.",clueTitle:"Por que importa",clue:"O potencial de repouso \xE9 muito sens\xEDvel ao K\u207A daqui: subir de 5 para 50 mM leva o Vm de \u221265 para cerca de \u221217 mV. Por isso os astr\xF3citos e a barreira hematencef\xE1lica mant\xEAm esse K\u207A baixo.",more:["O espa\xE7o \xE9 m\xEDnimo: os astr\xF3citos preenchem o espa\xE7o entre os neur\xF4nios, e sobram frestas de cerca de 20 nm. A cena afasta as c\xE9lulas para dar para ver.","Como tamb\xE9m conduz eletricidade, a corrente que viaja pelo ax\xF4nio vaza para ele: \xE9 a mangueira furada do cap\xEDtulo 3.","A fenda sin\xE1ptica faz parte dele, com 20 a 50 nm.","Os astr\xF3citos captam o K\u207A onde houve muita atividade e o espalham pela rede de prolongamentos (tamponamento espacial)."],where:"Todo o espa\xE7o fora das c\xE9lulas. Com L\xEDquidos ligado, o fundo fica azulado e os pontos soltos representam \xEDons: alaranjados para Na\u207A, roxos para K\u207A.",rel:["citosol","astrocito","fenda","ion-na","sangue"]},{id:"liquor",g:"liq",name:"L\xEDquido dos ventr\xEDculos",short:"Ventr\xEDculos",color:"#7DAFEF",morf:"L\xEDquido que enche os ventr\xEDculos, as cavidades do enc\xE9falo.",func:"Preenche os ventr\xEDculos e fica em contato com as c\xE9lulas ependim\xE1rias que os revestem.",clueTitle:"Na hist\xF3ria",clue:"Galeno achou os ventr\xEDculos cheios de l\xEDquido e concluiu, errado, que sensa\xE7\xE3o e movimento eram fluidos indo e vindo pelos nervos. A ideia s\xF3 caiu quando se mostrou que os nervos conduzem eletricidade.",more:[{x:"Em anatomia ele se chama l\xEDquido cerebrospinal, l\xEDquido cefalorraquidiano ou l\xEDquor. O nome e a fun\xE7\xE3o dele n\xE3o aparecem nos cap\xEDtulos 1 a 6."}],where:"Na vista Tecido, com L\xEDquidos ligado: o volume azul \xE0 esquerda da parede de c\xE9lulas ependim\xE1rias.",rel:["ependimaria","extracelular"]},{id:"sangue",g:"liq",name:"Sangue",short:"Sangue",color:"#EFD27F",morf:"L\xEDquido que corre dentro dos capilares.",func:"Traz oxig\xEAnio e nutrientes ao tecido nervoso.",clueTitle:"Por que importa",clue:"N\xE3o se mistura livremente com o l\xEDquido extracelular: a barreira hematencef\xE1lica, nas paredes dos capilares, limita a passagem de K\u207A.",more:["O triptofano, mat\xE9ria-prima da serotonina, chega ao enc\xE9falo pelo sangue (cap. 6).","A micr\xF3glia pode vir do sangue.","No cora\xE7\xE3o n\xE3o h\xE1 essa barreira: por isso cloreto de pot\xE1ssio na veia \xE9 letal.",{x:"A parte l\xEDquida do sangue se chama plasma. As c\xE9lulas vermelhas desenhadas s\xE3o hem\xE1cias."}],where:"Na vista Tecido, com L\xEDquidos ligado: o l\xEDquido amarelado dentro do capilar.",rel:["capilar","extracelular","astrocito"]},{id:"membrana",g:"estr",name:"Membrana neuronal",color:"#7FCBA4",sizeLabel:"Espessura",size:"5 nm",morf:"Bicamada de fosfolip\xEDdios cravejada de prote\xEDnas: umas bombeiam subst\xE2ncias, outras formam poros. A composi\xE7\xE3o muda entre soma, dendritos e ax\xF4nio.",func:"Barreira para \xEDons. As prote\xEDnas dela criam os sinais el\xE9tricos do neur\xF4nio.",clue:"A diferen\xE7a entre ax\xF4nio e dendrito \xE9, no n\xEDvel molecular, uma diferen\xE7a de prote\xEDnas de membrana.",more:["Cada fosfolip\xEDdio tem uma cabe\xE7a polar, que gosta de \xE1gua, e uma cauda que foge dela. Em duas camadas, as caudas se escondem no meio.","Canais i\xF4nicos: 4 a 6 subunidades em volta de um poro, com seletividade e, em muitos, port\xE3o.","Bombas i\xF4nicas: enzimas que usam ATP para mover \xEDons contra o gradiente.","A carga separada fica colada \xE0s duas faces da membrana (capacit\xE2ncia). O resto das solu\xE7\xF5es \xE9 neutro.","Somando todos os neur\xF4nios, d\xE1 cerca de 21 mil m\xB2 de membrana."],where:"Na vista Ax\xF4nio: a parede em duas camadas, aberta em janela. Na vista Impulso: a bicamada com os canais.",rel:["canal-na","canal-k","bomba","re-rugoso","citosol","extracelular"]},{id:"microtubulo",g:"estr",name:"Microt\xFAbulo",color:"#58B9C4",size:"20 nm",morf:"Tubo oco de tubulina, que corre ao longo dos neuritos.",func:"Trilho do transporte axoplasm\xE1tico: ves\xEDculas caminham sobre ele gastando ATP. A cinesina leva do soma ao terminal; a dine\xEDna traz de volta.",clue:"O terminal axonal n\xE3o tem microt\xFAbulos.",more:["Prote\xEDnas associadas (MAPs), como a tau, organizam os microt\xFAbulos. No Alzheimer, a tau se solta e se acumula em emaranhados neurofibrilares.","Transporte r\xE1pido: at\xE9 1.000 mm por dia. Transporte lento: 1 a 10 mm por dia.","Os v\xEDrus do herpes e da raiva entram no sistema nervoso pelo transporte retr\xF3grado."],where:"Na vista Ax\xF4nio: os tubos ocos mais grossos.",rel:["neurofilamento","microfilamento","axonio"]},{id:"neurofilamento",g:"estr",name:"Neurofilamento",color:"#D6B95B",size:"10 nm",morf:"Subunidades tran\xE7adas como corda.",func:"Resist\xEAncia mec\xE2nica. \xC9 o mais resistente dos tr\xEAs e faz o papel de osso.",more:["\xC9 um filamento intermedi\xE1rio, parente da queratina do pelo."],where:"Na vista Ax\xF4nio: as cordas tran\xE7adas, de espessura m\xE9dia.",rel:["microtubulo","microfilamento"]},{id:"microfilamento",g:"estr",name:"Microfilamento",color:"#EE8DB0",size:"5 nm",morf:"Duas fitas tran\xE7adas de actina, presas \xE0 membrana.",func:"Muda a forma da c\xE9lula.",more:["O citoesqueleto \xE9 montado e desmontado o tempo todo.","No m\xFAsculo, a actina participa da contra\xE7\xE3o (cap. 13)."],where:"Na vista Ax\xF4nio: os fios mais finos, colados por dentro da membrana.",rel:["microtubulo","neurofilamento","membrana"]},{id:"neuritos",g:"in",name:"Neuritos",color:"#9AB0C4",also:["dendritos","espinhos","axonio","colaterais","cone"],morf:"Prolongamentos finos que saem do soma. S\xE3o de dois tipos: ax\xF4nio e dendritos.",func:"Nome geral. Os dendritos s\xE3o a entrada do sinal; o ax\xF4nio \xE9 a sa\xEDda.",more:["Pelo n\xFAmero de neuritos, o neur\xF4nio \xE9 unipolar, bipolar ou multipolar. A maioria no enc\xE9falo \xE9 multipolar."],where:"Tudo o que sai do soma. Ao escolher este item, dendritos e ax\xF4nio ficam em destaque juntos.",rel:["dendritos","axonio"]},{id:"dendritos",g:"in",name:"Dendritos",aka:"\xC1rvore dendr\xEDtica",color:"#74AEEE",sizeLabel:"Comprimento",size:"Raramente passam de 2 mm",morf:"V\xE1rios por neur\xF4nio, curtos, ramificados, e afinam na ponta.",func:"Antenas: recebem milhares de sinapses. A membrana embaixo delas tem receptores que detectam os neurotransmissores.",clue:"\xC1rvore elaborada indica c\xE9lula especializada em receber muitos sinais.",more:["Aqui o sinal n\xE3o se regenera: cada PEPS \xE9 pequeno e decai com a dist\xE2ncia. A uma constante de comprimento (\u03BB) da sinapse, sobram 37%.","O neur\xF4nio soma os PEPS no espa\xE7o (v\xE1rias sinapses ao mesmo tempo) e no tempo (a mesma sinapse em sequ\xEAncia r\xE1pida).","A maioria dos dendritos tem canais de Na\u207A, Ca\xB2\u207A e K\u207A dependentes de voltagem, que amplificam PEPS pequenos e distantes."],where:"Os ramos que saem do soma em v\xE1rias dire\xE7\xF5es.",rel:["espinhos","sinapse","receptores"]},{id:"espinhos",g:"in",name:"Espinhos dendr\xEDticos",color:"#A3CFF6",morf:"Pequenas bolsas penduradas no dendrito.",func:"Recebem sinapses e isolam as rea\xE7\xF5es qu\xEDmicas disparadas por cada uma. Mudam de forma conforme a atividade.",more:["A sinapse feita em um espinho se chama axoespinhosa.","Na base h\xE1 polirribossomos: a sinapse pode mandar fabricar prote\xEDna no local.","Em crian\xE7as com defici\xEAncia intelectual, os espinhos s\xE3o menos numerosos, longos e finos, parecidos com os de fetos."],where:"As bolinhas ao longo dos dendritos. Na vista Sinapse, a bolsa logo abaixo da fenda.",rel:["dendritos","sinapse","ribossomos"]},{id:"cone",g:"out",name:"Cone de implanta\xE7\xE3o",aka:"Zona de gatilho",color:"#F2BE63",morf:"Regi\xE3o do soma que afunila at\xE9 o segmento inicial do ax\xF4nio.",func:"Zona de gatilho: os canais de Na\u207A dependentes de voltagem s\xE3o densos aqui, e \xE9 onde nasce o potencial de a\xE7\xE3o.",clue:"Vale para o neur\xF4nio t\xEDpico do enc\xE9falo e da medula. No neur\xF4nio sensorial, o gatilho fica perto da termina\xE7\xE3o sensorial.",more:["O neur\xF4nio dispara quando a soma dos PEPS, descontada a inibi\xE7\xE3o, atinge o limiar aqui.","Soma e dendritos em geral n\xE3o disparam potenciais de a\xE7\xE3o de Na\u207A, porque t\xEAm poucos desses canais."],where:"O funil entre o soma e o ax\xF4nio. Os pontos vermelhos marcam canais de Na\u207A.",rel:["canal-na","axonio","nodulo"]},{id:"axonio",g:"out",name:"Ax\xF4nio",color:"#ED9F67",size:"<1 mm a >1 m de comprimento; <1 a ~25 \xB5m de di\xE2metro",morf:"Um por neur\xF4nio, com di\xE2metro uniforme e ramos em \xE2ngulo reto. N\xE3o tem RE rugoso e quase n\xE3o tem ribossomos.",func:"Conduz o potencial de a\xE7\xE3o para longe do soma. Quanto mais grosso, mais r\xE1pido.",clue:"Sem ribossomos, n\xE3o fabrica prote\xEDnas: tudo vem do soma. Separado dele, degenera (degenera\xE7\xE3o walleriana).",more:["O potencial de a\xE7\xE3o se regenera a cada trecho e n\xE3o encolhe no caminho. N\xE3o volta porque o trecho de tr\xE1s est\xE1 refrat\xE1rio.","A cerca de 10 m/s e com 2 ms de dura\xE7\xE3o, um potencial de a\xE7\xE3o ocupa uns 2 cm de ax\xF4nio por vez.","Enzimas e gr\xE2nulos de pept\xEDdeo descem do soma por transporte axoplasm\xE1tico.","Na lula, o ax\xF4nio gigante chega a 1 mm de di\xE2metro. Foi nele que Hodgkin e Huxley trabalharam."],where:"O fio longo que sai do cone. Aparece nu no come\xE7o, nos n\xF3dulos e no fim.",rel:["cone","mielina","colaterais","terminal","microtubulo"]},{id:"colaterais",g:"out",name:"Colaterais",color:"#DB8552",morf:"Ramos do ax\xF4nio, que saem em \xE2ngulo reto. As que voltam para a pr\xF3pria c\xE9lula ou para c\xE9lulas vizinhas s\xE3o colaterais recorrentes.",func:"Levam o mesmo sinal a outros alvos.",where:"O ramo que sai do ax\xF4nio em um n\xF3dulo.",rel:["axonio","terminal"]},{id:"mielina",g:"out",name:"Bainha de mielina",color:"#EFE4C8",morf:"Membrana de glia enrolada em espiral em volta do ax\xF4nio, interrompida a intervalos.",func:"Isola o ax\xF4nio: menos corrente vaza pela membrana, e a condu\xE7\xE3o acelera.",clue:"N\xE3o \xE9 parte do neur\xF4nio. \xC9 membrana de oligodendr\xF3cito (no sistema nervoso central) ou de c\xE9lula de Schwann (no perif\xE9rico).",more:["Na esclerose m\xFAltipla, a mielina do sistema nervoso central \xE9 atacada, e a condu\xE7\xE3o fica lenta ou falha.","Na s\xEDndrome de Guillain-Barr\xE9, o ataque \xE9 \xE0 mielina dos nervos perif\xE9ricos."],where:"As capas claras em volta do ax\xF4nio. Na vista Ax\xF4nio, o corte mostra a espiral.",rel:["oligodendrocito","schwann","nodulo"]},{id:"nodulo",g:"out",name:"N\xF3dulo de Ranvier",color:"#F6B77A",sizeLabel:"Espa\xE7amento",size:"0,2 a 2 mm",morf:"Intervalo sem mielina, onde a membrana do ax\xF4nio fica exposta e os canais de Na\u207A se concentram.",func:"Regenera o potencial de a\xE7\xE3o, que salta de n\xF3dulo em n\xF3dulo (condu\xE7\xE3o saltat\xF3ria).",more:["Quanto mais grosso o ax\xF4nio, mais espa\xE7ados os n\xF3dulos."],where:"Os intervalos entre duas capas de mielina. Os pontos vermelhos marcam canais de Na\u207A.",rel:["mielina","canal-na","cone"]},{id:"terminal",g:"out",name:"Terminal axonal",aka:"Bot\xE3o terminal",color:"#EE8AA4",morf:"Ponta dilatada do ax\xF4nio. N\xE3o tem microt\xFAbulos, \xE9 cheia de ves\xEDculas sin\xE1pticas, tem um revestimento denso de prote\xEDnas na face voltada para a sinapse e muitas mitoc\xF4ndrias.",func:"Converte o sinal el\xE9trico em qu\xEDmico: libera neurotransmissor na fenda.",more:["O ax\xF4nio pode terminar em v\xE1rios ramos curtos (arboriza\xE7\xE3o terminal) ou fazer sinapses de passagem (bot\xF5es en passant).","Os transmissores pequenos (amino\xE1cidos e aminas) s\xE3o fabricados aqui mesmo, no citosol, por enzimas que vieram do soma.","Transportadores da membrana recaptam o transmissor da fenda, usando o gradiente de Na\u207A.","Autorreceptores sentem o transmissor liberado e freiam a libera\xE7\xE3o, como uma v\xE1lvula de seguran\xE7a."],where:"Os bot\xF5es no fim do ax\xF4nio. Por dentro, na vista Sinapse.",rel:["vesiculas","zona-ativa","sinapse","mitocondria"]},{id:"sinapse",g:"syn",name:"Sinapse",color:"#C97BD8",sizeLabel:"Fenda",size:"20 a 50 nm",morf:"Tem um lado pr\xE9-sin\xE1ptico (em geral, o terminal), a fenda sin\xE1ptica e um lado p\xF3s-sin\xE1ptico (dendrito ou soma de outro neur\xF4nio), com receptores.",func:"Ponto de contato onde o sinal passa de uma c\xE9lula a outra: chega el\xE9trico, vira qu\xEDmico e volta a ser el\xE9trico do outro lado.",clue:"Sinapse tipo I de Gray (assim\xE9trica, lado p\xF3s mais espesso) costuma ser excitat\xF3ria. Tipo II (sim\xE9trica) costuma ser inibit\xF3ria.",more:["Em seis passos: chega o potencial de a\xE7\xE3o; abrem-se canais de Ca\xB2\u207A; a ves\xEDcula se funde e solta o transmissor; ele cruza a fenda; o receptor responde; o transmissor \xE9 retirado.","Pelo lugar do contato: axodendr\xEDtica, axossom\xE1tica, axoax\xF4nica ou axoespinhosa.","A maioria das sinapses do sistema nervoso maduro \xE9 qu\xEDmica. Tamb\xE9m existem sinapses el\xE9tricas (jun\xE7\xF5es comunicantes, a 3 nm), bidirecionais e quase instant\xE2neas.","Uma sinapse t\xEDpica do sistema nervoso central gera um PEPS de alguns d\xE9cimos de mV. Sozinha, n\xE3o faz o neur\xF4nio disparar."],where:"Onde um bot\xE3o terminal toca o dendrito do neur\xF4nio seguinte. Em detalhe, na vista Sinapse.",rel:["terminal","vesiculas","fenda","receptores","astrocito"]},{id:"vesiculas",also:["neurotransmissor"],g:"syn",name:"Ves\xEDculas sin\xE1pticas",color:"#F1CF62",size:"~50 nm",morf:"Esferas de membrana dentro do terminal. O neurotransmissor fica guardado no interior delas, o l\xFAmen.",func:"Guardam o neurotransmissor e o liberam na fenda por exocitose: a membrana da ves\xEDcula se funde com a do terminal.",clue:"A libera\xE7\xE3o \xE9 r\xE1pida porque as ves\xEDculas j\xE1 est\xE3o atracadas na zona ativa, bem onde o Ca\xB2\u207A entra.",more:["Transportadores na membrana da ves\xEDcula concentram o transmissor l\xE1 dentro at\xE9 100 mil vezes, trocando cada mol\xE9cula por um H\u207A.","O l\xFAmen \xE9 \xE1cido: uma bomba de H\u207A movida a ATP mant\xE9m isso, e \xE9 esse gradiente de H\u207A que o transportador usa.","Cada ves\xEDcula carrega alguns milhares de mol\xE9culas de transmissor.","Prote\xEDnas SNARE amarram a ves\xEDcula \xE0 membrana do terminal. A sinaptotagmina sente o Ca\xB2\u207A e dispara a fus\xE3o.","Depois da exocitose, a membrana \xE9 recuperada por endocitose, e a ves\xEDcula \xE9 recarregada.","Guardam amino\xE1cidos e aminas. Pept\xEDdeos ficam nos gr\xE2nulos secretores."],where:"Na vista Sinapse: as esferas dentro do terminal. Duas est\xE3o abertas, mostrando o neurotransmissor no l\xFAmen.",rel:["neurotransmissor","zona-ativa","granulos","terminal"]},{id:"neurotransmissor",g:"syn",name:"Neurotransmissor",color:"#F2A541",morf:"Mol\xE9cula guardada no l\xFAmen das ves\xEDculas sin\xE1pticas. H\xE1 tr\xEAs fam\xEDlias: amino\xE1cidos (glutamato, GABA, glicina), aminas (acetilcolina, dopamina, noradrenalina, serotonina) e pept\xEDdeos.",func:"Liberado na fenda, atravessa at\xE9 a membrana p\xF3s-sin\xE1ptica e se liga aos receptores, como chave na fechadura.",clue:"Quem decide o efeito \xE9 o receptor, n\xE3o o transmissor: a mesma acetilcolina contrai o m\xFAsculo esquel\xE9tico e desacelera o cora\xE7\xE3o.",more:["Sai da fenda por difus\xE3o, por recapta\xE7\xE3o (transportadores do terminal e da glia) ou por degrada\xE7\xE3o enzim\xE1tica, como a da acetilcolina pela acetilcolinesterase.","O glutamato \xE9 o principal transmissor excitat\xF3rio do enc\xE9falo; o GABA, o principal inibit\xF3rio.","Dentro de uma ves\xEDcula colin\xE9rgica, a acetilcolina pode chegar a 1.000 mM.","Para ser chamada de neurotransmissor, a mol\xE9cula precisa ser sintetizada e guardada no neur\xF4nio pr\xE9-sin\xE1ptico, ser liberada quando ele \xE9 estimulado e, aplicada de fora, imitar o efeito da sinapse."],where:"Na vista Sinapse: os gr\xE3os alaranjados dentro das ves\xEDculas abertas e espalhados na fenda.",rel:["vesiculas","receptores","fenda","astrocito"]},{id:"granulos",g:"syn",name:"Gr\xE2nulos secretores",aka:"Ves\xEDculas grandes e eletronicamente densas",color:"#B98A5A",size:"~100 nm",morf:"Ves\xEDculas maiores, que aparecem escuras ao microsc\xF3pio eletr\xF4nico.",func:"Guardam os neurotransmissores pept\xEDdicos e os liberam por exocitose dependente de Ca\xB2\u207A, fora das zonas ativas.",clue:"Como ficam longe das zonas ativas, um potencial de a\xE7\xE3o isolado n\xE3o basta: \xE9 preciso uma salva em alta frequ\xEAncia, que eleve o Ca\xB2\u207A no terminal inteiro.",more:["J\xE1 saem cheios do aparelho de Golgi, no soma, e descem pelo ax\xF4nio por transporte axoplasm\xE1tico.","A libera\xE7\xE3o \xE9 lenta: 50 ms ou mais."],where:"Na vista Sinapse: as duas esferas maiores e mais escuras, no alto do terminal.",rel:["golgi","vesiculas","neurotransmissor"]},{id:"zona-ativa",g:"syn",name:"Zona ativa",color:"#B54C6C",morf:"Ac\xFAmulo de prote\xEDnas na face do terminal voltada para a fenda, onde as ves\xEDculas se agrupam.",func:"\xC9 o lugar onde o neurotransmissor \xE9 liberado.",more:["Sinapses maiores t\xEAm mais zonas ativas. A jun\xE7\xE3o neuromuscular tem muitas.","Do outro lado da fenda fica a densidade p\xF3s-sin\xE1ptica, com os receptores."],where:"Na vista Sinapse: o disco escuro no fundo do terminal, com ves\xEDculas atracadas.",rel:["canal-ca","vesiculas","receptores"]},{id:"canal-ca",g:"syn",name:"Canal de Ca\xB2\u207A dependente de voltagem",color:"#4FB6A6",morf:"Prote\xEDna da membrana do terminal, nas zonas ativas. \xC9 parente do canal de Na\u207A do potencial de a\xE7\xE3o, mas deixa passar Ca\xB2\u207A.",func:"Abre quando o potencial de a\xE7\xE3o despolariza o terminal. O Ca\xB2\u207A entra, e essa subida \xE9 o sinal para as ves\xEDculas liberarem o transmissor.",clue:"A for\xE7a que empurra o Ca\xB2\u207A para dentro \xE9 enorme: em repouso, h\xE1 s\xF3 0,0002 mM no citosol.",more:["Junto da zona ativa, o Ca\xB2\u207A passa de 0,01 mM quando os canais abrem.","Em uma sinapse de mam\xEDfero, a libera\xE7\xE3o pode come\xE7ar cerca de 60 \xB5s depois da entrada do c\xE1lcio."],where:"Na vista Sinapse: as prote\xEDnas verde-azuladas na borda de baixo do terminal.",rel:["zona-ativa","vesiculas","canal-na"]},{id:"fenda",also:["neurotransmissor"],g:"syn",name:"Fenda sin\xE1ptica",color:"#C9A6E0",sizeLabel:"Largura",size:"20 a 50 nm",morf:"Espa\xE7o entre as membranas pr\xE9 e p\xF3s-sin\xE1ptica, preenchido por uma matriz de prote\xEDnas fibrosas que mant\xE9m as duas unidas.",func:"O neurotransmissor se difunde por ela at\xE9 os receptores.",more:["\xC9 cerca de 10 vezes mais larga que a dist\xE2ncia em uma jun\xE7\xE3o comunicante (3 nm).","Astr\xF3citos em volta limitam a difus\xE3o do transmissor e o retiram da fenda."],where:"Na vista Sinapse: o espa\xE7o entre o terminal e o espinho, com o neurotransmissor.",rel:["neurotransmissor","receptores","extracelular","astrocito"]},{id:"receptores",g:"syn",name:"Receptores",aka:"Na densidade p\xF3s-sin\xE1ptica",color:"#6C8BF0",morf:"Prote\xEDnas da membrana p\xF3s-sin\xE1ptica. S\xE3o de dois tipos: canais i\xF4nicos ativados por transmissor (quatro ou cinco subunidades em volta de um poro) e receptores acoplados a prote\xEDnas G.",func:"Detectam o neurotransmissor. O canal abre em microssegundos e gera um PEPS (se entra Na\u207A) ou um PIPS (se entra Cl\u207B). O receptor acoplado a prote\xEDna G age mais devagar, por mais tempo, e modula.",clue:"O canal aberto por glutamato ou acetilcolina puxa o Vm para perto de 0 mV, acima do limiar: excita. O canal de Cl\u207B aberto por GABA ou glicina segura o Vm perto de \u221265 mV: inibe.",more:["Receptores de glutamato: AMPA (PEPS r\xE1pido) e NMDA (deixa entrar Ca\xB2\u207A e s\xF3 conduz com glutamato e despolariza\xE7\xE3o juntos, porque o Mg\xB2\u207A tapa o poro em repouso).","O receptor acoplado a prote\xEDna G atravessa a membrana sete vezes. A prote\xEDna G abre um canal direto (via de atalho) ou liga uma cascata de segundos mensageiros.","H\xE1 bem mais de 100 receptores, e um mesmo transmissor pode ativar v\xE1rios subtipos."],where:"Na vista Sinapse: os canais azuis em cima do espinho, voltados para a fenda.",rel:["neurotransmissor","espinhos","fenda"]},{id:"canal-na",also:["ion-na"],g:"ap",name:"Canal de Na\u207A dependente de voltagem",color:"#EE8660",morf:"Um \xFAnico polipept\xEDdeo longo com 4 dom\xEDnios (I a IV), cada um com 6 alfa-h\xE9lices que atravessam a membrana (S1 a S6). Os quatro dom\xEDnios se juntam em volta do poro.",func:"Abre quando a membrana despolariza at\xE9 o limiar. O Na\u207A entra e produz a fase ascendente. Fica aberto cerca de 1 ms e se inativa.",clue:"A h\xE9lice S4, com amino\xE1cidos positivos, \xE9 o sensor de voltagem. Na inativa\xE7\xE3o, uma parte globular da prote\xEDna tampa o poro: isso explica a brevidade do potencial de a\xE7\xE3o e o per\xEDodo refrat\xE1rio absoluto.",more:["O filtro de seletividade deixa o canal cerca de 12 vezes mais perme\xE1vel ao Na\u207A que ao K\u207A.","S\xF3 pode abrir de novo depois que o Vm volta para perto do repouso (desinativa\xE7\xE3o).","A tetrodotoxina (TTX), do baiacu, tampa o poro pelo lado de fora. A lidoca\xEDna entra pelo port\xE3o aberto e se liga por dentro.","\xC9 denso no cone de implanta\xE7\xE3o e nos n\xF3dulos de Ranvier."],where:"Na vista Impulso: os canais alaranjados. A bolinha presa embaixo \xE9 a parte que tampa o poro na inativa\xE7\xE3o.",rel:["canal-k","ion-na","cone","nodulo"]},{id:"canal-k",also:["ion-k"],g:"ap",name:"Canal de K\u207A dependente de voltagem",color:"#8177E6",morf:"Quatro subunidades separadas em volta do poro (no canal de Na\u207A, \xE9 um polipept\xEDdeo s\xF3, com quatro dom\xEDnios).",func:"Tamb\xE9m abre com a despolariza\xE7\xE3o, mas cerca de 1 ms depois. O K\u207A sai, e o Vm volta a ficar negativo: \xE9 a fase descendente.",clue:"Por abrir com atraso, essa condut\xE2ncia foi chamada de retificador com retardo. Enquanto o canal continua aberto, o Vm passa do repouso e se aproxima do EK: \xE9 a hiperpolariza\xE7\xE3o p\xF3s-potencial.",more:["Em cada subunidade, uma al\xE7a do poro forma o filtro de seletividade.","Canais de K\u207A lentos, que v\xE3o se acumulando abertos durante o est\xEDmulo, fazem alguns neur\xF4nios dispararem cada vez mais devagar (adapta\xE7\xE3o)."],where:"Na vista Impulso: os canais roxos.",rel:["canal-na","ion-k","canal-vaz"]},{id:"canal-vaz",also:["ion-k"],g:"ap",name:"Canal de K\u207A aberto no repouso",color:"#B5ACF3",morf:"Canal de K\u207A que j\xE1 fica aberto no repouso, sem depender de voltagem.",func:"Deixa o K\u207A sair a favor do gradiente. Cada K\u207A que sai deixa uma carga negativa para tr\xE1s, e o interior fica negativo: \xE9 o potencial de repouso.",clue:"Em repouso, a membrana \xE9 cerca de 40 vezes mais perme\xE1vel ao K\u207A que ao Na\u207A. Um pequeno vazamento de Na\u207A impede o Vm de chegar ao EK (\u221280 mV) e o deixa em cerca de \u221265 mV.",where:"Na vista Impulso: o canal lil\xE1s, por onde o K\u207A sai devagar o tempo todo.",rel:["ion-k","bomba","canal-k"]},{id:"bomba",also:["ion-na","ion-k"],g:"ap",name:"Bomba de s\xF3dio e pot\xE1ssio",color:"#57B98F",morf:"Enzima da membrana.",func:"Quebra ATP e troca Na\u207A de dentro por K\u207A de fora, contra os dois gradientes.",clue:"Trabalha o tempo todo, como a bomba que tira do barco a \xE1gua de cada onda. Sem ela n\xE3o h\xE1 gradiente; sem gradiente, n\xE3o h\xE1 potencial de repouso nem potencial de a\xE7\xE3o.",more:["Consome at\xE9 70% do ATP do enc\xE9falo.","Um potencial de a\xE7\xE3o move t\xE3o poucos \xEDons que as concentra\xE7\xF5es quase n\xE3o mudam."],where:"Na vista Impulso: a prote\xEDna verde, maior que os canais.",rel:["ion-na","ion-k","mitocondria"]},{id:"ion-na",g:"ap",name:"S\xF3dio (Na\u207A)",color:"#F29A4A",sizeLabel:"Concentra\xE7\xE3o",size:"150 mM fora, 15 mM dentro",morf:"C\xE1tion dez vezes mais concentrado fora do neur\xF4nio.",func:"Quando seus canais abrem, entra com for\xE7a: a difus\xE3o e o interior negativo empurram no mesmo sentido. O Vm corre em dire\xE7\xE3o ao ENa (+62 mV).",more:["Na \xE1gua, cada \xEDon fica envolto em uma esfera de hidrata\xE7\xE3o.","Corrente de um \xEDon = condut\xE2ncia \xD7 for\xE7a motriz (Vm \u2212 E\xEDon)."],where:"Na vista Impulso: as esferas alaranjadas, quase todas do lado de fora.",rel:["canal-na","bomba","ion-k","extracelular"]},{id:"ion-k",g:"ap",name:"Pot\xE1ssio (K\u207A)",color:"#8D7CF0",sizeLabel:"Concentra\xE7\xE3o",size:"5 mM fora, 100 mM dentro",morf:"C\xE1tion vinte vezes mais concentrado dentro do neur\xF4nio.",func:"Sai pelos canais de K\u207A e puxa o Vm para o EK (\u221280 mV). Domina o repouso e faz a repolariza\xE7\xE3o.",more:["O Vm \xE9 muito sens\xEDvel ao K\u207A de fora: subir de 5 para 50 mM leva o repouso de \u221265 para cerca de \u221217 mV.","Astr\xF3citos e a barreira hematencef\xE1lica mant\xEAm baixo o K\u207A de fora."],where:"Na vista Impulso: as esferas roxas, quase todas do lado de dentro.",rel:["canal-k","canal-vaz","bomba","citosol","astrocito"]},{id:"astrocito",g:"glia",name:"Astr\xF3cito",color:"#5DC3A8",morf:"A glia mais numerosa. Tem muitos prolongamentos, que preenchem o espa\xE7o entre os neur\xF4nios e envolvem sinapses.",func:"Regula o meio: controla o K\u207A extracelular, limita a difus\xE3o do neurotransmissor e o retira da fenda.",more:["Tamponamento espacial de pot\xE1ssio: capta o K\u207A onde houve muita atividade e o espalha pela rede de prolongamentos (cap. 3).","Tem transportadores que recaptam glutamato e GABA, e faz a maior parte desse trabalho (cap. 5).","Tem receptores para neurotransmissores, que disparam eventos el\xE9tricos e qu\xEDmicos nele pr\xF3prio.",{x:"Na vista Tecido, alguns prolongamentos encostam no capilar. Esse contato n\xE3o \xE9 descrito nos cap\xEDtulos 2 a 6."}],where:"A c\xE9lula em estrela perto dos terminais, com um prolongamento na sinapse. Tamb\xE9m nas vistas Tecido e Glia.",rel:["sinapse","extracelular","ion-k","capilar","oligodendrocito"]},{id:"oligodendrocito",g:"glia",name:"Oligodendr\xF3cito",color:"#DDBB62",morf:"Glia do sistema nervoso central. Uma c\xE9lula estende bra\xE7os e enrola v\xE1rios ax\xF4nios.",func:"Forma a bainha de mielina no sistema nervoso central.",where:"A c\xE9lula ao lado do ax\xF4nio, com bra\xE7os at\xE9 a mielina deste ax\xF4nio e a de um vizinho. Tamb\xE9m nas vistas Tecido e Glia.",rel:["mielina","schwann"]},{id:"schwann",g:"glia",name:"C\xE9lula de Schwann",color:"#E0A083",morf:"Glia do sistema nervoso perif\xE9rico. Cada c\xE9lula enrola um s\xF3 ax\xF4nio.",func:"Forma a bainha de mielina no sistema nervoso perif\xE9rico.",where:"Na vista Glia: cada capa \xE9 uma c\xE9lula, com seu n\xFAcleo, em volta de um s\xF3 ax\xF4nio.",rel:["mielina","oligodendrocito","nodulo"]},{id:"microglia",g:"glia",name:"Micr\xF3glia",color:"#A3C866",morf:"C\xE9lula pequena.",func:"Fagocita restos de c\xE9lulas mortas e parece remodelar sinapses, eliminando algumas.",more:["Pode vir do sangue.",{x:"Os prolongamentos finos e ramificados do desenho s\xE3o a forma usual da micr\xF3glia; o livro n\xE3o a descreve nesses cap\xEDtulos."}],where:"A c\xE9lula pequena e ramificada perto do soma. Tamb\xE9m nas vistas Tecido e Glia.",rel:["astrocito"]},{id:"ependimaria",g:"glia",name:"C\xE9lulas ependim\xE1rias",color:"#9FB3CC",morf:"C\xE9lulas que formam a camada de revestimento dos ventr\xEDculos.",func:"Revestem os ventr\xEDculos e guiam a migra\xE7\xE3o de c\xE9lulas durante o desenvolvimento.",more:["Os ventr\xEDculos s\xE3o cavidades do enc\xE9falo cheias de l\xEDquido (cap. 1)."],where:"Na vista Tecido: a parede de c\xE9lulas \xE0 esquerda. Na vista Glia: a fileira de c\xE9lulas lado a lado.",rel:["liquor","astrocito"]},{id:"capilar",g:"glia",name:"Capilar",aka:"Vaso sangu\xEDneo",color:"#E79A9A",morf:"Vaso fino que atravessa o tecido nervoso.",func:"Leva oxig\xEAnio e nutrientes ao tecido.",clue:"Nas paredes dos capilares do enc\xE9falo fica a barreira hematencef\xE1lica, que limita a passagem de K\u207A do sangue para o tecido.",more:[{x:"As c\xE9lulas vermelhas desenhadas dentro do vaso s\xE3o hem\xE1cias."}],where:"Na vista Tecido: o tubo rosado que cruza a cena, com prolongamentos de astr\xF3citos encostados.",rel:["sangue","astrocito","ion-k"]}],AE=Object.fromEntries(Id.map(i=>[i.id,i])),Im=[["dendritos","recebe o sinal"],["soma","integra o que chegou"],["cone","dispara o potencial de a\xE7\xE3o"],["axonio","conduz para longe"],["nodulo","regenera o sinal a cada salto"],["terminal","troca el\xE9trico por qu\xEDmico"],["sinapse","atravessa a fenda at\xE9 o dendrito seguinte"]],Lm=[{id:"tissue",name:"Tecido"},{id:"world",name:"Neur\xF4nio"},{id:"soma",name:"Soma"},{id:"axon",name:"Ax\xF4nio"},{id:"syn",name:"Sinapse"},{id:"ap",name:"Impulso"},{id:"glia",name:"Glia"}];var ws={groups:{soma:"Cell body",liq:"Fluids",estr:"Membrane and cytoskeleton",in:"Signal input",out:"Signal output",syn:"Synapse",ap:"Action potential",glia:"Glia and tissue"},views:{tissue:"Tissue",world:"Neuron",soma:"Soma",axon:"Axon",syn:"Synapse",ap:"Impulse",glia:"Glia"},path:{dendritos:"receives the signal",soma:"integrates what arrived",cone:"fires the action potential",axonio:"conducts it away",nodulo:"regenerates the signal at each jump",terminal:"swaps electrical for chemical",sinapse:"crosses the cleft to the next dendrite"},steps:{},items:{soma:{name:"Soma",aka:"Cell body, perikaryon",morf:"Central part of the neuron, from which the neurites extend. Inside it has the cytosol, a salty solution rich in K\u207A, and the organelles.",func:"Houses the nucleus and the organelles. It is where genes become proteins: everything the neuron uses comes from here.",clue:"The K\u207A-rich cytosol is the basis of the resting potential (ch. 3).",more:["Everything inside the membrane, except the nucleus, makes up the cytoplasm.","Peptide neurotransmitters are made here: the precursor is assembled in the rough ER and cleaved in the Golgi apparatus (ch. 5).","It also receives synapses (axosomatic). Inhibitory ones tend to cluster on the soma and near the axon hillock."],where:"Cut open at the center of the scene, with the organelles exposed."},nucleo:{name:"Nucleus",morf:"Sphere in the middle of the soma, with a double envelope full of pores.",func:"Holds the DNA. Transcription takes place there: the gene is copied into mRNA, which leaves through the pores to the ribosomes.",clue:"The DNA is the same in every cell of the body. What makes a neuron a neuron is the genes it uses.",more:["From gene to protein: transcription (RNA polymerase copies the gene), processing (the introns are removed, the exons are spliced together) and translation on the ribosomes.","In alternative splicing, a single gene gives rise to different proteins.","The human genome has about 25,000 genes."],where:"Large sphere inside the soma. The dark dots are the pores."},"re-rugoso":{name:"Rough ER",aka:"Nissl bodies",morf:"Stacks of membrane studded with ribosomes, around the nucleus.",func:"Makes the proteins destined for membranes (channels, pumps, receptors). They are inserted into the membrane as they are synthesized.",clue:"It is abundant in the neuron because the neuron depends on many membrane proteins. It is what Nissl saw when he stained the tissue.",more:["Neurons have more rough ER than glia and than most cells.","It assembles the precursor of peptide neurotransmitters (ch. 5).","The axon has no rough ER: that is why it depends on the soma."],where:"Curved sheets next to the nucleus, dotted with ribosomes."},ribossomos:{name:"Free ribosomes",aka:"In a group: polyribosome",morf:"Loose grains in the cytosol. Several ribosomes reading the same mRNA form a polyribosome.",func:"They make the proteins that stay in the cytosol.",clue:"They also appear in the dendrites, beneath the spines.",more:["In a polyribosome, each ribosome produces a copy of the same protein.","At the base of the spines, synaptic activity can order protein to be made right there, something important for storing information (ch. 25)."],where:"Loose golden grains in the soma. The ones lined up in an arc are polyribosomes."},"re-liso":{name:"Smooth ER",morf:"Membrane without ribosomes.",func:"Helps fold proteins and regulates internal concentrations, such as that of Ca\xB2\u207A.",more:["In muscle, it is called the sarcoplasmic reticulum.","It has Ca\xB2\u207A channels that the second messenger IP3 opens, releasing calcium into the cytosol (ch. 6)."],where:"Network of smooth tubes, near the edge of the soma."},golgi:{name:"Golgi apparatus",morf:"Stack of membrane disks.",func:"Processes proteins after translation and sorts them for delivery to each part of the neuron, such as the axon or the dendrites.",clue:"It is the shipping department of the factory.",more:["It cleaves the precursor of peptide neurotransmitters. The secretory granule leaves it already full and travels down the axon (ch. 5)."],where:"Stack of disks, on the side of the soma opposite the nucleus."},mitocondria:{name:"Mitochondrion",morf:"Elongated organelle, with a folded inner membrane.",func:"Cellular respiration: it produces ATP.",clue:"ATP pays for the ion pumps and for transport in the axon. The axon terminal has many mitochondria: a sign of high energy use.",more:["Pyruvic acid and oxygen go in. The Krebs cycle and the electron-transport chain turn ADP into ATP.","The sodium-potassium pump consumes up to 70% of the ATP of the brain (ch. 3).","The outer membrane holds MAO, an enzyme that destroys catecholamines and serotonin after reuptake (ch. 6)."],where:"Capsules in the soma (one is cut open, showing the folds) and inside the terminal, in the Synapse view."},citosol:{name:"Cytosol",rows:[["K\u207A","100 mM"],["Na\u207A","15 mM"],["Ca\xB2\u207A","0.0002 mM"],["Cl\u207B","13 mM"]],morf:"Salty solution that fills the inside of the neuron, from the soma to the neurites. It is rich in K\u207A and poor in Na\u207A.",func:"It is where the organelles sit and where electrical current flows inside the neuron, carried by ions.",clueTitle:"Why it matters",clue:"It is the inside of the battery. The pumps keep K\u207A high here and Na\u207A high outside; that difference is what the channels use to generate the resting potential and the action potential.",more:["Everything inside the membrane, except the nucleus, makes up the cytoplasm: cytosol plus organelles.","It conducts far worse than a copper wire: the charge is carried by ions, not by free electrons.","It is electrically neutral. The negative charge at rest sits right against the inner face of the membrane.","Ca\xB2\u207A is kept extremely low by the calcium pump, by proteins that bind it and by organelles that sequester it.","In the terminal, the small transmitters are made in the cytosol and then concentrated in the vesicles.","Second messengers, such as cAMP, diffuse through it (ch. 6)."],where:"In the cut-open soma, it is all the space between the organelles. With Fluids on, it appears as the lilac volume inside the soma, the terminal and the axon."},extracelular:{name:"Extracellular fluid",rows:[["K\u207A","5 mM"],["Na\u207A","150 mM"],["Ca\xB2\u207A","2 mM"],["Cl\u207B","150 mM"]],morf:"Salty solution that bathes neurons and glia on the outside. It is rich in Na\u207A and Cl\u207B and poor in K\u207A.",func:"It is the outside of the battery. It is also what the neurotransmitter diffuses through in the synaptic cleft.",clueTitle:"Why it matters",clue:"The resting potential is very sensitive to the K\u207A here: raising it from 5 to 50 mM takes Vm from \u221265 to about \u221217 mV. That is why the astrocytes and the blood-brain barrier keep this K\u207A low.",more:["The space is minimal: astrocytes fill the space between neurons, leaving gaps of about 20 nm. The scene spreads the cells apart so they can be seen.","Because it also conducts electricity, the current traveling down the axon leaks into it: it is the leaky hose of chapter 3.","The synaptic cleft is part of it, at 20 to 50 nm.","Astrocytes take up K\u207A where there has been a lot of activity and spread it through their network of processes (spatial buffering)."],where:"All the space outside the cells. With Fluids on, the background turns bluish and the loose dots represent ions: orange for Na\u207A, purple for K\u207A."},liquor:{name:"Ventricular fluid",morf:"Fluid that fills the ventricles, the cavities of the brain.",func:"It fills the ventricles and is in contact with the ependymal cells that line them.",clueTitle:"In history",clue:"Galen found the ventricles full of fluid and concluded, wrongly, that sensation and movement were fluids moving to and fro through the nerves. The idea only fell when nerves were shown to conduct electricity.",more:[{x:"In anatomy it is called cerebrospinal fluid, or CSF. Its name and its function do not appear in chapters 1 to 6."}],where:"In the Tissue view, with Fluids on: the blue volume to the left of the wall of ependymal cells."},sangue:{name:"Blood",morf:"Fluid that flows inside the capillaries.",func:"Brings oxygen and nutrients to the nervous tissue.",clueTitle:"Why it matters",clue:"It does not mix freely with the extracellular fluid: the blood-brain barrier, in the capillary walls, limits the passage of K\u207A.",more:["Tryptophan, the raw material for serotonin, reaches the brain through the blood (ch. 6).","Microglia may come from the blood.","The heart has no such barrier: that is why potassium chloride in a vein is lethal.",{x:"The liquid part of the blood is called plasma. The red cells drawn here are red blood cells (erythrocytes)."}],where:"In the Tissue view, with Fluids on: the yellowish fluid inside the capillary."},membrana:{name:"Neuronal membrane",morf:"Phospholipid bilayer studded with proteins: some pump substances, others form pores. Its composition differs between soma, dendrites and axon.",func:"Barrier to ions. Its proteins create the electrical signals of the neuron.",clue:"The difference between axon and dendrite is, at the molecular level, a difference in membrane proteins.",more:["Each phospholipid has a polar head, which likes water, and a tail that avoids it. In two layers, the tails hide in the middle.","Ion channels: 4 to 6 subunits around a pore, with selectivity and, in many, a gate.","Ion pumps: enzymes that use ATP to move ions against the gradient.","The separated charge sits right against the two faces of the membrane (capacitance). The rest of the solutions is neutral.","Adding up all the neurons gives about 21,000 m\xB2 of membrane."],where:"In the Axon view: the two-layer wall, opened as a window. In the Impulse view: the bilayer with the channels."},microtubulo:{name:"Microtubule",morf:"Hollow tube of tubulin, running along the neurites.",func:"Track for axoplasmic transport: vesicles walk along it, spending ATP. Kinesin carries from the soma to the terminal; dynein brings back.",clue:"The axon terminal has no microtubules.",more:["Associated proteins (MAPs), such as tau, organize the microtubules. In Alzheimer's disease, tau detaches and accumulates in neurofibrillary tangles.","Fast transport: up to 1,000 mm per day. Slow transport: 1 to 10 mm per day.","The herpes and rabies viruses enter the nervous system by retrograde transport."],where:"In the Axon view: the thickest hollow tubes."},neurofilamento:{name:"Neurofilament",morf:"Subunits braided like a rope.",func:"Mechanical strength. It is the strongest of the three and plays the role of bone.",more:["It is an intermediate filament, a relative of the keratin of hair."],where:"In the Axon view: the braided ropes, of medium thickness."},microfilamento:{name:"Microfilament",morf:"Two braided strands of actin, anchored to the membrane.",func:"Changes the shape of the cell.",more:["The cytoskeleton is assembled and disassembled all the time.","In muscle, actin takes part in contraction (ch. 13)."],where:"In the Axon view: the thinnest threads, attached to the inside of the membrane."},neuritos:{name:"Neurites",morf:"Thin processes that extend from the soma. There are two types: axon and dendrites.",func:"General name. The dendrites are the signal input; the axon is the output.",more:["By its number of neurites, a neuron is unipolar, bipolar or multipolar. Most in the brain are multipolar."],where:"Everything that extends from the soma. When you choose this item, dendrites and axon are highlighted together."},dendritos:{name:"Dendrites",aka:"Dendritic tree",size:"Rarely longer than 2 mm",morf:"Several per neuron, short, branched, and tapering toward the tip.",func:"Antennae: they receive thousands of synapses. The membrane beneath them has receptors that detect the neurotransmitters.",clue:"An elaborate tree indicates a cell specialized in receiving many signals.",more:["Here the signal is not regenerated: each EPSP is small and decays with distance. At one length constant (\u03BB) from the synapse, 37% remains.","The neuron adds up the EPSPs in space (several synapses at the same time) and in time (the same synapse in rapid succession).","Most dendrites have voltage-gated Na\u207A, Ca\xB2\u207A and K\u207A channels, which amplify small, distant EPSPs."],where:"The branches that extend from the soma in several directions."},espinhos:{name:"Dendritic spines",morf:"Small sacs hanging from the dendrite.",func:"They receive synapses and isolate the chemical reactions triggered by each one. They change shape with activity.",more:["A synapse made on a spine is called axospinous.","At the base there are polyribosomes: the synapse can order protein to be made on site.","In children with intellectual disability, the spines are fewer, long and thin, resembling those of fetuses."],where:"The little balls along the dendrites. In the Synapse view, the sac just below the cleft."},cone:{name:"Axon hillock",aka:"Spike-initiation zone",morf:"Region of the soma that tapers into the initial segment of the axon.",func:"Spike-initiation zone: voltage-gated sodium channels are dense here, and this is where the action potential is born.",clue:"This holds for the typical neuron of the brain and spinal cord. In a sensory neuron, the spike-initiation zone is near the sensory nerve ending.",more:["The neuron fires when the sum of the EPSPs, minus the inhibition, reaches threshold here.","The soma and dendrites generally do not fire Na\u207A action potentials, because they have few of these channels."],where:"The funnel between the soma and the axon. The red dots mark Na\u207A channels."},axonio:{name:"Axon",size:"<1 mm to >1 m in length; <1 to ~25 \xB5m in diameter",morf:"One per neuron, with a uniform diameter and branches at right angles. It has no rough ER and almost no ribosomes.",func:"Conducts the action potential away from the soma. The thicker it is, the faster.",clue:"Without ribosomes, it makes no proteins: everything comes from the soma. Cut off from it, it degenerates (Wallerian degeneration).",more:["The action potential is regenerated at each stretch and does not shrink along the way. It does not turn back because the stretch behind it is refractory.","At about 10 m/s and lasting 2 ms, an action potential occupies some 2 cm of axon at a time.","Enzymes and peptide granules travel down from the soma by axoplasmic transport.","In the squid, the giant axon reaches 1 mm in diameter. It is the one Hodgkin and Huxley worked on."],where:"The long wire that leaves the hillock. It is bare at the start, at the nodes and at the end."},colaterais:{name:"Axon collaterals",morf:"Branches of the axon, which leave at right angles. Those that return to the cell itself or to neighboring cells are recurrent collaterals.",func:"They carry the same signal to other targets.",where:"The branch that leaves the axon at a node."},mielina:{name:"Myelin sheath",morf:"Glial membrane wrapped in a spiral around the axon, interrupted at intervals.",func:"Insulates the axon: less current leaks across the membrane, and conduction speeds up.",clue:"It is not part of the neuron. It is membrane from an oligodendrocyte (in the central nervous system) or from a Schwann cell (in the peripheral one).",more:["In multiple sclerosis, the myelin of the central nervous system is attacked, and conduction becomes slow or fails.","In Guillain-Barr\xE9 syndrome, the attack is on the myelin of the peripheral nerves."],where:"The pale sleeves around the axon. In the Axon view, the cut shows the spiral."},nodulo:{name:"Node of Ranvier",size:"0.2 to 2 mm",morf:"Gap without myelin, where the axon membrane is exposed and the Na\u207A channels are concentrated.",func:"Regenerates the action potential, which jumps from node to node (saltatory conduction).",more:["The thicker the axon, the farther apart the nodes."],where:"The gaps between two myelin sleeves. The red dots mark Na\u207A channels."},terminal:{name:"Axon terminal",aka:"Terminal bouton",morf:"Swollen tip of the axon. It has no microtubules, is full of synaptic vesicles, has a dense coating of proteins on the face turned toward the synapse and has many mitochondria.",func:"Converts the electrical signal into a chemical one: it releases neurotransmitter into the cleft.",more:["The axon may end in several short branches (terminal arbor) or make synapses in passing (boutons en passant).","The small transmitters (amino acids and amines) are made right here, in the cytosol, by enzymes that came from the soma.","Membrane transporters take the transmitter back up from the cleft, using the Na\u207A gradient.","Autoreceptors sense the released transmitter and put a brake on release, like a safety valve."],where:"The boutons at the end of the axon. Seen from the inside in the Synapse view."},sinapse:{name:"Synapse",size:"20 to 50 nm",morf:"It has a presynaptic side (usually the terminal), the synaptic cleft and a postsynaptic side (the dendrite or soma of another neuron), with receptors.",func:"Point of contact where the signal passes from one cell to another: it arrives electrical, becomes chemical and turns electrical again on the other side.",clue:"A Gray's type I synapse (asymmetrical, thicker postsynaptic side) is usually excitatory. Type II (symmetrical) is usually inhibitory.",more:["In six steps: the action potential arrives; Ca\xB2\u207A channels open; the vesicle fuses and releases the transmitter; it crosses the cleft; the receptor responds; the transmitter is removed.","By the site of contact: axodendritic, axosomatic, axoaxonic or axospinous.","Most synapses in the mature nervous system are chemical. There are also electrical synapses (gap junctions, at 3 nm), bidirectional and nearly instantaneous.","A typical synapse in the central nervous system generates an EPSP of a few tenths of a mV. On its own, it does not make the neuron fire."],where:"Where a terminal bouton touches the dendrite of the next neuron. In detail in the Synapse view."},vesiculas:{name:"Synaptic vesicles",morf:"Membrane spheres inside the terminal. The neurotransmitter is stored in their interior, the lumen.",func:"They store the neurotransmitter and release it into the cleft by exocytosis: the vesicle membrane fuses with that of the terminal.",clue:"Release is fast because the vesicles are already docked at the active zone, right where Ca\xB2\u207A enters.",more:["Transporters in the vesicle membrane concentrate the transmitter inside up to 100,000-fold, exchanging each molecule for one H\u207A.","The lumen is acidic: an ATP-driven H\u207A pump keeps it that way, and this H\u207A gradient is what the transporter uses.","Each vesicle carries a few thousand transmitter molecules.","SNARE proteins tie the vesicle to the terminal membrane. Synaptotagmin senses Ca\xB2\u207A and triggers fusion.","After exocytosis, the membrane is recovered by endocytosis, and the vesicle is refilled.","They store amino acids and amines. Peptides are kept in the secretory granules."],where:"In the Synapse view: the spheres inside the terminal. Two are cut open, showing the neurotransmitter in the lumen."},neurotransmissor:{name:"Neurotransmitter",morf:"Molecule stored in the lumen of the synaptic vesicles. There are three families: amino acids (glutamate, GABA, glycine), amines (acetylcholine, dopamine, norepinephrine, serotonin) and peptides.",func:"Released into the cleft, it crosses to the postsynaptic membrane and binds to the receptors, like a key in a lock.",clue:"The receptor, not the transmitter, decides the effect: the same acetylcholine contracts skeletal muscle and slows the heart.",more:["It leaves the cleft by diffusion, by reuptake (transporters in the terminal and in glia) or by enzymatic degradation, as with acetylcholine by acetylcholinesterase.","Glutamate is the main excitatory transmitter in the brain; GABA, the main inhibitory one.","Inside a cholinergic vesicle, acetylcholine can reach 1,000 mM.","To be called a neurotransmitter, a molecule must be synthesized and stored in the presynaptic neuron, be released when that neuron is stimulated and, when applied from outside, mimic the effect of the synapse."],where:"In the Synapse view: the orange grains inside the cut-open vesicles and scattered in the cleft."},granulos:{name:"Secretory granules",aka:"Large, dense-core vesicles",morf:"Larger vesicles, which appear dark under the electron microscope.",func:"They store the peptide neurotransmitters and release them by Ca\xB2\u207A-dependent exocytosis, outside the active zones.",clue:"Because they sit far from the active zones, a single action potential is not enough: it takes a high-frequency train, which raises Ca\xB2\u207A throughout the terminal.",more:["They leave the Golgi apparatus, in the soma, already full and travel down the axon by axoplasmic transport.","Release is slow: 50 ms or more."],where:"In the Synapse view: the two larger, darker spheres, at the top of the terminal."},"zona-ativa":{name:"Active zone",morf:"Accumulation of proteins on the face of the terminal turned toward the cleft, where the vesicles cluster.",func:"It is the site where the neurotransmitter is released.",more:["Larger synapses have more active zones. The neuromuscular junction has many.","On the other side of the cleft lies the postsynaptic density, with the receptors."],where:"In the Synapse view: the dark disk at the bottom of the terminal, with docked vesicles."},"canal-ca":{name:"Voltage-gated calcium channel",morf:"Protein of the terminal membrane, at the active zones. It is a relative of the Na\u207A channel of the action potential, but lets Ca\xB2\u207A through.",func:"Opens when the action potential depolarizes the terminal. Ca\xB2\u207A enters, and that rise is the signal for the vesicles to release the transmitter.",clue:"The force pushing Ca\xB2\u207A inward is enormous: at rest, there is only 0.0002 mM in the cytosol.",more:["Next to the active zone, Ca\xB2\u207A exceeds 0.01 mM when the channels open.","At a mammalian synapse, release can begin about 60 \xB5s after calcium enters."],where:"In the Synapse view: the blue-green proteins on the lower edge of the terminal."},fenda:{name:"Synaptic cleft",size:"20 to 50 nm",morf:"Space between the presynaptic and postsynaptic membranes, filled with a matrix of fibrous proteins that holds the two together.",func:"The neurotransmitter diffuses across it to the receptors.",more:["It is about 10 times wider than the gap at a gap junction (3 nm).","Surrounding astrocytes limit the diffusion of the transmitter and remove it from the cleft."],where:"In the Synapse view: the space between the terminal and the spine, with the neurotransmitter."},receptores:{name:"Receptors",aka:"In the postsynaptic density",morf:"Proteins of the postsynaptic membrane. There are two types: transmitter-gated ion channels (four or five subunits around a pore) and G-protein-coupled receptors.",func:"They detect the neurotransmitter. The channel opens in microseconds and generates an EPSP (if Na\u207A enters) or an IPSP (if Cl\u207B enters). The G-protein-coupled receptor acts more slowly, for longer, and modulates.",clue:"A channel opened by glutamate or acetylcholine pulls Vm close to 0 mV, above threshold: it excites. A Cl\u207B channel opened by GABA or glycine holds Vm near \u221265 mV: it inhibits.",more:["Glutamate receptors: AMPA (fast EPSP) and NMDA (lets Ca\xB2\u207A in and only conducts with glutamate and depolarization together, because Mg\xB2\u207A plugs the pore at rest).","The G-protein-coupled receptor crosses the membrane seven times. The G-protein opens a channel directly (shortcut pathway) or switches on a second messenger cascade.","There are well over 100 receptors, and a single transmitter can activate several subtypes."],where:"In the Synapse view: the blue channels on top of the spine, facing the cleft."},"canal-na":{name:"Voltage-gated sodium channel",morf:"A single long polypeptide with 4 domains (I to IV), each with 6 alpha helices that cross the membrane (S1 to S6). The four domains come together around the pore.",func:"Opens when the membrane depolarizes to threshold. Na\u207A enters and produces the rising phase. It stays open about 1 ms and inactivates.",clue:"The S4 helix, with positive amino acids, is the voltage sensor. In inactivation, a globular part of the protein plugs the pore: this explains the brevity of the action potential and the absolute refractory period.",more:["The selectivity filter makes the channel about 12 times more permeable to Na\u207A than to K\u207A.","It can only open again after Vm returns close to rest (deinactivation).","Tetrodotoxin (TTX), from the puffer fish, plugs the pore from the outside. Lidocaine enters through the open gate and binds on the inside.","It is dense at the axon hillock and at the nodes of Ranvier."],where:"In the Impulse view: the orange channels. The little ball attached underneath is the part that plugs the pore in inactivation."},"canal-k":{name:"Voltage-gated potassium channel",morf:"Four separate subunits around the pore (in the Na\u207A channel, it is a single polypeptide, with four domains).",func:"It also opens with depolarization, but about 1 ms later. K\u207A leaves, and Vm becomes negative again: this is the falling phase.",clue:"Because it opens with a delay, this conductance was called the delayed rectifier. While the channel stays open, Vm goes past rest and approaches EK: this is the undershoot (after-hyperpolarization).",more:["In each subunit, a pore loop forms the selectivity filter.","Slow K\u207A channels, which build up in the open state during the stimulus, make some neurons fire more and more slowly (adaptation)."],where:"In the Impulse view: the purple channels."},"canal-vaz":{name:"Potassium channel open at rest",morf:"K\u207A channel that is already open at rest, without depending on voltage.",func:"Lets K\u207A leave down its gradient. Each K\u207A that leaves leaves a negative charge behind, and the interior becomes negative: this is the resting potential.",clue:"At rest, the membrane is about 40 times more permeable to K\u207A than to Na\u207A. A small Na\u207A leak keeps Vm from reaching EK (\u221280 mV) and leaves it at about \u221265 mV.",where:"In the Impulse view: the lilac channel, through which K\u207A slowly leaves all the time."},bomba:{name:"Sodium-potassium pump",morf:"Membrane enzyme.",func:"Breaks down ATP and exchanges Na\u207A from inside for K\u207A from outside, against both gradients.",clue:"It works all the time, like the pump that bails out of the boat the water from each wave. Without it there is no gradient; without a gradient, there is no resting potential and no action potential.",more:["It consumes up to 70% of the ATP of the brain.","An action potential moves so few ions that the concentrations barely change."],where:"In the Impulse view: the green protein, larger than the channels."},"ion-na":{name:"Sodium (Na\u207A)",size:"150 mM outside, 15 mM inside",morf:"Cation ten times more concentrated outside the neuron.",func:"When its channels open, it rushes in: diffusion and the negative interior push in the same direction. Vm races toward ENa (+62 mV).",more:["In water, each ion is surrounded by a sphere of hydration.","Current of an ion = conductance \xD7 driving force (Vm \u2212 Eion)."],where:"In the Impulse view: the orange spheres, almost all on the outside."},"ion-k":{name:"Potassium (K\u207A)",size:"5 mM outside, 100 mM inside",morf:"Cation twenty times more concentrated inside the neuron.",func:"It leaves through the K\u207A channels and pulls Vm toward EK (\u221280 mV). It dominates the resting state and carries out repolarization.",more:["Vm is very sensitive to the K\u207A outside: raising it from 5 to 50 mM takes the resting potential from \u221265 to about \u221217 mV.","Astrocytes and the blood-brain barrier keep the K\u207A outside low."],where:"In the Impulse view: the purple spheres, almost all on the inside."},astrocito:{name:"Astrocyte",morf:"The most numerous glia. It has many processes, which fill the space between the neurons and envelop synapses.",func:"Regulates the environment: it controls extracellular K\u207A, limits the diffusion of the neurotransmitter and removes it from the cleft.",more:["Potassium spatial buffering: it takes up K\u207A where there has been a lot of activity and spreads it through its network of processes (ch. 3).","It has transporters that take up glutamate and GABA, and it does most of this work (ch. 5).","It has receptors for neurotransmitters, which trigger electrical and chemical events in the astrocyte itself.",{x:"In the Tissue view, some processes touch the capillary. This contact is not described in chapters 2 to 6."}],where:"The star-shaped cell near the terminals, with a process at the synapse. Also in the Tissue and Glia views."},oligodendrocito:{name:"Oligodendrocyte",morf:"Glia of the central nervous system. One cell extends arms and wraps several axons.",func:"Forms the myelin sheath in the central nervous system.",where:"The cell next to the axon, with arms reaching the myelin of this axon and that of a neighbor. Also in the Tissue and Glia views."},schwann:{name:"Schwann cell",morf:"Glia of the peripheral nervous system. Each cell wraps a single axon.",func:"Forms the myelin sheath in the peripheral nervous system.",where:"In the Glia view: each sleeve is one cell, with its nucleus, around a single axon."},microglia:{name:"Microglia",morf:"Small cell.",func:"Phagocytoses the debris of dead cells and appears to remodel synapses, eliminating some.",more:["It may come from the blood.",{x:"The thin, branched processes in the drawing are the usual shape of microglia; the book does not describe it in these chapters."}],where:"The small, branched cell near the soma. Also in the Tissue and Glia views."},ependimaria:{name:"Ependymal cells",morf:"Cells that form the layer lining the ventricles.",func:"They line the ventricles and guide cell migration during development.",more:["The ventricles are fluid-filled cavities of the brain (ch. 1)."],where:"In the Tissue view: the wall of cells on the left. In the Glia view: the row of cells side by side."},capilar:{name:"Capillary",aka:"Blood vessel",morf:"Thin vessel that runs through the nervous tissue.",func:"Carries oxygen and nutrients to the tissue.",clue:"The walls of the brain capillaries hold the blood-brain barrier, which limits the passage of K\u207A from the blood into the tissue.",more:[{x:"The red cells drawn inside the vessel are red blood cells (erythrocytes)."}],where:"In the Tissue view: the pinkish tube that crosses the scene, with astrocyte processes touching it."}}};var Nm="neurohub.lang",Ld=["pt","en"],zS=()=>{try{return localStorage.getItem(Nm)}catch{return null}},Dm=i=>{try{localStorage.setItem(Nm,i)}catch{}};function kS(){let i=null;try{i=new URLSearchParams(location.search).get("lang")}catch{}if(Ld.includes(i))return Dm(i),i;let e=zS();return Ld.includes(e)?e:(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"pt"]).map(n=>String(n).toLowerCase()).some(n=>n.startsWith("pt"))?"pt":"en"}var ph=kS(),lo=ph==="en",J=(i,e)=>lo&&e!=null?e:i;function VS(i){if(!Ld.includes(i)||i===ph)return;Dm(i);let e=new URL(location.href);e.searchParams.set("lang",i),location.replace(e.href)}function Um(i=document){if(document.documentElement.lang=lo?"en":"pt-BR",lo){let e=document.documentElement.dataset.titleEn;e&&(document.title=e);for(let t of i.querySelectorAll("[data-en]"))t.textContent=t.dataset.en;for(let[t,n]of[["placeholder","enPlaceholder"],["aria-label","enAriaLabel"],["title","enTitle"]])for(let s of i.querySelectorAll(`[data-en-${t}]`))s.setAttribute(t,s.dataset[n])}for(let e of i.querySelectorAll("[data-lang]"))e.setAttribute("aria-pressed",String(e.dataset.lang===ph)),e.addEventListener("click",()=>VS(e.dataset.lang));for(let e of i.querySelectorAll("a[data-hub]"))try{let t=new URL(e.getAttribute("href"),location.href);t.searchParams.set("lang",ph),e.href=t.href}catch{}}var Nd=(i,e)=>lo&&e?{...i,...e}:i,Dd=Pm.map(i=>Nd(i,ws.groups[i.id]&&{name:ws.groups[i.id]})),mh=Id.map(i=>Nd(i,ws.items[i.id])),In=Object.fromEntries(mh.map(i=>[i.id,i])),Fm=Im.map(([i,e])=>[i,lo&&ws.path[i]?ws.path[i]:e]),Bm=Lm.map(i=>Nd(i,ws.views[i.id]&&{name:ws.views[i.id]}));function zm(i,e=!1){let t=i[0].index!==null,n=new Set(Object.keys(i[0].attrib
