<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Neurônio em 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007AFF'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='7' width='8' height='8' rx='2'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' opacity='.6'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' opacity='.6'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' opacity='.35'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* Layout: a cena 3D ocupa a tela inteira; lista, ficha e controles flutuam sobre ela em painéis translúcidos.
   No celular, lista e ficha viram uma folha inferior. Tipografia: SF Pro pela fonte do sistema. */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, "Segoe UI", Roboto, Arial, sans-serif;
  --bg0: #F8F8FA; --bg1: #E4E4EA; --fog: #EEEEF2; --clay: #DCDCE2;
  --label: #1D1D1F; --label2: #6E6E73; --label3: #A1A1A6;
  --sep: rgba(60, 60, 67, .14); --fill: rgba(118, 118, 128, .12); --fill2: rgba(118, 118, 128, .2);
  --glass: rgba(255, 255, 255, .74); --glass-edge: rgba(0, 0, 0, .07); --thumb: #FFFFFF;
  --accent: #007AFF; --accent-soft: rgba(0, 122, 255, .12); --on-accent: #FFFFFF;
  --shadow: 0 10px 34px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .06);
  --na: #D9722E; --k: #6B5BE0;
  --pad: 16px; --side: 268px; --insp: 340px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg0: #232327; --bg1: #0A0A0C; --fog: #19191C; --clay: #3C3C42;
    --label: #F5F5F7; --label2: #A1A1A6; --label3: #6E6E73;
    --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
    --glass: rgba(34, 34, 37, .74); --glass-edge: rgba(255, 255, 255, .09); --thumb: #636366;
    --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .24); --on-accent: #FFFFFF;
    --shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .3);
    --na: #FFA05C; --k: #A99CFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg0: #232327; --bg1: #0A0A0C; --fog: #19191C; --clay: #3C3C42;
  --label: #F5F5F7; --label2: #A1A1A6; --label3: #6E6E73;
  --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
  --glass: rgba(34, 34, 37, .74); --glass-edge: rgba(255, 255, 255, .09); --thumb: #636366;
  --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .24); --on-accent: #FFFFFF;
  --shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .3);
  --na: #FFA05C; --k: #A99CFF;
  color-scheme: dark;
}

/* com os líquidos ligados, o fundo e a névoa ganham o tom do líquido extracelular */
#app[data-liquids="on"] { --bg0: #F1FAFB; --bg1: #C9E1E6; --fog: #DAECEF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #app[data-liquids="on"] { --bg0: #1D353A; --bg1: #051316; --fog: #0F272C; } }
:root[data-theme="dark"] #app[data-liquids="on"] { --bg0: #1D353A; --bg1: #051316; --fog: #0F272C; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--label);
  background: var(--bg1);
  font: 400 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
svg.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; overflow: hidden; background: radial-gradient(120% 95% at 50% 38%, var(--bg0), var(--bg1)); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#gl.pt { cursor: pointer; }
#leaders, #labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#gl, #leaders, #labels { transition: opacity .17s ease; }
#app.fade #gl, #app.fade #leaders, #app.fade #labels { opacity: 0; }

/* painéis */
.glass {
  background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
}
#panes { display: contents; }
#grab { display: none; }
#sidebar, #inspector { position: absolute; border-radius: 18px; }
#sidebar { top: var(--pad); left: var(--pad); bottom: var(--pad); width: var(--side); display: flex; flex-direction: column; min-height: 0; }
#inspector { top: var(--pad); right: var(--pad); width: var(--insp); max-height: calc(100% - 2 * var(--pad)); overflow-y: auto; overscroll-behavior: contain; }

/* lista */
.search { position: relative; margin: 12px 12px 6px; flex: none; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--label2); pointer-events: none; }
.search input {
  width: 100%; height: 34px; padding: 0 10px 0 31px; border: 0; border-radius: 10px; background: var(--fill);
  font-size: 15px; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--label2); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
#list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 8px 12px; }
#list h2 { margin: 14px 10px 4px; font-size: 12px; line-height: 1.3; font-weight: 600; color: var(--label2); }
#list ul { list-style: none; margin: 0; padding: 0; }
#list button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 5px 10px; border-radius: 8px; font-size: 14px; line-height: 1.25; }
#list button:hover { background: var(--fill); }
#list button[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
#list .none { margin: 18px 10px; color: var(--label2); font-size: 14px; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .18); }
[aria-current="true"] > .dot { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .85); }

/* ficha */
.ins { padding: 20px 20px 22px; }
.ins-top { display: flex; align-items: flex-start; gap: 12px; }
.ins-top > div { flex: 1 1 auto; min-width: 0; }
.ins h1 { margin: 0; font-size: 26px; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; text-wrap: balance; }
.ins .aka { margin: 4px 0 0; font-size: 15px; color: var(--label2); }
.close { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--label2); display: grid; place-items: center; font-size: 15px; }
.close:hover { background: var(--fill2); }
.close svg { stroke-width: 2.2; }
.back { display: none; }
.rows { margin: 16px 0 0; padding: 0; list-style: none; background: var(--fill); border-radius: 12px; }
.rows > * { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 9px 14px; font-size: 14px; }
.rows > * + * { box-shadow: inset 0 .5px 0 var(--sep); }
.rows dt { color: var(--label); flex: none; }
.rows dd { margin: 0; color: var(--label2); text-align: right; font-variant-numeric: tabular-nums; }
.ins h2 { margin: 20px 0 3px; font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--label2); }
.ins p { margin: 0; font-size: 15px; line-height: 1.45; max-width: 60ch; }
.ins .lead { margin-top: 10px; color: var(--label2); }
.ins ul.more { margin: 2px 0 0; padding: 0 0 0 1.15em; font-size: 14.5px; line-height: 1.42; }
.ins ul.more li { margin: 5px 0 0; padding-left: 2px; }
.ins ul.more li::marker { color: var(--label3); }
.tag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 5px; background: var(--fill2); color: var(--label2); font-size: 11px; font-weight: 600; line-height: 16px; vertical-align: 1px; }
.actions { margin-top: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 500; }
.btn:hover { filter: brightness(1.07); }
.btn svg { font-size: 15px; }
.rows.links > li { display: block; padding: 0; }
.rows.links button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px 9px 14px; font-size: 15px; border-radius: inherit; }
.rows.links li:first-child button { border-radius: 12px 12px 0 0; }
.rows.links li:last-child button { border-radius: 0 0 12px 12px; }
.rows.links li:only-child button { border-radius: 12px; }
.rows.links button:hover { background: var(--fill); }
.rows.links .name { flex: 1 1 auto; min-width: 0; }
.rows.links .sub { display: block; font-size: 13px; color: var(--label2); }
.rows.links .chev { color: var(--label3); font-size: 13px; }
.rows.links .num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--fill2); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--label2); }
.ins .foot { margin-top: 16px; font-size: 12.5px; line-height: 1.45; color: var(--label2); }

/* barra de vistas */
#toolbar {
  position: absolute; bottom: var(--pad); left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2);
  transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 15px; max-width: calc(100% - var(--side) - var(--insp) - 5 * var(--pad));
}
.seg { display: flex; padding: 2px; border-radius: 9px; background: var(--fill); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { height: 30px; padding: 0 13px; border-radius: 7px; font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--label); }
.seg button[aria-pressed="true"] { background: var(--thumb); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .06); }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; background: var(--fill); font-size: 13px; font-weight: 500; white-space: nowrap; flex: none; }
.tb:hover { background: var(--fill2); }
.tb svg { font-size: 15px; }
.tb svg.chev { font-size: 12px; color: var(--label2); margin-left: -2px; }
.tb.icon { width: 34px; padding: 0; justify-content: center; }
.tb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tb[disabled] { opacity: .45; cursor: default; }
svg.ic.fill { fill: currentColor; stroke: none; }

/* rótulos da cena */
.lab {
  position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap;
  font-size: 12.5px; line-height: 1.2; font-weight: 500; letter-spacing: -.003em; color: var(--label); padding: 2px 6px; border-radius: 7px;
  text-shadow: 0 0 2px var(--fog), 0 0 4px var(--fog), 0 0 8px var(--fog), 0 0 8px var(--fog);
}
.lab:hover { color: var(--accent); }
.lab.sel { background: var(--accent); color: var(--on-accent); text-shadow: none; font-weight: 600; }
.lab.note { pointer-events: none; font-weight: 400; font-size: 12px; color: var(--label2); padding: 0; }
.lab.hot {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 13px; text-shadow: none;
  color: var(--accent); font-weight: 600; background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: 0 3px 12px rgba(0, 0, 0, .12);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
}
.lab.hot svg { font-size: 14px; stroke-width: 2; }
#leaders line { stroke: var(--label2); stroke-width: .75; opacity: .8; }
#leaders circle { fill: var(--bg0); stroke: var(--label); stroke-width: 1.2; }
#tip { position: absolute; left: 0; top: 0; pointer-events: none; padding: 4px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
#play.pill, #apcard {
  position: absolute; bottom: calc(var(--pad) + 62px); left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2); transform: translateX(-50%);
}
.pill { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px 0 13px; border-radius: 19px; font-size: 14px; font-weight: 600; color: var(--accent); }
.pill:hover { filter: brightness(1.04); }
.pill svg { font-size: 14px; }
#apcard { width: min(560px, calc(100% - var(--side) - var(--insp) - 5 * var(--pad))); border-radius: 16px; padding: 12px 14px 12px; }
.ap-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.ap-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: none; }
.ap-read { flex: 1 1 auto; min-width: 0; text-align: right; font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ap-head .close { width: 26px; height: 26px; font-size: 13px; }
.ap-svg { display: block; width: 100%; touch-action: none; cursor: ew-resize; -webkit-user-select: none; user-select: none; }
.ap-svg text { font-family: var(--font); fill: var(--label2); font-size: 10.5px; }
.ap-svg .g-tick { font-variant-numeric: tabular-nums; }
.ap-svg .g-unit { fill: var(--label3); font-size: 10px; }
.ap-svg .small { font-size: 9.5px; }
.ap-svg .g-lab.na { fill: var(--na); font-weight: 600; }
.ap-svg .g-lab.k { fill: var(--k); font-weight: 600; }
.ap-svg .halo { paint-order: stroke; stroke: var(--bg0); stroke-width: 3px; stroke-linejoin: round; }
.g-ref { stroke: var(--sep); stroke-width: 1; }
.g-ref.thr { stroke: var(--label2); stroke-dasharray: 3 3; }
.g-axis { stroke: var(--label3); stroke-width: 1; }
.g-stim { fill: var(--label2); }
.g-area { stroke: none; opacity: .55; }
.g-area.na { fill: var(--na); }
.g-area.k { fill: var(--k); }
.g-refr.abs { fill: var(--label2); }
.g-refr.rel { fill: var(--label3); opacity: .6; }
.g-full, .g-ghost { fill: none; stroke: var(--label3); stroke-width: 1.5; opacity: .55; }
.g-vm { fill: none; stroke: var(--label); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.g-cursor { stroke: var(--accent); stroke-width: 1; }
.g-dot { fill: var(--accent); stroke: var(--bg0); stroke-width: 2; }
.ap-phase { margin: 6px 0 0; font-size: 13.5px; line-height: 1.4; min-height: 2.8em; color: var(--label2); }
.ap-phase b { color: var(--label); font-weight: 600; }
.ap-ctl { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.ap-stim { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--label2); }
.ap-stim input { flex: 1 1 auto; min-width: 60px; accent-color: var(--accent); }
.ap-stim output { flex: none; min-width: 9.5em; text-align: right; font-variant-numeric: tabular-nums; color: var(--label); }
#legend {
  position: absolute; top: var(--pad); left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2); transform: translateX(-50%);
  display: flex; gap: 2px; padding: 4px; border-radius: 13px; max-width: calc(100% - var(--side) - var(--insp) - 5 * var(--pad)); overflow-x: auto; scrollbar-width: none;
}
#legend::-webkit-scrollbar { display: none; }
#legend button { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 9px; font-size: 12.5px; font-weight: 500; white-space: nowrap; flex: none; }
#legend button:hover { background: var(--fill); }
#busy { position: absolute; top: 46%; left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2); transform: translate(-50%, -50%); padding: 9px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--label2); }
#nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--label2); }

/* celular e tablet: folha inferior */
@media (max-width: 900px) {
  :root { --pad: 10px; }
  #toolbar { top: calc(var(--pad) + env(safe-area-inset-top, 0px)); bottom: auto; left: var(--pad); right: var(--pad); transform: none; max-width: none; gap: 6px; }
  .seg { flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: 1 0 auto; padding: 0 6px; text-align: center; font-size: 12.5px; }
  #panes {
    display: flex; flex-direction: column; position: absolute; left: 0; right: 0; bottom: 0; height: var(--sheet, 46%); max-height: calc(100% - 64px - env(safe-area-inset-top, 0px));
    border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .32s cubic-bezier(.2, .85, .25, 1);
    background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  }
  #panes.drag { transition: none; }
  #grab { display: block; flex: none; width: 100%; height: 22px; touch-action: none; cursor: grab; }
  #grab::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 7px auto 0; }
  #sidebar, #inspector { position: static; width: auto; max-height: none; flex: 1 1 auto; min-height: 0; border-radius: 0; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #panes[data-pane="list"] #inspector, #panes[data-pane="detail"] #sidebar { display: none; }
  .search { margin-top: 2px; }
  .ins { padding: 4px 16px 20px; }
  .ins h1 { font-size: 24px; }
  #legend { top: calc(var(--pad) + 56px + env(safe-area-inset-top, 0px)); left: var(--pad); right: var(--pad); transform: none; max-width: none; justify-content: center; }
  #liq span { display: none; }
  #liq { width: 34px; padding: 0; justify-content: center; }
  #busy { left: 50%; top: 30%; }
  #play.pill { left: 50%; bottom: calc(var(--sheet, 46%) + 10px); }
  #apcard { left: var(--pad); right: var(--pad); bottom: calc(var(--sheet, 46%) + 8px); transform: none; width: auto; padding: 10px 12px; }
  .ap-phase { font-size: 13px; }
  /* com a folha levantada, o gráfico sai da frente da cena */
  #app[data-sheet="half"] #apcard, #app[data-sheet="full"] #apcard, #app[data-sheet="full"] #play.pill { display: none; }
  .ap-stim output { min-width: 0; }
  .lab { font-size: 12px; }
}
/* voltar ao hub: no computador, no alto da lista; em tela estreita, no começo da barra de vistas */
.home { display: flex; align-items: center; gap: 3px; align-self: flex-start; flex: none; margin: 11px 12px 0; padding: 2px 6px 2px 2px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
.home:hover { background: var(--accent-soft); }
.home svg { font-size: 13px; stroke-width: 2; }
.home + .search { margin-top: 7px; }
a.tb { color: var(--label); text-decoration: none; }
.home-tb { display: none; }
@media (max-width: 900px) {
  #sidebar .home { display: none; }
  .home + .search { margin-top: 2px; }
  .home-tb { display: inline-flex; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="Modelo 3D de um neurônio. Use a lista de estruturas para navegar pelo teclado."></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels"></div>
  <div id="nogl" hidden>Este navegador não conseguiu abrir a cena 3D. A lista e as fichas continuam funcionando.</div>

  <div id="toolbar" class="glass">

o salina rica em K\u207A, e as organelas.",func:"Abriga o n\xFAcleo e as organelas. \xC9 onde os genes viram prote\xEDnas: tudo o que o neur\xF4nio usa sai daqui.",clue:"O citosol rico em K\u207A \xE9 a base do potencial de repouso (cap. 3).",more:["Tudo o que fica dentro da membrana, menos o n\xFAcleo, forma o citoplasma.","Os neurotransmissores pept\xEDdicos s\xE3o feitos aqui: o precursor \xE9 montado no RE rugoso e cortado no aparelho de Golgi (cap. 5).","Tamb\xE9m recebe sinapses (axossom\xE1ticas). As inibit\xF3rias costumam se agrupar no soma e perto do cone de implanta\xE7\xE3o."],where:"Aberto em corte no centro da cena, com as organelas \xE0 mostra.",rel:["citosol","nucleo","re-rugoso","cone"]},{id:"nucleo",g:"soma",name:"N\xFAcleo",color:"#6A62CF",size:"5\u201310 \xB5m",morf:"Esfera no meio do soma, com um envelope duplo cheio de poros.",func:"Guarda o DNA. Ali ocorre a transcri\xE7\xE3o: o gene \xE9 copiado em RNAm, que sai pelos poros at\xE9 os ribossomos.",clue:"O DNA \xE9 o mesmo em todas as c\xE9lulas do corpo. O que faz um neur\xF4nio ser neur\xF4nio s\xE3o os genes que ele usa.",more:["Do gene \xE0 prote\xEDna: transcri\xE7\xE3o (a RNA-polimerase copia o gene), processamento (saem os \xEDntrons, emendam-se os \xE9xons) e tradu\xE7\xE3o nos ribossomos.","No splicing alternativo, um mesmo gene gera prote\xEDnas diferentes.","O genoma humano tem cerca de 25 mil genes."],where:"Esfera grande dentro do soma. Os pontos escuros s\xE3o os poros.",rel:["re-rugoso","ribossomos"]},{id:"re-rugoso",g:"soma",name:"RE rugoso",aka:"Corp\xFAsculos de Nissl",color:"#C48BE3",morf:"Pilhas de membrana cravejadas de ribossomos, em volta do n\xFAcleo.",func:"Faz as prote\xEDnas destinadas a membranas (canais, bombas, receptores). Elas s\xE3o inseridas na membrana enquanto s\xE3o sintetizadas.",clue:"\xC9 abundante no neur\xF4nio porque ele depende de muitas prote\xEDnas de membrana. Foi o que Nissl viu ao corar o tecido.",more:["Neur\xF4nios t\xEAm mais RE rugoso que a glia e que a maioria das c\xE9lulas.","Monta o precursor dos neurotransmissores pept\xEDdicos (cap. 5).","O ax\xF4nio n\xE3o tem RE rugoso: por isso depende do soma."],where:"L\xE2minas curvas ao lado do n\xFAcleo, pontilhadas de ribossomos.",rel:["ribossomos","golgi","membrana"]},{id:"ribossomos",g:"soma",name:"Ribossomos livres",aka:"Em grupo: polirribossomo",color:"#E9BE4E",morf:"Gr\xE3os soltos no citosol. V\xE1rios ribossomos lendo o mesmo RNAm formam um polirribossomo.",func:"Fazem as prote\xEDnas que ficam no citosol.",clue:"Tamb\xE9m aparecem nos dendritos, embaixo dos espinhos.",more:["No polirribossomo, cada ribossomo produz uma c\xF3pia da mesma prote\xEDna.","Na base dos espinhos, a atividade da sinapse pode mandar fabricar prote\xEDna ali mesmo, algo importante para guardar informa\xE7\xE3o (cap. 25)."],where:"Gr\xE3os dourados soltos no soma. Os enfileirados em arco s\xE3o polirribossomos.",rel:["re-rugoso","espinhos"]},{id:"re-liso",g:"soma",name:"RE liso",color:"#7CC4D6",morf:"Membrana sem ribossomos.",func:"Ajuda a dobrar prote\xEDnas e regula concentra\xE7\xF5es internas, como a de Ca\xB2\u207A.",more:["No m\xFAsculo, chama-se ret\xEDculo sarcoplasm\xE1tico.","Tem canais de Ca\xB2\u207A que o segundo mensageiro IP3 abre, soltando c\xE1lcio no citosol (cap. 6)."],where:"Rede de tubos lisos, perto da borda do soma.",rel:["re-rugoso"]},{id:"golgi",g:"soma",name:"Aparelho de Golgi",color:"#F3A56F",morf:"Pilha de discos de membrana.",func:"Processa as prote\xEDnas depois da tradu\xE7\xE3o e as endere\xE7a para cada parte do neur\xF4nio, como ax\xF4nio ou dendritos.",clue:"\xC9 a expedi\xE7\xE3o da f\xE1brica.",more:["Corta o precursor dos neurotransmissores pept\xEDdicos. Dele sai o gr\xE2nulo secretor j\xE1 cheio, que desce pelo ax\xF4nio (cap. 5)."],where:"Pilha de discos, do lado do soma oposto ao n\xFAcleo.",rel:["re-rugoso","axonio","granulos"]},{id:"mitocondria",g:"soma",name:"Mitoc\xF4ndria",color:"#EC766F",size:"~1 \xB5m",morf:"Organela alongada, com a membrana interna dobrada.",func:"Respira\xE7\xE3o celular: produz ATP.",clue:"O ATP paga as bombas i\xF4nicas e o transporte no ax\xF4nio. O terminal axonal tem muitas mitoc\xF4ndrias: sinal de gasto alto de energia.",more:["Entram \xE1cido pir\xFAvico e oxig\xEAnio. O ciclo de Krebs e a cadeia de transporte de el\xE9trons transformam ADP em ATP.","A bomba de s\xF3dio e pot\xE1ssio consome at\xE9 70% do ATP do enc\xE9falo (cap. 3).","Na membrana externa fica a MAO, enzima que destr\xF3i catecolaminas e serotonina recaptadas (cap. 6)."],where:"C\xE1psulas no soma (uma est\xE1 aberta, mostrando as dobras) e dentro do terminal, na vista Sinapse.",rel:["terminal","bomba","microtubulo"]},{id:"citosol",g:"liq",name:"Citosol",short:"Citosol",color:"#B3A4F0",rows:[["K\u207A","100 mM"],["Na\u207A","15 mM"],["Ca\xB2\u207A","0,0002 mM"],["Cl\u207B","13 mM"]],morf:"Solu\xE7\xE3o salina que preenche o neur\xF4nio por dentro, do soma aos neuritos. \xC9 rica em K\u207A e pobre em Na\u207A.",func:"\xC9 onde ficam as organelas e por onde a corrente el\xE9trica corre dentro do neur\xF4nio, carregada por \xEDons.",clueTitle:"Por que importa",clue:"\xC9 o lado de dentro da bateria. As bombas mant\xEAm o K\u207A alto aqui e o Na\u207A alto l\xE1 fora; essa diferen\xE7a \xE9 o que os canais usam para gerar o potencial de repouso e o potencial de a\xE7\xE3o.",more:["Tudo o que fica dentro da membrana, menos o n\xFAcleo, forma o citoplasma: citosol mais organelas.","Conduz muito pior que um fio de cobre: quem carrega a carga s\xE3o \xEDons, n\xE3o el\xE9trons livres.","\xC9 eletricamente neutro. A carga negativa do repouso fica colada \xE0 face interna da membrana.","O Ca\xB2\u207A \xE9 mantido baix\xEDssimo pela bomba de c\xE1lcio, por prote\xEDnas que se ligam a ele e por organelas que o sequestram.","No terminal, os transmissores pequenos s\xE3o fabricados no citosol e depois concentrados nas ves\xEDculas.","Segundos mensageiros, como o AMPc, se difundem por ele (cap. 6)."],where:"No soma aberto, \xE9 todo o espa\xE7o entre as organelas. Com L\xEDquidos ligado, aparece como o volume lil\xE1s dentro do soma, do terminal e do ax\xF4nio.",rel:["soma","extracelular","membrana","ion-k","bomba"]},{id:"extracelular",g:"liq",name:"L\xEDquido extracelular",short:"Extracelular",color:"#7FD0DA",rows:[["K\u207A","5 mM"],["Na\u207A","150 mM"],["Ca\xB2\u207A","2 mM"],["Cl\u207B","150 mM"]],morf:"Solu\xE7\xE3o salina que banha neur\xF4nios e glia por fora. \xC9 rica em Na\u207A e Cl\u207B e pobre em K\u207A.",func:"\xC9 o lado de fora da bateria. \xC9 tamb\xE9m por ele que o neurotransmissor se difunde na fenda sin\xE1ptica.",clueTitle:"Por que importa",clue:"O potencial de repouso \xE9 muito sens\xEDvel ao K\u207A daqui: subir de 5 para 50 mM leva o Vm de \u221265 para cerca de \u221217 mV. Por isso os astr\xF3citos e a barreira hematencef\xE1lica mant\xEAm esse K\u207A baixo.",more:["O espa\xE7o \xE9 m\xEDnimo: os astr\xF3citos preenchem o espa\xE7o entre os neur\xF4nios, e sobram frestas de cerca de 20 nm. A cena afasta as c\xE9lulas para dar para ver.","Como tamb\xE9m conduz eletricidade, a corrente que viaja pelo ax\xF4nio vaza para ele: \xE9 a mangueira furada do cap\xEDtulo 3.","A fenda sin\xE1ptica faz parte dele, com 20 a 50 nm.","Os astr\xF3citos captam o K\u207A onde houve muita atividade e o espalham pela rede de prolongamentos (tamponamento espacial)."],where:"Todo o espa\xE7o fora das c\xE9lulas. Com L\xEDquidos ligado, o fundo fica azulado e os pontos soltos representam \xEDons: alaranjados para Na\u207A, roxos para K\u207A.",rel:["citosol","astrocito","fenda","ion-na","sangue"]},{id:"liquor",g:"liq",name:"L\xEDquido dos ventr\xEDculos",short:"Ventr\xEDculos",color:"#7DAFEF",morf:"L\xEDquido que enche os ventr\xEDculos, as cavidades do enc\xE9falo.",func:"Preenche os ventr\xEDculos e fica em contato com as c\xE9lulas ependim\xE1rias que os revestem.",clueTitle:"Na hist\xF3ria",clue:"Galeno achou os ventr\xEDculos cheios de l\xEDquido e concluiu, errado, que sensa\xE7\xE3o e movimento eram fluidos indo e vindo pelos nervos. A ideia s\xF3 caiu quando se mostrou que os nervos conduzem eletricidade.",more:[{x:"Em anatomia ele se chama l\xEDquido cerebrospinal, l\xEDquido cefalorraquidiano ou l\xEDquor. O nome e a fun\xE7\xE3o dele n\xE3o aparecem nos cap\xEDtulos 1 a 6."}],where:"Na vista Tecido, com L\xEDquidos ligado: o volume azul \xE0 esquerda da parede de c\xE9lulas ependim\xE1rias.",rel:["ependimaria","extracelular"]},{id:"sangue",g:"liq",name:"Sangue",short:"Sangue",color:"#EFD27F",morf:"L\xEDquido que corre dentro dos capilares.",func:"Traz oxig\xEAnio e nutrientes ao tecido nervoso.",clueTitle:"Por que importa",clue:"N\xE3o se mistura livremente com o l\xEDquido extracelular: a barreira hematencef\xE1lica, nas paredes dos capilares, limita a passagem de K\u207A.",more:["O triptofano, mat\xE9ria-prima da serotonina, chega ao enc\xE9falo pelo sangue (cap. 6).","A micr\xF3glia pode vir do sangue.","No cora\xE7\xE3o n\xE3o h\xE1 essa barreira: por isso cloreto de pot\xE1ssio na veia \xE9 letal.",{x:"A parte l\xEDquida do sangue se chama plasma. As c\xE9lulas vermelhas desenhadas s\xE3o hem\xE1cias."}],where:"Na vista Tecido, com L\xEDquidos ligado: o l\xEDquido amarelado dentro do capilar.",rel:["capilar","extracelular","astrocito"]},{id:"membrana",g:"estr",name:"Membrana neuronal",color:"#7FCBA4",sizeLabel:"Espessura",size:"5 nm",morf:"Bicamada de fosfolip\xEDdios cravejada de prote\xEDnas: umas bombeiam subst\xE2ncias, outras formam poros. A composi\xE7\xE3o muda entre soma, dendritos e ax\xF4nio.",func:"Barreira para \xEDons. As prote\xEDnas dela criam os sinais el\xE9tricos do neur\xF4nio.",clue:"A diferen\xE7a entre ax\xF4nio e dendrito \xE9, no n\xEDvel molecular, uma diferen\xE7a de prote\xEDnas de membrana.",more:["Cada fosfolip\xEDdio tem uma cabe\xE7a polar, que gosta de \xE1gua, e uma cauda que foge dela. Em duas camadas, as caudas se escondem no meio.","Canais i\xF4nicos: 4 a 6 subunidades em volta de um poro, com seletividade e, em muitos, port\xE3o.","Bombas i\xF4nicas: enzimas que usam ATP para mover \xEDons contra o gradiente.","A carga separada fica colada \xE0s duas faces da membrana (capacit\xE2ncia). O resto das solu\xE7\xF5es \xE9 neutro.","Somando todos os neur\xF4nios, d\xE1 cerca de 21 mil m\xB2 de membrana."],where:"Na vista Ax\xF4nio: a parede em duas camadas, aberta em janela. Na vista Impulso: a bicamada com os canais.",rel:["canal-na","canal-k","bomba","re-rugoso","citosol","extracelular"]},{id:"microtubulo",g:"estr",name:"Microt\xFAbulo",color:"#58B9C4",size:"20 nm",morf:"Tubo oco de tubulina, que corre ao longo dos neuritos.",func:"Trilho do transporte axoplasm\xE1tico: ves\xEDculas caminham sobre ele gastando ATP. A cinesina leva do soma ao terminal; a dine\xEDna traz de volta.",clue:"O terminal axonal n\xE3o tem microt\xFAbulos.",more:["Prote\xEDnas associadas (MAPs), como a tau, organizam os microt\xFAbulos. No Alzheimer, a tau se solta e se acumula em emaranhados neurofibrilares.","Transporte r\xE1pido: at\xE9 1.000 mm por dia. Transporte lento: 1 a 10 mm por dia.","Os v\xEDrus do herpes e da raiva entram no sistema nervoso pelo transporte retr\xF3grado."],where:"Na vista Ax\xF4nio: os tubos ocos mais grossos.",rel:["neurofilamento","microfilamento","axonio"]},{id:"neurofilamento",g:"estr",name:"Neurofilamento",color:"#D6B95B",size:"10 nm",morf:"Subunidades tran\xE7adas como corda.",func:"Resist\xEAncia mec\xE2nica. \xC9 o mais resistente dos tr\xEAs e faz o papel de osso.",more:["\xC9 um filamento intermedi\xE1rio, parente da queratina do pelo."],where:"Na vista Ax\xF4nio: as cordas tran\xE7adas, de espessura m\xE9dia.",rel:["microtubulo","microfilamento"]},{id:"microfilamento",g:"estr",name:"Microfilamento",color:"#EE8DB0",size:"5 nm",morf:"Duas fitas tran\xE7adas de actina, presas \xE0 membrana.",func:"Muda a forma da c\xE9lula.",more:["O citoesqueleto \xE9 montado e desmontado o tempo todo.","No m\xFAsculo, a actina participa da contra\xE7\xE3o (cap. 13)."],where:"Na vista Ax\xF4nio: os fios mais finos, colados por dentro da membrana.",rel:["microtubulo","neurofilamento","membrana"]},{id:"neuritos",g:"in",name:"Neuritos",color:"#9AB0C4",also:["dendritos","espinhos","axonio","colaterais","cone"],morf:"Prolongamentos finos que saem do soma. S\xE3o de dois tipos: ax\xF4nio e dendritos.",func:"Nome geral. Os dendritos s\xE3o a entrada do sinal; o ax\xF4nio \xE9 a sa\xEDda.",more:["Pelo n\xFAmero de neuritos, o neur\xF4nio \xE9 unipolar, bipolar ou multipolar. A maioria no enc\xE9falo \xE9 multipolar."],where:"Tudo o que sai do soma. Ao escolher este item, dendritos e ax\xF4nio ficam em destaque juntos.",rel:["dendritos","axonio"]},{id:"dendritos",g:"in",name:"Dendritos",aka:"\xC1rvore dendr\xEDtica",color:"#74AEEE",sizeLabel:"Comprimento",size:"Raramente passam de 2 mm",morf:"V\xE1rios por neur\xF4nio, curtos, ramificados, e afinam na ponta.",func:"Antenas: recebem milhares de sinapses. A membrana embaixo delas tem receptores que detectam os neurotransmissores.",clue:"\xC1rvore elaborada indica c\xE9lula especializada em receber muitos sinais.",more:["Aqui o sinal n\xE3o se regenera: cada PEPS \xE9 pequeno e decai com a dist\xE2ncia. A uma constante de comprimento (\u03BB) da sinapse, sobram 37%.","O neur\xF4nio soma os PEPS no espa\xE7o (v\xE1rias sinapses ao mesmo tempo) e no tempo (a mesma sinapse em sequ\xEAncia r\xE1pida).","A maioria dos dendritos tem canais de Na\u207A, Ca\xB2\u207A e K\u207A dependentes de voltagem, que amplificam PEPS pequenos e distantes."],where:"Os ramos que saem do soma em v\xE1rias dire\xE7\xF5es.",rel:["espinhos","sinapse","receptores"]},{id:"espinhos",g:"in",name:"Espinhos dendr\xEDticos",color:"#A3CFF6",morf:"Pequenas bolsas penduradas no dendrito.",func:"Recebem sinapses e isolam as rea\xE7\xF5es qu\xEDmicas disparadas por cada uma. Mudam de forma conforme a atividade.",more:["A sinapse feita em um espinho se chama axoespinhosa.","Na base h\xE1 polirribossomos: a sinapse pode mandar fabricar prote\xEDna no local.","Em crian\xE7as com defici\xEAncia intelectual, os espinhos s\xE3o menos numerosos, longos e finos, parecidos com os de fetos."],where:"As bolinhas ao longo dos dendritos. Na vista Sinapse, a bolsa logo abaixo da fenda.",rel:["dendritos","sinapse","ribossomos"]},{id:"cone",g:"out",name:"Cone de implanta\xE7\xE3o",aka:"Zona de gatilho",color:"#F2BE63",morf:"Regi\xE3o do soma que afunila at\xE9 o segmento inicial do ax\xF4nio.",func:"Zona de gatilho: os canais de Na\u207A dependentes de voltagem s\xE3o densos aqui, e \xE9 onde nasce o potencial de a\xE7\xE3o.",clue:"Vale para o neur\xF4nio t\xEDpico do enc\xE9falo e da medula. No neur\xF4nio sensorial, o gatilho fica perto da termina\xE7\xE3o sensorial.",more:["O neur\xF4nio dispara quando a soma dos PEPS, descontada a inibi\xE7\xE3o, atinge o limiar aqui.","Soma e dendritos em geral n\xE3o disparam potenciais de a\xE7\xE3o de Na\u207A, porque t\xEAm poucos desses canais."],where:"O funil entre o soma e o ax\xF4nio. Os pontos vermelhos marcam canais de Na\u207A.",rel:["canal-na","axonio","nodulo"]},{id:"axonio",g:"out",name:"Ax\xF4nio",color:"#ED9F67",size:"<1 mm a >1 m de comprimento; <1 a ~25 \xB5m de di\xE2metro",morf:"Um por neur\xF4nio, com di\xE2metro uniforme e ramos em \xE2ngulo reto. N\xE3o tem RE rugoso e quase n\xE3o tem ribossomos.",func:"Conduz o potencial de a\xE7\xE3o para longe do soma. Quanto mais grosso, mais r\xE1pido.",clue:"Sem ribossomos, n\xE3o fabrica prote\xEDnas: tudo vem do soma. Separado dele, degenera (degenera\xE7\xE3o walleriana).",more:["O potencial de a\xE7\xE3o se regenera a cada trecho e n\xE3o encolhe no caminho. N\xE3o volta porque o trecho de tr\xE1s est\xE1 refrat\xE1rio.","A cerca de 10 m/s e com 2 ms de dura\xE7\xE3o, um potencial de a\xE7\xE3o ocupa uns 2 cm de ax\xF4nio por vez.","Enzimas e gr\xE2nulos de pept\xEDdeo descem do soma por transporte axoplasm\xE1tico.","Na lula, o ax\xF4nio gigante chega a 1 mm de di\xE2metro. Foi nele que Hodgkin e Huxley trabalharam."],where:"O fio longo que sai do cone. Aparece nu no come\xE7o, nos n\xF3dulos e no fim.",rel:["cone","mielina","colaterais","terminal","microtubulo"]},{id:"colaterais",g:"out",name:"Colaterais",color:"#DB8552",morf:"Ramos do ax\xF4nio, que saem em \xE2ngulo reto. As que voltam para a pr\xF3pria c\xE9lula ou para c\xE9lulas vizinhas s\xE3o colaterais recorrentes.",func:"Levam o mesmo sinal a outros alvos.",where:"O ramo que sai do ax\xF4nio em um n\xF3dulo.",rel:["axonio","terminal"]},{id:"mielina",g:"out",name:"Bainha de mielina",color:"#EFE4C8",morf:"Membrana de glia enrolada em espiral em volta do ax\xF4nio, interrompida a intervalos.",func:"Isola o ax\xF4nio: menos corrente vaza pela membrana, e a condu\xE7\xE3o acelera.",clue:"N\xE3o \xE9 parte do neur\xF4nio. \xC9 membrana de oligodendr\xF3cito (no sistema nervoso central) ou de c\xE9lula de Schwann (no perif\xE9rico).",more:["Na esclerose m\xFAltipla, a mielina do sistema nervoso central \xE9 atacada, e a condu\xE7\xE3o fica lenta ou falha.","Na s\xEDndrome de Guillain-Barr\xE9, o ataque \xE9 \xE0 mielina dos nervos perif\xE9ricos."],where:"As capas claras em volta do ax\xF4nio. Na vista Ax\xF4nio, o corte mostra a espiral.",rel:["oligodendrocito","schwann","nodulo"]},{id:"nodulo",g:"out",name:"N\xF3dulo de Ranvier",color:"#F6B77A",sizeLabel:"Espa\xE7amento",size:"0,2 a 2 mm",morf:"Intervalo sem mielina, onde a membrana do ax\xF4nio fica exposta e os canais de Na\u207A se concentram.",func:"Regenera o potencial de a\xE7\xE3o, que salta de n\xF3dulo em n\xF3dulo (condu\xE7\xE3o saltat\xF3ria).",more:["Quanto mais grosso o ax\xF4nio, mais espa\xE7ados os n\xF3dulos."],where:"Os intervalos entre duas capas de mielina. Os pontos vermelhos marcam canais de Na\u207A.",rel:["mielina","canal-na","cone"]},{id:"terminal",g:"out",name:"Terminal axonal",aka:"Bot\xE3o terminal",color:"#EE8AA4",morf:"Ponta dilatada do ax\xF4nio. N\xE3o tem microt\xFAbulos, \xE9 cheia de ves\xEDculas sin\xE1pticas, tem um revestimento denso de prote\xEDnas na face voltada para a sinapse e muitas mitoc\xF4ndrias.",func:"Converte o sinal el\xE9trico em qu\xEDmico: libera neurotransmissor na fenda.",more:["O ax\xF4nio pode terminar em v\xE1rios ramos curtos (arboriza\xE7\xE3o terminal) ou fazer sinapses de passagem (bot\xF5es en passant).","Os transmissores pequenos (amino\xE1cidos e aminas) s\xE3o fabricados aqui mesmo, no citosol, por enzimas que vieram do soma.","Transportadores da membrana recaptam o transmissor da fenda, usando o gradiente de Na\u207A.","Autorreceptores sentem o transmissor liberado e freiam a libera\xE7\xE3o, como uma v\xE1lvula de seguran\xE7a."],where:"Os bot\xF5es no fim do ax\xF4nio. Por dentro, na vista Sinapse.",rel:["vesiculas","zona-ativa","sinapse","mitocondria"]},{id:"sinapse",g:"syn",name:"Sinapse",color:"#C97BD8",sizeLabel:"Fenda",size:"20 a 50 nm",morf:"Tem um lado pr\xE9-sin\xE1ptico (em geral, o terminal), a fenda sin\xE1ptica e um lado p\xF3s-sin\xE1ptico (dendrito ou soma de outro neur\xF4nio), com receptores.",func:"Ponto de contato onde o sinal passa de uma c\xE9lula a outra: chega el\xE9trico, vira qu\xEDmico e volta a ser el\xE9trico do outro lado.",clue:"Sinapse tipo I de Gray (assim\xE9trica, lado p\xF3s mais espesso) costuma ser excitat\xF3ria. Tipo II (sim\xE9trica) costuma ser inibit\xF3ria.",more:["Em seis passos: chega o potencial de a\xE7\xE3o; abrem-se canais de Ca\xB2\u207A; a ves\xEDcula se funde e solta o transmissor; ele cruza a fenda; o receptor responde; o transmissor \xE9 retirado.","Pelo lugar do contato: axodendr\xEDtica, axossom\xE1tica, axoax\xF4nica ou axoespinhosa.","A maioria das sinapses do sistema nervoso maduro \xE9 qu\xEDmica. Tamb\xE9m existem sinapses el\xE9tricas (jun\xE7\xF5es comunicantes, a 3 nm), bidirecionais e quase instant\xE2neas.","Uma sinapse t\xEDpica do sistema nervoso central gera um PEPS de alguns d\xE9cimos de mV. Sozinha, n\xE3o faz o neur\xF4nio disparar."],where:"Onde um bot\xE3o terminal toca o dendrito do neur\xF4nio seguinte. Em detalhe, na vista Sinapse.",rel:["terminal","vesiculas","fenda","receptores","astrocito"]},{id:"vesiculas",also:["neurotransmissor"],g:"syn",name:"Ves\xEDculas sin\xE1pticas",color:"#F1CF62",size:"~50 nm",morf:"Esferas de membrana dentro do terminal. O neurotransmissor fica guardado no interior delas, o l\xFAmen.",func:"Guardam o neurotransmissor e o liberam na fenda por exocitose: a membrana da ves\xEDcula se funde com a do terminal.",clue:"A libera\xE7\xE3o \xE9 r\xE1pida porque as ves\xEDculas j\xE1 est\xE3o atracadas na zona ativa, bem onde o Ca\xB2\u207A entra.",more:["Transportadores na membrana da ves\xEDcula concentram o transmissor l\xE1 dentro at\xE9 100 mil vezes, trocando cada mol\xE9cula por um H\u207A.","O l\xFAmen \xE9 \xE1cido: uma bomba de H\u207A movida a ATP mant\xE9m isso, e \xE9 esse gradiente de H\u207A que o transportador usa.","Cada ves\xEDcula carrega alguns milhares de mol\xE9culas de transmissor.","Prote\xEDnas SNARE amarram a ves\xEDcula \xE0 membrana do terminal. A sinaptotagmina sente o Ca\xB2\u207A e dispara a fus\xE3o.","Depois da exocitose, a membrana \xE9 recuperada por endocitose, e a ves\xEDcula \xE9 recarregada.","Guardam amino\xE1cidos e aminas. Pept\xEDdeos ficam nos gr\xE2nulos secretores."],where:"Na vista Sinapse: as esferas dentro do terminal. Duas est\xE3o abertas, mostrando o neurotransmissor no l\xFAmen.",rel:["neurotransmissor","zona-ativa","granulos","terminal"]},{id:"neurotransmissor",g:"syn",name:"Neurotransmissor",color:"#F2A541",morf:"Mol\xE9cula guardada no l\xFAmen das ves\xEDculas sin\xE1pticas. H\xE1 tr\xEAs fam\xEDlias: amino\xE1cidos (glutamato, GABA, glicina), aminas (acetilcolina, dopamina, noradrenalina, serotonina) e pept\xEDdeos.",func:"Liberado na fenda, atravessa at\xE9 a membrana p\xF3s-sin\xE1ptica e se liga aos receptores, como chave na fechadura.",clue:"Quem decide o efeito \xE9 o receptor, n\xE3o o transmissor: a mesma acetilcolina contrai o m\xFAsculo esquel\xE9tico e desacelera o cora\xE7\xE3o.",more:["Sai da fenda por difus\xE3o, por recapta\xE7\xE3o (transportadores do terminal e da glia) ou por degrada\xE7\xE3o enzim\xE1tica, como a da acetilcolina pela acetilcolinesterase.","O glutamato \xE9 o principal transmissor excitat\xF3rio do enc\xE9falo; o GABA, o principal inibit\xF3rio.","Dentro de uma ves\xEDcula colin\xE9rgica, a acetilcolina pode chegar a 1.000 mM.","Para ser chamada de neurotransmissor, a mol\xE9cula precisa ser sintetizada e guardada no neur\xF4nio pr\xE9-sin\xE1ptico, ser liberada quando ele \xE9 estimulado e, aplicada de fora, imitar o efeito da sinapse."],where:"Na vista Sinapse: os gr\xE3os alaranjados dentro das ves\xEDculas abertas e espalhados na fenda.",rel:["vesiculas","receptores","fenda","astrocito"]},{id:"granulos",g:"syn",name:"Gr\xE2nulos secretores",aka:"Ves\xEDculas grandes e eletronicamente densas",color:"#B98A5A",size:"~100 nm",morf:"Ves\xEDculas maiores, que aparecem escuras ao microsc\xF3pio eletr\xF4nico.",func:"Guardam os neurotransmissores pept\xEDdicos e os liberam por exocitose dependente de Ca\xB2\u207A, fora das zonas ativas.",clue:"Como ficam longe das zonas ativas, um potencial de a\xE7\xE3o isolado n\xE3o basta: \xE9 preciso uma salva em alta frequ\xEAncia, que eleve o Ca\xB2\u207A no terminal inteiro.",more:["J\xE1 saem cheios do aparelho de Golgi, no soma, e descem pelo ax\xF4nio por transporte axoplasm\xE1tico.","A libera\xE7\xE3o \xE9 lenta: 50 ms ou mais."],where:"Na vista Sinapse: as duas esferas maiores e mais escuras, no alto do terminal.",rel:["golgi","vesiculas","neurotransmissor"]},{id:"zona-ativa",g:"syn",name:"Zona ativa",color:"#B54C6C",morf:"Ac\xFAmulo de prote\xEDnas na face do terminal voltada para a fenda, onde as ves\xEDculas se agrupam.",func:"\xC9 o lugar onde o neurotransmissor \xE9 liberado.",more:["Sinapses maiores t\xEAm mais zonas ativas. A jun\xE7\xE3o neuromuscular tem muitas.","Do outro lado da fenda fica a densidade p\xF3s-sin\xE1ptica, com os receptores."],where:"Na vista Sinapse: o disco escuro no fundo do terminal, com ves\xEDculas atracadas.",rel:["canal-ca","vesiculas","receptores"]},{id:"canal-ca",g:"syn",name:"Canal de Ca\xB2\u207A dependente de voltagem",color:"#4FB6A6",morf:"Prote\xEDna da membrana do terminal, nas zonas ativas. \xC9 parente do canal de Na\u207A do potencial de a\xE7\xE3o, mas deixa passar Ca\xB2\u207A.",func:"Abre quando o potencial de a\xE7\xE3o despolariza o terminal. O Ca\xB2\u207A entra, e essa subida \xE9 o sinal para as ves\xEDculas liberarem o transmissor.",clue:"A for\xE7a que empurra o Ca\xB2\u207A para dentro \xE9 enorme: em repouso, h\xE1 s\xF3 0,0002 mM no citosol.",more:["Junto da zona ativa, o Ca\xB2\u207A passa de 0,01 mM quando os canais abrem.","Em uma sinapse de mam\xEDfero, a libera\xE7\xE3o pode come\xE7ar cerca de 60 \xB5s depois da entrada do c\xE1lcio."],where:"Na vista Sinapse: as prote\xEDnas verde-azuladas na borda de baixo do terminal.",rel:["zona-ativa","vesiculas","canal-na"]},{id:"fenda",also:["neurotransmissor"],g:"syn",name:"Fenda sin\xE1ptica",color:"#C9A6E0",sizeLabel:"Largura",size:"20 a 50 nm",morf:"Espa\xE7o entre as membranas pr\xE9 e p\xF3s-sin\xE1ptica, preenchido por uma matriz de prote\xEDnas fibrosas que mant\xE9m as duas unidas.",func:"O neurotransmissor se difunde por ela at\xE9 os receptores.",more:["\xC9 cerca de 10 vezes mais larga que a dist\xE2ncia em uma jun\xE7\xE3o comunicante (3 nm).","Astr\xF3citos em volta limitam a difus\xE3o do transmissor e o retiram da fenda."],where:"Na vista Sinapse: o espa\xE7o entre o terminal e o espinho, com o neurotransmissor.",rel:["neurotransmissor","receptores","extracelular","astrocito"]},{id:"receptores",g:"syn",name:"Receptores",aka:"Na densidade p\xF3s-sin\xE1ptica",color:"#6C8BF0",morf:"Prote\xEDnas da membrana p\xF3s-sin\xE1ptica. S\xE3o de dois tipos: canais i\xF4nicos ativados por transmissor (quatro ou cinco subunidades em volta de um poro) e receptores acoplados a prote\xEDnas G.",func:"Detectam o neurotransmissor. O canal abre em microssegundos e gera um PEPS (se entra Na\u207A) ou um PIPS (se entra Cl\u207B). O receptor acoplado a prote\xEDna G age mais devagar, por mais tempo, e modula.",clue:"O canal aberto por glutamato ou acetilcolina puxa o Vm para perto de 0 mV, acima do limiar: excita. O canal de Cl\u207B aberto por GABA ou glicina segura o Vm perto de \u221265 mV: inibe.",more:["Receptores de glutamato: AMPA (PEPS r\xE1pido) e NMDA (deixa entrar Ca\xB2\u207A e s\xF3 conduz com glutamato e despolariza\xE7\xE3o juntos, porque o Mg\xB2\u207A tapa o poro em repouso).","O receptor acoplado a prote\xEDna G atravessa a membrana sete vezes. A prote\xEDna G abre um canal direto (via de atalho) ou liga uma cascata de segundos mensageiros.","H\xE1 bem mais de 100 receptores, e um mesmo transmissor pode ativar v\xE1rios subtipos."],where:"Na vista Sinapse: os canais azuis em cima do espinho, voltados para a fenda.",rel:["neurotransmissor","espinhos","fenda"]},{id:"canal-na",also:["ion-na"],g:"ap",name:"Canal de Na\u207A dependente de voltagem",color:"#EE8660",morf:"Um \xFAnico polipept\xEDdeo longo com 4 dom\xEDnios (I a IV), cada um com 6 alfa-h\xE9lices que atravessam a membrana (S1 a S6). Os quatro dom\xEDnios se juntam em volta do poro.",func:"Abre quando a membrana despolariza at\xE9 o limiar. O Na\u207A entra e produz a fase ascendente. Fica aberto cerca de 1 ms e se inativa.",clue:"A h\xE9lice S4, com amino\xE1cidos positivos, \xE9 o sensor de voltagem. Na inativa\xE7\xE3o, uma parte globular da prote\xEDna tampa o poro: isso explica a brevidade do potencial de a\xE7\xE3o e o per\xEDodo refrat\xE1rio absoluto.",more:["O filtro de seletividade deixa o canal cerca de 12 vezes mais perme\xE1vel ao Na\u207A que ao K\u207A.","S\xF3 pode abrir de novo depois que o Vm volta para perto do repouso (desinativa\xE7\xE3o).","A tetrodotoxina (TTX), do baiacu, tampa o poro pelo lado de fora. A lidoca\xEDna entra pelo port\xE3o aberto e se liga por dentro.","\xC9 denso no cone de implanta\xE7\xE3o e nos n\xF3dulos de Ranvier."],where:"Na vista Impulso: os canais alaranjados. A bolinha presa embaixo \xE9 a parte que tampa o poro na inativa\xE7\xE3o.",rel:["canal-k","ion-na","cone","nodulo"]},{id:"canal-k",also:["ion-k"],g:"ap",name:"Canal de K\u207A dependente de voltagem",color:"#8177E6",morf:"Quatro subunidades separadas em volta do poro (no canal de Na\u207A, \xE9 um polipept\xEDdeo s\xF3, com quatro dom\xEDnios).",func:"Tamb\xE9m abre com a despolariza\xE7\xE3o, mas cerca de 1 ms depois. O K\u207A sai, e o Vm volta a ficar negativo: \xE9 a fase descendente.",clue:"Por abrir com atraso, essa condut\xE2ncia foi chamada de retificador com retardo. Enquanto o canal continua aberto, o Vm passa do repouso e se aproxima do EK: \xE9 a hiperpolariza\xE7\xE3o p\xF3s-potencial.",more:["Em cada subunidade, uma al\xE7a do poro forma o filtro de seletividade.","Canais de K\u207A lentos, que v\xE3o se acumulando abertos durante o est\xEDmulo, fazem alguns neur\xF4nios dispararem cada vez mais devagar (adapta\xE7\xE3o)."],where:"Na vista Impulso: os canais roxos.",rel:["canal-na","ion-k","canal-vaz"]},{id:"canal-vaz",also:["ion-k"],g:"ap",name:"Canal de K\u207A aberto no repouso",color:"#B5ACF3",morf:"Canal de K\u207A que j\xE1 fica aberto no repouso, sem depender de voltagem.",func:"Deixa o K\u207A sair a favor do gradiente. Cada K\u207A que sai deixa uma carga negativa para tr\xE1s, e o interior fica negativo: \xE9 o potencial de repouso.",clue:"Em repouso, a membrana \xE9 cerca de 40 vezes mais perme\xE1vel ao K\u207A que ao Na\u207A. Um pequeno vazamento de Na\u207A impede o Vm de chegar ao EK (\u221280 mV) e o deixa em cerca de \u221265 mV.",where:"Na vista Impulso: o canal lil\xE1s, por onde o K\u207A sai devagar o tempo todo.",rel:["ion-k","bomba","canal-k"]},{id:"bomba",also:["ion-na","ion-k"],g:"ap",name:"Bomba de s\xF3dio e pot\xE1ssio",color:"#57B98F",morf:"Enzima da membrana.",fun
