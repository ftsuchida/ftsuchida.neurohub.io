<style>
/* Layout: a cena 3D ocupa a tela inteira; lista, ficha e controles flutuam sobre ela em painéis translúcidos.
   No celular, lista e ficha viram uma folha inferior. Tipografia: SF Pro pela fonte do sistema. */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, "Segoe UI", Roboto, Arial, sans-serif;
  --bg0: #F8F8FA; --bg1: #E4E4EA; --fog: #EEEEF2; --clay: #DCDCE2;
  --label: #1D1D1F; --label2: #6E6E73; --label3: #A1A1A6;
  --sep: rgba(60, 60, 67, .14); --fill: rgba(118, 118, 128, .12); --fill2: rgba(118, 118, 128, .2);
  --glass: rgba(255, 255, 255, .74); --glass-edge: rgba(0, 0, 0, .07); --thumb: #FFFFFF;
  --accent: #007AFF; --accent-soft: rgba(0, 122, 255, .12); --on-accent: #FFFFFF;
  --shadow: 0 10px 34px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .06);
  --ghost: #7C8AA5;
  --g-off: #6E7C9A; --g-on: #DB3F98;
  --pad: 16px; --side: 268px; --insp: 340px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg0: #232327; --bg1: #0A0A0C; --fog: #19191C; --clay: #3C3C42;
    --label: #F5F5F7; --label2: #A1A1A6; --label3: #6E6E73;
    --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
    --glass: rgba(34, 34, 37, .74); --glass-edge: rgba(255, 255, 255, .09); --thumb: #636366;
    --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .24); --on-accent: #FFFFFF;
    --shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .3);
    --ghost: #9FB1D1;
    --g-off: #A3B0CC; --g-on: #F0589F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg0: #232327; --bg1: #0A0A0C; --fog: #19191C; --clay: #3C3C42;
  --label: #F5F5F7; --label2: #A1A1A6; --label3: #6E6E73;
  --sep: rgba(84, 84, 88, .55); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
  --glass: rgba(34, 34, 37, .74); --glass-edge: rgba(255, 255, 255, .09); --thumb: #636366;
  --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .24); --on-accent: #FFFFFF;
  --shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .3);
  --ghost: #9FB1D1;
  --g-off: #A3B0CC; --g-on: #F0589F;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--label);
  background: var(--bg1);
  font: 400 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
svg.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; overflow: hidden; background: radial-gradient(120% 95% at 50% 38%, var(--bg0), var(--bg1)); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#gl.pt { cursor: pointer; }
#leaders, #labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#gl, #leaders, #labels { transition: opacity .17s ease; }
#app.fade #gl, #app.fade #leaders, #app.fade #labels { opacity: 0; }

/* painéis */
.glass {
  background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
}
#panes { display: contents; }
#grab { display: none; }
#sidebar, #inspector { position: absolute; border-radius: 18px; }
#sidebar { top: var(--pad); left: var(--pad); bottom: var(--pad); width: var(--side); display: flex; flex-direction: column; min-height: 0; }
#inspector { top: var(--pad); right: var(--pad); width: var(--insp); max-height: calc(100% - 2 * var(--pad)); overflow-y: auto; overscroll-behavior: contain; }

/* lista */
.search { position: relative; margin: 12px 12px 6px; flex: none; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--label2); pointer-events: none; }
.search input {
  width: 100%; height: 34px; padding: 0 10px 0 31px; border: 0; border-radius: 10px; background: var(--fill);
  font-size: 15px; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--label2); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
#list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 8px 12px; }
#list h2 { margin: 14px 10px 4px; font-size: 12px; line-height: 1.3; font-weight: 600; color: var(--label2); }
#list ul { list-style: none; margin: 0; padding: 0; }
#list button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 5px 10px; border-radius: 8px; font-size: 14px; line-height: 1.25; }
#list button:hover { background: var(--fill); }
#list button[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
#list .none { margin: 18px 10px; color: var(--label2); font-size: 14px; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .18); }
[aria-current="true"] > .dot { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .85); }

/* ficha */
.ins { padding: 20px 20px 22px; }
.ins-top { display: flex; align-items: flex-start; gap: 12px; }
.ins-top > div { flex: 1 1 auto; min-width: 0; }
.ins h1 { margin: 0; font-size: 26px; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; text-wrap: balance; }
.ins .aka { margin: 4px 0 0; font-size: 15px; color: var(--label2); }
.close { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--label2); display: grid; place-items: center; font-size: 15px; }
.close:hover { background: var(--fill2); }
.close svg { stroke-width: 2.2; }
.back { display: none; }
.rows { margin: 16px 0 0; padding: 0; list-style: none; background: var(--fill); border-radius: 12px; }
.rows > * { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 9px 14px; font-size: 14px; }
.rows > * + * { box-shadow: inset 0 .5px 0 var(--sep); }
.rows dt { color: var(--label); flex: none; }
.rows dd { margin: 0; color: var(--label2); text-align: right; font-variant-numeric: tabular-nums; }
.ins h2 { margin: 20px 0 3px; font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--label2); }
.ins p { margin: 0; font-size: 15px; line-height: 1.45; max-width: 60ch; }
.ins .lead { margin-top: 10px; color: var(--label2); }
.ins ul.more { margin: 2px 0 0; padding: 0 0 0 1.15em; font-size: 14.5px; line-height: 1.42; }
.ins ul.more li { margin: 5px 0 0; padding-left: 2px; }
.ins ul.more li::marker { color: var(--label3); }
.tag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 5px; background: var(--fill2); color: var(--label2); font-size: 11px; font-weight: 600; line-height: 16px; vertical-align: 1px; }
.actions { margin-top: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 500; }
.btn:hover { filter: brightness(1.07); }
.btn svg { font-size: 15px; }
.rows.links > li { display: block; padding: 0; }
.rows.links button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px 9px 14px; font-size: 15px; border-radius: inherit; }
.rows.links li:first-child button { border-radius: 12px 12px 0 0; }
.rows.links li:last-child button { border-radius: 0 0 12px 12px; }
.rows.links li:only-child button { border-radius: 12px; }
.rows.links button:hover { background: var(--fill); }
.rows.links .name { flex: 1 1 auto; min-width: 0; }
.rows.links .sub { display: block; font-size: 13px; color: var(--label2); }
.rows.links .chev { color: var(--label3); font-size: 13px; }
.rows.links .num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--fill2); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--label2); }
.ins .foot { margin-top: 16px; font-size: 12.5px; line-height: 1.45; color: var(--label2); }

/* barra de vistas */
#toolbar {
  position: absolute; bottom: var(--pad); left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2);
  transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 15px; max-width: calc(100% - var(--side) - var(--insp) - 5 * var(--pad));
}
.seg { display: flex; padding: 2px; border-radius: 9px; background: var(--fill); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { height: 30px; padding: 0 13px; border-radius: 7px; font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--label); }
.seg button[aria-pressed="true"] { background: var(--thumb); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .06); }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; background: var(--fill); font-size: 13px; font-weight: 500; white-space: nowrap; flex: none; }
.tb:hover { background: var(--fill2); }
.tb svg { font-size: 15px; }
.tb svg.chev { font-size: 12px; color: var(--label2); margin-left: -2px; }
.tb.icon { width: 34px; padding: 0; justify-content: center; }
.tb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tb[disabled] { opacity: .45; cursor: default; }
svg.ic.fill { fill: currentColor; stroke: none; }

/* rótulos da cena */
.lab {
  position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap;
  font-size: 12.5px; line-height: 1.2; font-weight: 500; letter-spacing: -.003em; color: var(--label); padding: 2px 6px; border-radius: 7px;
  text-shadow: 1px 0 0 var(--fog), -1px 0 0 var(--fog), 0 1px 0 var(--fog), 0 -1px 0 var(--fog), 1px 1px 0 var(--fog), -1px -1px 0 var(--fog), 1px -1px 0 var(--fog), -1px 1px 0 var(--fog),
    0 0 3px var(--fog), 0 0 6px var(--fog), 0 0 9px var(--fog);
}
.lab:hover { color: var(--accent); }
.lab.sel { background: var(--accent); color: var(--on-accent); text-shadow: none; font-weight: 600; }
.lab.note { pointer-events: none; font-weight: 400; font-size: 12px; color: var(--label2); padding: 0; }
.lab.hot {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 13px; text-shadow: none;
  color: var(--accent); font-weight: 600; background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: 0 3px 12px rgba(0, 0, 0, .12);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
}
.lab.hot svg { font-size: 14px; stroke-width: 2; }
#leaders line { stroke: var(--label2); stroke-width: .75; opacity: .8; }
#leaders circle { fill: var(--bg0); stroke: var(--label); stroke-width: 1.2; }
#tip { position: absolute; left: 0; top: 0; pointer-events: none; padding: 4px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
/* cartão do passo a passo */
#stepper {
  position: absolute; bottom: calc(var(--pad) + 62px); left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2); transform: translateX(-50%);
  width: min(580px, calc(100% - var(--side) - var(--insp) - 5 * var(--pad))); border-radius: 16px; padding: 14px 16px 12px; overflow: hidden;
}
.st-count { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--label2); font-variant-numeric: tabular-nums; }
#stepper h2 { margin: 1px 0 0; font-size: 19px; line-height: 1.2; font-weight: 700; letter-spacing: -.015em; }
.st-text { margin: 6px 0 0; font-size: 14.5px; line-height: 1.42; color: var(--label); min-height: 4.2em; max-width: 64ch; }
.st-ctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.st-ctl .grow { flex: 1 1 auto; }
.tb.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 0 14px; }
.tb.primary:hover { background: var(--accent); filter: brightness(1.07); }
.st-dots { display: flex; gap: 5px; align-items: center; }
.st-dots button { width: 8px; height: 8px; border-radius: 50%; background: var(--fill2); padding: 0; position: relative; }
.st-dots button::after { content: ""; position: absolute; inset: -7px -3px; }
.st-dots button[aria-current="true"] { background: var(--accent); width: 20px; border-radius: 4px; }
.st-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); opacity: .9; }
#busy { position: absolute; top: 46%; left: calc(var(--side) + 2 * var(--pad) + (100% - var(--side) - var(--insp) - 4 * var(--pad)) / 2); transform: translate(-50%, -50%); padding: 9px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--label2); }
#nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--label2); }

/* celular e tablet: folha inferior */
@media (max-width: 900px) {
  :root { --pad: 10px; }
  #toolbar { top: calc(var(--pad) + env(safe-area-inset-top, 0px)); bottom: auto; left: var(--pad); right: var(--pad); transform: none; max-width: none; gap: 6px; }
  .seg { flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: 1 0 auto; padding: 0 6px; text-align: center; font-size: 12.5px; }
  #panes {
    display: flex; flex-direction: column; position: absolute; left: 0; right: 0; bottom: 0; height: var(--sheet, 46%); max-height: calc(100% - 64px - env(safe-area-inset-top, 0px));
    border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .32s cubic-bezier(.2, .85, .25, 1);
    background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  }
  #panes.drag { transition: none; }
  #grab { display: block; flex: none; width: 100%; height: 22px; touch-action: none; cursor: grab; }
  #grab::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 7px auto 0; }
  #sidebar, #inspector { position: static; width: auto; max-height: none; flex: 1 1 auto; min-height: 0; border-radius: 0; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #panes[data-pane="list"] #inspector, #panes[data-pane="detail"] #sidebar { display: none; }
  .search { margin-top: 2px; }
  .ins { padding: 4px 16px 20px; }
  .ins h1 { font-size: 24px; }
  #busy { left: 50%; top: 30%; }
  #stepper { left: var(--pad); right: var(--pad); bottom: calc(var(--sheet, 46%) + 8px); transform: none; width: auto; padding: 11px 13px 10px; }
  #stepper h2 { font-size: 17px; }
  .st-text { font-size: 13.5px; min-height: 0; }
  /* com a folha levantada, o cartão sai da frente da cena */
  #app[data-sheet="half"] #stepper, #app[data-sheet="full"] #stepper { display: none; }
}
/* cartão do gráfico: serotonina na fenda, chave do ISRS e botão de disparo */
/* no computador ele fica no alto da coluna da direita, e a ficha começa logo abaixo (--gh = altura do cartão) */
#gcard { position: absolute; top: var(--pad); right: var(--pad); width: var(--insp); padding: 13px 16px 13px; border-radius: 18px; }
@media (min-width: 901px) {
  #inspector { top: calc(var(--pad) + var(--gh, 270px) + 12px); max-height: calc(100% - 2 * var(--pad) - var(--gh, 270px) - 12px); }
}
.g-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.g-head h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.g-svg { display: block; width: 100%; height: 116px; margin-top: 8px; overflow: visible; }
.g-svg .ax { stroke: var(--sep); stroke-width: 1; fill: none; }
.g-svg .tk { font-size: 10px; fill: var(--label3); font-family: var(--font); }
.g-svg .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.g-svg .ln.off { stroke: var(--g-off); } .g-svg .ln.on { stroke: var(--g-on); }
.g-svg .ln.ghost { opacity: .45; stroke-dasharray: 3 3; stroke-width: 1.6; }
.g-svg .pt { stroke: var(--bg0); stroke-width: 1.5; }
.g-svg .pt.off { fill: var(--g-off); } .g-svg .pt.on { fill: var(--g-on); }
.g-leg { display: flex; align-items: center; gap: 6px; margin: 6px 0 0; font-size: 11.5px; color: var(--label2); }
.g-leg .k { width: 14px; height: 3px; border-radius: 2px; flex: none; } .g-leg .k.on { margin-left: 8px; }
.g-leg .k.off { background: var(--g-off); } .g-leg .k.on { background: var(--g-on); }
.g-read { margin: 7px 0 0; font-size: 12.5px; line-height: 1.35; color: var(--label); font-variant-numeric: tabular-nums; min-height: 34px; }
.g-ctl { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.g-note { font-size: 10.5px; line-height: 1.25; color: var(--label3); }
#fire { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#fire:hover { background: var(--accent-soft); filter: brightness(.96); }
/* chave liga/desliga */
.sw { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--label2); flex: none; }
.sw-t { position: relative; width: 38px; height: 23px; border-radius: 12px; background: var(--fill2); transition: background .18s ease; }
.sw-t span { position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .28); transition: transform .18s ease; }
.sw[aria-checked="true"] { color: var(--g-on); }
.sw[aria-checked="true"] .sw-t { background: var(--g-on); }
.sw[aria-checked="true"] .sw-t span { transform: translateX(15px); }
/* linha da busca com a chave de idioma */
.srow { display: flex; align-items: center; gap: 8px; margin: 12px 12px 6px; flex: none; }
.srow .search { margin: 0; flex: 1 1 auto; min-width: 0; }
.home + .srow { margin-top: 7px; }
.lang { display: flex; flex: none; padding: 2px; border-radius: 9px; background: var(--fill); }
.lang button { height: 30px; min-width: 32px; padding: 0 7px; border-radius: 7px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--label2); text-align: center; }
.lang button[aria-pressed="true"] { background: var(--thumb); color: var(--label); box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .06); }
/* voltar ao hub: no computador, no alto da lista; em tela estreita, no começo da barra de vistas */
.home { display: flex; align-items: center; gap: 3px; align-self: flex-start; flex: none; margin: 11px 12px 0; padding: 2px 6px 2px 2px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
.home:hover { background: var(--accent-soft); }
.home svg { font-size: 13px; stroke-width: 2; }
a.tb { color: var(--label); text-decoration: none; }
.home-tb { display: none; }
@media (max-width: 900px) {
  #sidebar .home { display: none; }
  .srow, .home + .srow { margin-top: 2px; }
  .home-tb { display: inline-flex; }
}

/* tela estreita: o cartão do gráfico fica compacto, logo abaixo da barra de vistas */
@media (max-width: 900px) {
  #gcard {
    top: calc(var(--pad) + env(safe-area-inset-top, 0px) + 54px); left: var(--pad); right: var(--pad); width: auto; padding: 9px 12px 10px; border-radius: 15px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(128px, 38%); grid-template-areas: "head head" "read svg" "ctl svg"; column-gap: 12px; row-gap: 5px; align-items: center;
  }
  #gcard .g-head { grid-area: head; }
  #gcard .g-svg { grid-area: svg; height: 62px; margin: 0; }
  #gcard .g-svg .tk { display: none; }
  #gcard .g-read { grid-area: read; margin: 0; min-height: 0; font-size: 12px; }
  #gcard .g-ctl { grid-area: ctl; margin: 0; }
  #gcard .g-leg, #gcard .g-note { display: none; }
  #app[data-sheet="half"] #gcard, #app[data-sheet="full"] #gcard { display: none; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== comum a todos os itens (fontes/comum/comum.css) ===== */
/* painéis laterais recolhíveis. Recolhido, o painel some e a largura dele sai da conta que centraliza
   a barra de vistas e o cartão de passos; por isso --side e --insp viram "menos uma margem". */
@media (min-width: 901px) {
  #app[data-left="off"] #sidebar { display: none; }
  #app[data-left="off"] { --side: calc(-1 * var(--pad)); }
  #app[data-left="off"] .home-tb { display: inline-flex; } /* o link de voltar ao hub mora na lista */
  #app[data-right="off"] #inspector { display: none; }
  #app[data-right="off"]:not(.keep-right) { --insp: calc(-1 * var(--pad)); }
}

, e n\xE3o s\xF3 do transmissor. Um mesmo transmissor ativa v\xE1rios subtipos de receptor.",more:["\xC9 uma via mais lenta que a de um canal i\xF4nico, mas amplifica o sinal e dura mais.",{x:"Existe tamb\xE9m um receptor de serotonina que \xE9 canal i\xF4nico, o 5-HT3."}],where:"Os cilindros azuis na membrana de baixo. Eles se acendem enquanto h\xE1 serotonina ligada.",rel:["serotonina","proteina-g","pos"]},{id:"proteina-g",g:"pos",name:"Prote\xEDna G",color:"#63B76C",morf:"Prote\xEDna de tr\xEAs subunidades (\u03B1, \u03B2 e \u03B3), presa \xE0 face interna da membrana. Em repouso, a \u03B1 segura um GDP.",func:"Ativada pelo receptor, troca o GDP por GTP e se divide em duas partes, que agem sobre prote\xEDnas efetoras: um canal ou uma enzima.",clueTitle:"Como ela desliga",clue:"A pr\xF3pria subunidade \u03B1 quebra o GTP em GDP. Com isso ela se desliga sozinha, e o ciclo recome\xE7a.",more:["Pela via de atalho, a prote\xEDna G abre um canal direto. Pela cascata, liga uma enzima que produz segundos mensageiros.","Um receptor ativado aciona de 10 a 20 prote\xEDnas G: o sinal \xE9 amplificado."],where:"Os tr\xEAs gr\xE3os verdes embaixo de cada receptor, do lado de dentro.",rel:["receptor","pos"]},{id:"transportador",g:"fim",name:"Transportador de recapta\xE7\xE3o",aka:"Transportador de serotonina",color:"#1FA39A",morf:"Prote\xEDna da membrana do terminal, espec\xEDfica para a serotonina.",func:"Traz a serotonina da fenda de volta para o citosol do terminal. \xC9 assim que a a\xE7\xE3o dela termina.",clueTitle:"De onde vem a energia",clue:"Ele n\xE3o quebra ATP. Funciona por cotransporte: dois Na\u207A entram junto com cada mol\xE9cula de transmissor, a favor do gradiente de Na\u207A que as bombas criaram.",more:["Consegue concentrar o transmissor at\xE9 10 mil vezes.","\xC9 nos transportadores que agem a coca\xEDna, as anfetaminas e alguns medicamentos psiqui\xE1tricos.",{x:"O nome t\xE9cnico deste transportador \xE9 SERT."}],where:"As prote\xEDnas verde-azuladas na  primeiro passo, e este modelo mostra apenas ele."}],where:"As c\xE1psulas magenta na boca dos transportadores, com a chave ISRS ligada. No modelo, 5 dos 6 transportadores ficam ocupados.",rel:["transportador","serotonina","fenda"]}],Aw=Object.fromEntries(Xu.map(i=>[i.id,i])),Wp=[{id:"syn",name:"Sinapse"},{id:"cleft",name:"Fenda"},{id:"sert",name:"Transportador"}],Xp=[{id:"chegada",stage:"syn",view:"syn",dur:4200,title:"O potencial de a\xE7\xE3o chega",text:"O potencial de a\xE7\xE3o desce pelo ax\xF4nio e despolariza o terminal. Os canais de Ca\xB2\u207A dependentes de voltagem abrem, e o Ca\xB2\u207A entra.",ids:["terminal","canal-ca","calcio"]},{id:"liberacao",stage:"syn",view:"cleft",dur:5200,title:"A serotonina sai na fenda",text:"O Ca\xB2\u207A faz as ves\xEDculas atracadas se fundirem com a membrana: \xE9 a exocitose. A serotonina cai na fenda e se espalha.",ids:["vesicula","zona-ativa","serotonina","fenda"]},{id:"receptor",stage:"syn",view:"cleft",dur:5600,title:"O receptor aciona a prote\xEDna G",text:"A serotonina se liga aos receptores do neur\xF4nio seguinte. Cada receptor ocupado ativa prote\xEDnas G, que agem sobre canais e enzimas. \xC9 uma via lenta, que amplifica e dura.",ids:["receptor","proteina-g","pos"]},{id:"recaptacao",stage:"syn",view:"sert",dur:7600,title:"A recapta\xE7\xE3o limpa a fenda",text:"O transportador leva a serotonina de volta ao terminal, com dois Na\u207A por mol\xE9cula. A fenda esvazia, os receptores se soltam e o sinal termina.",ids:["transportador","sodio","serotonina"]},{id:"destino",stage:"syn",view:"syn",dur:6400,title:"De volta ao terminal",text:"A serotonina recaptada tem dois destinos: \xE9 recarregada em uma ves\xEDcula ou \xE9 destru\xEDda pela MAO, na superf\xEDcie das mitoc\xF4ndrias.",ids:["vesicula","mao","mitocondria"]},{id:"isrs",stage:"syn",view:"sert",dur:5600,title:"Entra o ISRS",text:"O f\xE1rmaco se liga ao transportador de serotonina. Com o transportador ocupado, a recapta\xE7\xE3o fica bloqueada.",ids:["isrs","transportador"]},{id:"efeito",stage:"syn",view:"cleft",dur:11e3,title:"O mesmo disparo, com o ISRS",text:"No modelo, o potencial de a\xE7\xE3o libera a mesma quantidade de serotonina. Mas ela demora a sair da fenda, e os receptores ficam ocupados por mais tempo. Compare as duas curvas do gr\xE1fico.",ids:["isrs","serotonina","receptor","fenda"]},{id:"limites",stage:"syn",view:"syn",dur:2600,title:"O que o modelo n\xE3o mostra",text:"Extra, de fora dos cap\xEDtulos 1 a 6: o bloqueio do transportador acontece em horas, mas a melhora do humor costuma levar semanas. Mais serotonina na fenda \xE9 s\xF3 o primeiro passo.",ids:["isrs"]}];var bs={groups:{pre:"Presynaptic terminal",fenda:"Cleft",pos:"Postsynaptic neuron",fim:"End of the signal",farm:"Drug"},views:{syn:"Synapse",cleft:"Cleft",sert:"Transporter"},path:{},steps:{chegada:{title:"The action potential arrives",text:"The action potential travels down the axon and depolarizes the terminal. The voltage-gated Ca\xB2\u207A channels open, and Ca\xB2\u207A enters."},liberacao:{title:"Serotonin is released into the cleft",text:"Ca\xB2\u207A makes the docked vesicles fuse with the membrane: this is exocytosis. Serotonin spills into the cleft and spreads."},receptor:{title:"The receptor activates the G-protein",text:"Serotonin binds to the receptors of the next neuron. Each occupied receptor activates G-proteins, which act on channels and enzymes. It is a slow pathway that amplifies and lasts."},recaptacao:{title:"Reuptake clears the cleft",text:"The transporter carries serotonin back into the terminal, with two Na\u207A per molecule. The cleft empties, the receptors let go and the signal ends."},destino:{title:"Back in the terminal",text:"Serotonin that has been taken back up has two fates: it is reloaded into a vesicle or destroyed by MAO, on the surface of the mitochondria."},isrs:{title:"The SSRI comes in",text:"The drug binds to the serotonin transporter. With the transporter occupied, reuptake is blocked."},efeito:{title:"The same firing, with the SSRI",text:"In the model, the action potential releases the same amount of serotonin. But it takes longer to leave the cleft, and the receptors stay occupied for longer. Compare the two curves on the graph."},limites:{title:"What the model does not show",text:"Extra, from outside chapters 1 to 6: the transporter is blocked within hours, but the improvement in mood usually takes weeks. More serotonin in the cleft is only the first step."}},items:{terminal:{name:"Serotonergic terminal",aka:"Presynaptic axon terminal",morf:"Tip of the axon of a neuron that uses serotonin. Inside it has vesicles, mitochondria and the enzymes that make the transmitter.",func:"Makes, stores and releases serotonin. Then it takes it back up from the cleft, through the transporters in its own membrane.",clueTitle:"Why it matters",clue:"Only the small transmitter is assembled in the terminal. The enzymes come from the soma, because the axon does not make proteins.",more:["The neurons that use serotonin are few, but they play a role in mood, emotional behavior and sleep.",{x:"The cell bodies of these neurons are in the raphe nuclei, in the brain stem, and their axons spread through much of the brain. That is a subject of chapter 15."}],where:"The blue bulb at the top, cut open, and the axon that reaches it."},vesicula:{name:"Synaptic vesicle",rows:[["Size","about 50 nm"]],morf:"Sphere of membrane filled with neurotransmitter.",func:"Stores serotonin and releases it into the cleft by exocytosis, when Ca\xB2\u207A enters the terminal.",clueTitle:"How it fills up",clue:"A transporter in the vesicle membrane swaps one H\u207A going out for one transmitter molecule coming in. An ATP-driven H\u207A pump keeps the vesicle acidic.",more:["This transporter concentrates the transmitter up to 100,000 times.","The vesicles docked at the active zone are released first. After exocytosis, the membrane is recovered by endocytosis and the vesicle is refilled.","SNARE proteins hold the vesicle to the membrane, and synaptotagmin is the Ca\xB2\u207A sensor that triggers fusion."],where:"The pale yellow spheres inside the terminal. The ones at the bottom are docked at the active zones."},"zona-ativa":{name:"Active zone",morf:"Patch of the presynaptic membrane where the vesicles are docked, facing the cleft.",func:"It is the site of release. The Ca\xB2\u207A channels sit right next to the docked vesicles, which is why exocytosis is so fast.",where:"The dark bars on the floor of the terminal."},"canal-ca":{name:"Voltage-gated Ca\xB2\u207A channel",morf:"Protein in the membrane of the terminal, a relative of the Na\u207A channels of the action potential, but one that lets Ca\xB2\u207A through.",func:"Opens when the action potential depolarizes the terminal. The Ca\xB2\u207A that enters is the signal to release the transmitter.",where:"The lilac rings on the floor of the terminal, between the active zones."},calcio:{name:"Calcium (Ca\xB2\u207A)",rows:[["Outside","2 mM"],["Inside","0.0002 mM"]],morf:"Ion ten thousand times more concentrated outside the neuron.",func:"Enters through the open channels and makes the docked vesicles fuse with the membrane.",more:["Near the active zone, the concentration rises above 0.01 mM when the channels open."],where:"The lilac dots that enter the terminal when the action potential arrives."},mitocondria:{name:"Mitochondrion",rows:[["Size","about 1 \xB5m"]],morf:"Elongated organelle, with a folded inner membrane.",func:"Makes the ATP of the terminal. Its outer membrane carries MAO.",more:["The axon terminal has many mitochondria: a sign of high energy use."],where:"The two reddish organelles inside the terminal."},serotonina:{name:"Serotonin",aka:"5-HT",rows:[["Family","Amine"],["Made from","Tryptophan"]],morf:"Small molecule, of the amine family. It is made in the cytosol of the terminal, from the amino acid tryptophan.",func:"It is the neurotransmitter of this synapse. Released into the cleft, it binds to the receptors of the next neuron.",clueTitle:"The synthesis route",clue:"Tryptophan \u2192 5-HTP \u2192 serotonin. What limits production is the tryptophan available, which comes from the blood and, before that, from the diet.",more:["Its action ends by reuptake: a specific transporter carries it back into the terminal.","Inside the terminal, it goes back into a vesicle or is destroyed by MAO."],where:"The bright yellow spheres, loose in the cleft after the firing. Before that, they are stored inside the vesicles."},fenda:{name:"Synaptic cleft",rows:[["Width","20 to 50 nm"]],morf:"Space between the presynaptic membrane and the postsynaptic membrane.",func:"It is what the transmitter crosses. While the transmitter is there, the receptors keep being activated.",clueTitle:"Three ways to clear the cleft",clue:"Diffusion away, reuptake by transporters and breakdown by enzymes. At this synapse, it is reuptake that ends the action.",where:"The gap between the terminal and the neuron below. In the model it is greatly exaggerated."},pos:{name:"Postsynaptic neuron",morf:"The neuron that receives the signal. Its membrane, facing the terminal, has the receptors.",func:"Reads serotonin through the receptors. G-protein-coupled receptors open or close channels indirectly and change the metabolism of the cell.",where:"The peach-colored bulb at the bottom, cut open, and the dendrite it comes from."},receptor:{name:"Serotonin receptor",morf:"Protein in the postsynaptic membrane. Several serotonin receptors are G-protein-coupled: a single polypeptide that crosses the membrane seven times.",func:"When serotonin binds, the receptor changes shape and activates G-proteins on the inner side of the membrane.",clueTitle:"Why it matters",clue:"The effect depends on the receptor, not only on the transmitter. The same transmitter activates several receptor subtypes.",more:["It is a slower pathway than that of an ion channel, but it amplifies the signal and lasts longer.",{x:"There is also a serotonin receptor that is an ion channel, 5-HT3."}],where:"The blue cylinders in the membrane below. They light up while serotonin is bound."},"proteina-g":{name:"G-protein",morf:"Protein with three subunits (\u03B1, \u03B2 and \u03B3), attached to the inner face of the membrane. At rest, \u03B1 holds a GDP.",func:"Activated by the receptor, it swaps GDP for GTP and splits into two parts, which act on effector proteins: a channel or an enzyme.",clueTitle:"How it switches off",clue:"The \u03B1 subunit itself breaks GTP down to GDP. That way it switches itself off, and the cycle starts again.",more:["Through the shortcut pathway, the G-protein opens a channel directly. Through the cascade, it switches on an enzyme that makes second messengers.","One activated receptor activates 10 to 20 G-proteins: the signal is amplified."],where:"The three green grains under each receptor, on the inner side."},transportador:{name:"Reuptake transporter",aka:"Serotonin transporter",morf:"Protein in the membrane of the terminal, specific for serotonin.",func:"Brings serotonin from the cleft back into the cytosol of the terminal. That is how its action ends.",clueTitle:"Where the energy comes from",clue:"It does not break down ATP. It works by cotransport: two Na\u207A enter together with each transmitter molecule, down the Na\u207A gradient that the pumps created.",more:["It can concentrate the transmitter up to 10,000 times.","Transporters are where cocaine, amphetamines and some psychiatric drugs act.",{x:"The technical name of this transporter is SERT."}],where:"The blue-green proteins at the edge of the floor of the terminal, with the mouth facing the cleft."},sodio:{name:"Sodium (Na\u207A)",rows:[["Outside","150 mM"],["Inside","15 mM"]],morf:"Cation ten times more concentrated outside the neuron.",func:"Pays for reuptake: as it enters down its gradient, it carries serotonin along through the transporter.",where:"The orange dots, smaller than serotonin. Two enter with each molecule taken back up."},mao:{name:"MAO",aka:"Monoamine oxidase",morf:"Enzyme attached to the outer membrane of the mitochondria.",func:"Destroys the serotonin that returned to the terminal and was not reloaded into a vesicle.",more:[{x:"There are antidepressants that act here, and not on the transporter: the MAO inhibitors."}],where:"The red grains on the surface of the mitochondria."},isrs:{name:"SSRI",aka:"Selective serotonin reuptake inhibitor",rows:[["Example in the book","Fluoxetine (Prozac)"]],morf:"Drug that binds to the serotonin transporter.",func:"Occupies the transporter and blocks reuptake. The serotonin that is released stays longer in the cleft and activates the receptors for longer.",clueTitle:"In pharmacology terms",clue:"It is an inhibitor: it blocks the function of a protein involved in synaptic transmission. It does not mimic the transmitter (that would be an agonist) and it does not occupy the receptor (that would be an antagonist).",more:[{x:'"Selective" means that it acts on the serotonin transporter much more than on those of other amines.'},{x:"Other SSRIs: sertraline, escitalopram, paroxetine and citalopram."},{x:"Imaging studies indicate that, at usual doses, about 80% of the transporters are occupied. In the model, it is 5 of 6."},{x:"The transporter is blocked within hours, but the improvement in mood usually takes weeks. More serotonin in the cleft is only the first step, and this model shows only that step."}],where:"The magenta capsules in the mouth of the transporters, with the SSRI switch on. In the model, 5 of the 6 transporters are occupied."}}};var qp="neurohub.lang",qu=["pt","en"],HS=()=>{try{return localStorage.getItem(qp)}catch{return null}},Yp=i=>{try{localStorage.setItem(qp,i)}catch{}};function WS(){let i=null;try{i=new URLSearchParams(location.search).get("lang")}catch{}if(qu.includes(i))return Yp(i),i;let t=HS();return qu.includes(t)?t:(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"pt"]).m
